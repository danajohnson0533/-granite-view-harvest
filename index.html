function renderReports(){const rows=fieldSummary(),ownerMap={};for(const r of rows){ownerMap[r.owner]=(ownerMap[r.owner]||0)+r.dry15}$('#reports').innerHTML=`<div class="printonly"><h1>Granite View Farms Harvest — ${data.cropYear.year}</h1></div><h1 class="title">Fields / Reports</h1><p class="sub">Field, owner/entity and crop-year production. Elevator direct-from-field tickets stay separate from bin inventory.</p><div class="grid g2"><div class="card"><div class="head">OWNER / ENTITY TOTALS</div><div class="body">${Object.entries(ownerMap).map(([o,b])=>`<div class="queue"><div><b>${esc(o)}</b></div><div><b>${num(b,0)} bu @15% / adjusted</b></div></div>`).join('')||'<div class="empty">No owner totals yet.</div>'}</div></div><div class="card"><div class="head">CROP YEAR</div><div class="body"><div class="kpi">${data.cropYear.year}</div><div class="muted">Status: ${esc(data.cropYear.status)}</div><div class="notice info" style="margin-top:10px">A new calendar year will not automatically switch crop years. Carryover grain can stay assigned to the old crop.</div></div></div></div><div class="bar noprint"><button id="printReport" class="btn primary">🖨️ Print All Fields</button></div><div class="card"><div class="head">ALL FIELD SUMMARIES</div><div class="body tablewrap">${rows.length?`<table class="table"><thead><tr><th>Field</th><th>Owner</th><th>Wet Bu</th><th>Avg Moisture</th><th>15% / Adjusted Bu</th><th>Direct Elevator</th><th>Acres</th><th>Yield</th><th class="noprint">Action</th></tr></thead><tbody>${rows.map(r=>{const acreRec=data.acres.find(a=>a.field_season_id===r.fsId&&a.harvest_type==='dry_corn'),ac=Number(acreRec?.harvested_acres||0),avg=r.wet? r.moistMass/(r.wet*56):0,y=ac?r.dry15/ac:0;return `<tr><td><b>${esc(r.field)}</b></td><td>${esc(r.owner)}</td><td>${num(r.wet,0)}</td><td>${r.wet?num(avg,1)+'%':'—'}</td><td>${num(r.dry15,0)}</td><td>${num(r.direct,0)}</td><td>${ac?num(ac,1):'—'}</td><td>${ac?num(y,1):'—'}</td><td class="noprint"><button class="btn setAcres" data-fs="${r.fsId}">Acres</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No completed harvest production yet.</div>'}</div></div><div class="card noprint" style="margin-top:14px"><div class="head">RECENT LOADS — CORRECT MISTAKES</div><div class="body">${data.loads.filter(l=>l.status==='completed').slice(0,20).map(l=>`<div class="queue"><div><b>#${l.load_number} ${esc(truckName(l.truck_id))}</b><div class="small muted">${esc(fieldText(l))} • ${num(l.moisture_percent,1)}% • ${dt(l.completed_at)}</div></div><button class="btn correctLoad" data-id="${l.id}">Correct</button></div>`).join('')||'<div class="empty">No completed loads.</div>'}</div></div>`;$('#printReport').onclick=()=>print();$$('.setAcres').forEach(b=>b.onclick=()=>setAcres(b.dataset.fs));$$('.correctLoad').forEach(b=>b.onclick=()=>correctLoadModal(b.dataset.id))}
async function needAdmin(){if(isAdmin())return true;return new Promise(resolve=>{modal('Admin PIN',`<p>Enter the GVF Harvest Admin PIN to make protected changes. Admin mode stays unlocked for 15 minutes.</p><div class="field"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric"></div><button id="pinBtn" class="btn gold big" style="margin-top:12px">UNLOCK ADMIN MODE</button>`,()=>{$('#pinBtn').onclick=async()=>{try{const r=await call('adminVerify',{pin:$('#pin').value});adminToken=r.token;adminExpires=Date.now()+r.expiresMinutes*60000;sessionStorage.setItem('gvf_admin',adminToken);sessionStorage.setItem('gvf_admin_exp',String(adminExpires));closeModal();renderSettings();resolve(true)}catch(e){toast(esc(e.message))}}})})}
async function setAcres(fsId){if(!await needAdmin())return;const current=data.acres.find(a=>a.field_season_id===fsId&&a.harvest_type==='dry_corn');const v=prompt('Harvested acres for this field (Dry Corn):',current?.harvested_acres||'');if(v===null)return;try{await call('master',{op:'setAcres',fieldSeasonId:fsId,harvestType:'dry_corn',acres:Number(v||0)});toast('Acres updated.');await refresh(true)}catch(e){toast(esc(e.message))}}
async function correctLoadModal(id){if(!await needAdmin())return;const l=data.loads.find(x=>x.id===id),p=portionsFor(l.id)[0],fieldId=data.fieldSeasons.find(x=>x.id===p?.field_season_id)?.field_id;modal(`Correct Load #${l.load_number}`,`<div class="notice"><b>Original values remain in the audit log.</b></div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Truck</label><select id="clTruck">${options(data.trucks,l.truck_id)}</select></div><div class="field"><label>Driver</label><select id="clDriver">${options(data.drivers,l.driver_id)}</select></div><div class="field"><label>Field</label><select id="clField">${options(data.fields,fieldId)}</select></div><div class="field"><label>Moisture</label><input id="clM" type="number" value="${l.moisture_percent??''}"></div><div class="field"><label>Gross lb</label><input id="clG" type="number" value="${l.gross_lb??''}"></div><div class="field"><label>Tare lb</label><input id="clT" type="number" value="${l.tare_lb??''}"></div><div class="field"><label>Destination</label><select id="clDest">${options(data.storage,l.destination_storage_id)}</select></div></div><button id="saveCorrection" class="btn good big" style="margin-top:12px">SAVE CORRECTION</button>`,()=>{$('#saveCorrection').onclick=async()=>{try{await call('correctLoad',{loadId:id,truck_id:$('#clTruck').value,driver_id:$('#clDriver').value,fieldId:$('#clField').value,moisture_percent:Number($('#clM').value),gross_lb:Number($('#clG').value),tare_lb:Number($('#clT').value),destination_storage_id:$('#clDest').value});closeModal();toast('✅ Load corrected and totals recalculated.');await refresh(true)}catch(e){toast(esc(e.message),5200)}}})}
function renderSettings(){const unlocked=isAdmin();if(!unlocked&&adminToken)clearAdmin();$('#settings').innerHTML=`<h1 class="title">Settings</h1><p class="sub">Normal harvest use is password-free. Major changes require the Admin PIN.</p><div class="grid g2"><div class="card"><div class="head">ADMIN MODE</div><div class="body"><div class="adminline"><span class="pill ${unlocked?'good':'warn'}">${unlocked?'UNLOCKED':'LOCKED'}</span><b>${unlocked?'Protected settings available for this session':'Normal harvest controls remain available'}</b></div><button id="adminToggle" class="btn ${unlocked?'red':'gold'}" style="margin-top:12px">${unlocked?'LOCK ADMIN MODE':'UNLOCK WITH ADMIN PIN'}</button></div></div><div class="card"><div class="head">THIS DEVICE</div><div class="body"><div class="statusbox"><b>${esc(deviceName())}</b><br><span class="small muted">Cloud-connected farm device • ${navigator.onLine?'Online':'Offline'}</span></div><button id="notifBtn" class="btn" style="margin-top:10px">Enable Notifications on This Device</button></div></div></div><div class="card" style="margin-top:14px"><div class="head">TRUCKS / DRIVERS / FIELDS / OWNERS</div><div class="body">${unlocked?masterManager():`<div class="notice info">Unlock Admin Mode to add or rename trucks, drivers, fields, owners, or change field ownership.</div>`}</div></div><div class="card" style="margin-top:14px"><div class="head">LIVE SYSTEM</div><div class="body"><div class="grid g3"><div><div class="small muted">App</div><b>GVF Harvest Live Beta 1.6.8</b></div><div><div class="small muted">Crop Year</div><b>${data.cropYear.year}</b></div><div><div class="small muted">Backend</div><b>Supabase Cloud</b></div></div><div class="section"></div><div class="small muted">WI-127 live scale reading is enabled on supported Windows Chrome devices. RFID, traffic-light hardware control, and Dryer Master 510 automation are the next hardware integrations.</div></div></div>`;$('#adminToggle').onclick=async()=>{if(unlocked){clearAdmin();renderSettings()}else await needAdmin()};$('#notifBtn').onclick=async()=>{if(!('Notification'in window))return toast('Notifications are not supported in this browser.');const p=await Notification.requestPermission();toast(p==='granted'?'Notifications allowed on this device.':'Notifications were not allowed.');};if(unlocked)bindMaster()}
function masterManager(){const rows=(kind,arr)=>arr.map(x=>`<div class="queue"><div><b>${esc(x.name)}</b>${kind==='field'?`<div class="small muted">Owner: ${esc(ownerBySeason(fieldSeasonByField(x.id)?.id)?.name||'Unassigned')}</div>`:''}</div><button class="btn rename" data-kind="${kind}" data-id="${x.id}" data-name="${esc(x.name)}">Rename</button></div>`).join('');return `<div class="grid g4"><div><h3>Trucks</h3><div class="row"><input id="newTruck" placeholder="New truck" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="truck">Add</button></div>${rows('truck',data.trucks)}</div><div><h3>Drivers</h3><div class="row"><input id="newDriver" placeholder="New driver" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="driver">Add</button></div>${rows('driver',data.drivers)}</div><div><h3>Owners</h3><div class="row"><input id="newOwner" placeholder="New owner" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="owner">Add</button></div>${rows('owner',data.owners)}</div><div><h3>Fields</h3><div class="row"><input id="newField" placeholder="New field" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="field">Add</button></div><div style="max-height:420px;overflow:auto">${rows('field',data.fields)}</div></div></div><div class="section"></div><h3>Field Owner / Entity — ${data.cropYear.year}</h3><div class="tablewrap"><table class="table"><thead><tr><th>Field</th><th>Owner</th></tr></thead><tbody>${data.fields.map(f=>{const fs=fieldSeasonByField(f.id);return `<tr><td><b>${esc(f.name)}</b></td><td><select class="ownerAssign" data-fs="${fs?.id||''}"><option value="">Unassigned</option>${options(data.owners,fs?.owner_id)}</select></td></tr>`}).join('')}</tbody></table></div>`}
function bindMaster(){$$('.add').forEach(b=>b.onclick=async()=>{const kind=b.dataset.kind,input=$('#new'+kind[0].toUpperCase()+kind.slice(1));if(!input?.value.trim())return;try{await call('master',{op:'add',kind,name:input.value.trim()});toast('Added '+kind+'.');await refresh(true)}catch(e){toast(esc(e.message))}});$$('.rename').forEach(b=>b.onclick=async()=>{const name=prompt('Rename '+b.dataset.kind+':',b.dataset.name);if(name===null||!name.trim())return;try{await call('master',{op:'rename',kind:b.dataset.kind,id:b.dataset.id,name:name.trim()});toast('Renamed.');await refresh(true)}catch(e){toast(esc(e.message))}});$$('.ownerAssign').forEach(s=>s.onchange=async()=>{try{await call('master',{op:'assignOwner',fieldSeasonId:s.dataset.fs,ownerId:s.value||null});toast('Field owner updated.');await refresh(true)}catch(e){toast(esc(e.message))}})}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
setInterval(()=>{if(token()&&navigator.onLine&&(view==='combine'||view==='dashboard'||view==='dumping'))refresh(true)},7000);
updateNet();if(!token())$('#activate').classList.remove('hidden');else refresh();
</script>
</body></html>
