<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#65121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="gvf-live-version" content="live-beta-1-fixed">
<title>Granite View Farms Harvest</title>
<style>
:root{--maroon:#65121f;--maroon2:#7c1a2a;--gold:#d3a52f;--cream:#f5f0e5;--paper:#fffdf8;--ink:#1d232a;--muted:#6f7780;--line:#ded7ca;--green:#1c7b43;--red:#bb2f2f;--amber:#9a6710;--nav:#171b20;--shadow:0 10px 30px #2c1a120f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#53101a,var(--maroon));color:white;display:flex;align-items:center;gap:12px;padding:10px 14px;box-shadow:0 4px 16px #0003}.logo{width:46px;height:46px;border:2px solid #e8c85e;border-radius:12px;display:grid;place-items:center;font-weight:950;color:#f5d66f;letter-spacing:-1px;background:#ffffff0d}.brand{line-height:1.05}.brand b{font-size:18px}.brand small{display:block;color:#f1d77d;font-weight:800;margin-top:4px}.topright{margin-left:auto;text-align:right;font-size:12px}.net{display:inline-flex;align-items:center;gap:6px;font-weight:800}.dot{width:9px;height:9px;border-radius:99px;background:#2cce70}.dot.off{background:#f3a31b}
.offline{display:none;background:#7b4200;color:#fff;padding:9px 14px;text-align:center;font-weight:850}.offline.show{display:block}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 66px)}
nav{background:var(--nav);padding:12px 9px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}nav button{width:100%;border:0;border-radius:11px;background:transparent;color:#f7f7f7;padding:13px 12px;text-align:left;margin:3px 0;font-weight:800;display:flex;gap:10px;align-items:center}nav button.active{background:var(--maroon2);box-shadow:inset 3px 0 0 var(--gold)}nav .sep{height:1px;background:#ffffff18;margin:10px 6px}
main{padding:18px;min-width:0}.view{display:none}.view.active{display:block}.title{margin:0;color:var(--maroon);font-size:27px;font-weight:950;letter-spacing:-.4px}.sub{color:var(--muted);margin:4px 0 16px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.head{background:var(--maroon);color:#fff;padding:10px 13px;font-size:13px;font-weight:900;letter-spacing:.4px}.body{padding:14px}.kpi{font-size:30px;font-weight:950;letter-spacing:-1px}.huge{font-size:48px;font-weight:950;letter-spacing:-2px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:9px;align-items:center}.wrap{flex-wrap:wrap}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:850;background:#ece8e0}.pill.good{background:#e8f4eb;color:var(--green)}.pill.warn{background:#fff0d4;color:#875600}.pill.bad{background:#fae6e3;color:var(--red)}
.btn{border:1px solid #c9c1b4;background:#fff;border-radius:10px;padding:11px 14px;font-weight:850;color:var(--ink)}.btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#261d06}.btn.good{background:var(--green);border-color:var(--green);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.big{padding:15px 18px;font-size:18px}.btn:disabled{opacity:.45}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:850;color:#535b63}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid #cfc7b9;border-radius:9px;background:#fff;padding:10px 11px}.field input[type=number]{font-variant-numeric:tabular-nums}
.notice{border:1px solid #dec88f;background:#fff7dd;border-radius:11px;padding:10px 12px}.notice.good{border-color:#b7d5bd;background:#eef9f0}.notice.info{border-color:#b9cadb;background:#eef6ff}.notice.bad{border-color:#e2b6b1;background:#fff0ee}.section{height:1px;background:var(--line);margin:12px 0}.progress{height:12px;border-radius:99px;background:#ebe7e0;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2d8c52,#5aae71)}
.scalehero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.weight{font-size:54px;font-weight:950;letter-spacing:-2px;color:var(--maroon)}.traffic{display:flex;gap:12px;align-items:center}.lamp{width:42px;height:42px;border-radius:50%;border:4px solid #272727;background:#d42d2d;box-shadow:inset 0 0 0 3px #0002}.lamp.green{background:#32b65d}.queue{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:8px;background:#fff}.queue.now{border:2px solid var(--gold);background:#fff9e8}.truck{font-size:28px;font-weight:950;color:var(--maroon)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{min-height:58px;border:1px solid #c8c1b7;border-radius:10px;background:#fff;font-size:23px;font-weight:900;touch-action:manipulation;-webkit-user-select:none;user-select:none}.moist{font-size:48px;font-weight:950;text-align:center;border:2px solid #d7cfc2;border-radius:12px;padding:10px;background:#fff;margin-bottom:10px}.destgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.dest{border:2px solid #d7d0c5;background:#fff;border-radius:12px;padding:17px 8px;font-weight:900}.dest.sel{border-color:var(--maroon);background:#f8ecee;color:var(--maroon)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e6e0d7;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#5e646a;background:#faf7f1}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button.sel{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.modalbg{position:fixed;inset:0;background:#0008;display:none;z-index:100;align-items:center;justify-content:center;padding:14px}.modalbg.show{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 24px 70px #0006}.modal .mhead{background:var(--maroon);color:#fff;padding:13px 15px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.modal .mbody{padding:15px}.toast{position:fixed;z-index:140;right:14px;bottom:14px;max-width:390px;background:#15191e;color:#fff;padding:13px 15px;border-radius:12px;box-shadow:0 15px 40px #0005;display:none}.toast.show{display:block}.empty{text-align:center;padding:28px;color:var(--muted)}
.activation{position:fixed;inset:0;background:linear-gradient(135deg,#4a0d16,#751626);z-index:200;display:grid;place-items:center;padding:18px}.activation .box{width:min(430px,100%);background:#fffaf2;border-radius:18px;padding:22px;box-shadow:0 24px 60px #0005}.activation .biglogo{width:74px;height:74px;border:3px solid var(--gold);border-radius:18px;background:var(--maroon);color:#f5d66f;font-size:27px;font-weight:950;display:grid;place-items:center;margin:0 auto 12px}.activation h1{text-align:center;color:var(--maroon);margin:0}.activation p{text-align:center;color:var(--muted)}
.adminline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.statusbox{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.photo{width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:10px;display:none}.printonly{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}nav{position:sticky;top:66px;height:auto;z-index:35;display:flex;overflow:auto;padding:6px}nav button{width:auto;flex:0 0 auto;white-space:nowrap;padding:10px 12px}main{padding:12px}.g2,.g3,.g4,.scalehero{grid-template-columns:1fr}.destgrid{grid-template-columns:1fr}.topright{display:none}.title{font-size:23px}}
@media(max-width:560px){input,select,textarea{font-size:16px}.top{padding:8px 10px}.logo{width:40px;height:40px}.brand b{font-size:15px}.brand small{font-size:10px}nav{top:56px}main{padding:8px}.body{padding:11px}.huge{font-size:38px}.weight{font-size:45px}.btn.big{width:100%}.keypad button{min-height:55px}.table{min-width:700px}}
@media print{.top,nav,.offline,.noprint,.modalbg,.toast{display:none!important}.shell{display:block}main{padding:0}.view{display:none!important}#reports.view{display:block!important}.printonly{display:block}.card{box-shadow:none;border:0}.table{min-width:0}.table th,.table td{font-size:10pt}}
</style>
</head>
<body>
<div id="activate" class="activation hidden"><div class="box"><div class="biglogo">GVF</div><h1>GVF Harvest</h1><p>Activate this farm device once. Daily harvest use stays signed in on this device.</p><div class="field"><label>Device name</label><input id="actName" placeholder="e.g. Bin Shack iPad"></div><div class="field" style="margin-top:10px"><label>Device setup code</label><input id="actCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code"></div><button class="btn gold big" id="actBtn" style="width:100%;margin-top:14px">ACTIVATE DEVICE</button><div id="actErr" class="small" style="color:var(--red);margin-top:10px;text-align:center"></div></div></div>
<header class="top"><div class="logo">GVF</div><div class="brand"><b>Granite View Farms Harvest</b><small>GVF HARVEST • LIVE BETA</small></div><div class="topright"><div class="net"><span id="netDot" class="dot"></span><span id="netText">Online</span></div><div id="yearTop">Crop Year —</div></div></header>
<div id="offline" class="offline">⚠️ OFFLINE — changes are protected on this device and will retry when connection returns.</div>
<div class="shell"><nav id="nav"></nav><main>
<section id="dashboard" class="view active"></section>
<section id="scale" class="view"></section>
<section id="dumping" class="view"></section>
<section id="dryer" class="view"></section>
<section id="combine" class="view"></section>
<section id="elevator" class="view"></section>
<section id="reports" class="view"></section>
<section id="settings" class="view"></section>
</main></div>
<div id="modalbg" class="modalbg"><div class="modal"><div class="mhead"><span id="mtitle"></span><button id="mclose" class="btn">Close</button></div><div id="mbody" class="mbody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='https://ubuhzmuolhbtcgknbcbj.supabase.co/functions/v1/gvf-api';
const NAV=[['dashboard','▦','Overview'],['scale','⚖️','Scale / Tare'],['dumping','⬇️','Dumping Pits'],['dryer','🔥','Dryer / Bins'],['combine','🚜','Combine View'],['elevator','🏢','Elevator Delivery'],['reports','📊','Fields / Reports'],['settings','⚙️','Settings']];
let data=null, view='dashboard', activePit='dry_corn', adminToken=sessionStorage.getItem('gvf_admin')||'', adminExpires=Number(sessionStorage.getItem('gvf_admin_exp')||0), pollTimer=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])), num=(v,d=0)=>Number(v||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}), dt=x=>x?new Date(x).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—', time=x=>x?new Date(x).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';
function toast(m,ms=3200){const e=$('#toast');e.innerHTML=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function modal(title,html,onReady){$('#mtitle').textContent=title;$('#mbody').innerHTML=html;$('#modalbg').classList.add('show');onReady&&onReady()} function closeModal(){$('#modalbg').classList.remove('show')} $('#mclose').onclick=closeModal;$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};
function token(){return localStorage.getItem('gvf_device_token')||''} function deviceName(){return localStorage.getItem('gvf_device_name')||'GVF Device'}
async function call(action,payload={},opts={}){const t=token();try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','authorization':t?'Bearer '+t:'',...(adminToken?{'x-admin-token':adminToken}: {})},body:JSON.stringify({action,...payload})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');return x.result??x}catch(e){if(opts.queue){queueOffline({action,payload,id:crypto.randomUUID(),at:new Date().toISOString()});toast('⚠️ Saved to this device. It will retry when internet returns.',5200);return {queued:true}}throw e}}
function queueOffline(op){const q=JSON.parse(localStorage.getItem('gvf_offline_ops')||'[]');q.push(op);localStorage.setItem('gvf_offline_ops',JSON.stringify(q));updateNet()}
async function flushOffline(){if(!navigator.onLine||!token())return;let q=JSON.parse(localStorage.getItem('gvf_offline_ops')||'[]');if(!q.length)return;const left=[];for(const op of q){try{await call(op.action,{...op.payload,idempotencyKey:op.payload.idempotencyKey||op.id});}catch{left.push(op)}}localStorage.setItem('gvf_offline_ops',JSON.stringify(left));if(q.length!==left.length)toast(`✅ Synced ${q.length-left.length} offline item${q.length-left.length===1?'':'s'}.`);updateNet();if(!left.length)await refresh();}
function updateNet(){const online=navigator.onLine,q=JSON.parse(localStorage.getItem('gvf_offline_ops')||'[]').length;$('#netDot').classList.toggle('off',!online||q>0);$('#netText').textContent=online?(q?`${q} waiting to sync`:'Online • Cloud connected'):`Offline • ${q} protected`;$('#offline').classList.toggle('show',!online)}
window.addEventListener('online',()=>{updateNet();flushOffline()});window.addEventListener('offline',updateNet);
function isAdmin(){return !!adminToken && Date.now()<adminExpires} function clearAdmin(){adminToken='';adminExpires=0;sessionStorage.removeItem('gvf_admin');sessionStorage.removeItem('gvf_admin_exp')}
function options(arr,selected,val='id',label='name'){return (arr||[]).map(x=>`<option value="${esc(x[val])}" ${String(x[val])===String(selected)?'selected':''}>${esc(x[label])}</option>`).join('')}
function fieldSeasonByField(fieldId){return data.fieldSeasons.find(x=>x.field_id===fieldId)} function fieldBySeason(fsId){const fs=data.fieldSeasons.find(x=>x.id===fsId);return data.fields.find(x=>x.id===fs?.field_id)} function ownerBySeason(fsId){const fs=data.fieldSeasons.find(x=>x.id===fsId);return data.owners.find(o=>o.id===fs?.owner_id)} function truckName(id){return data.trucks.find(x=>x.id===id)?.name||'—'} function driverName(id){return data.drivers.find(x=>x.id===id)?.name||'—'} function storageName(id){return data.storage.find(x=>x.id===id)?.name||'—'} function destName(id){return data.destinations.find(x=>x.id===id)?.name||'—'}
function latestTare(truckId){const start=new Date();start.setHours(0,0,0,0);return data.tares.filter(t=>t.truck_id===truckId&&new Date(t.measured_at)>=start).sort((a,b)=>new Date(b.measured_at)-new Date(a.measured_at))[0]||null}
function portionsFor(loadId){return data.portions.filter(p=>p.load_id===loadId)} function fieldText(load){const ps=portionsFor(load.id);return ps.length?ps.map(p=>fieldBySeason(p.field_season_id)?.name||'—').join(' / '):'—'}
function currentBalances(){const out={};for(const s of data.storage)out[s.id]={wet:0,dry15:0,lb:0,moistMass:0};for(const m of data.movements){if(!out[m.storage_unit_id])continue;out[m.storage_unit_id].wet+=Number(m.quantity_wet_bu||0);out[m.storage_unit_id].dry15+=Number(m.quantity_15_bu||0);out[m.storage_unit_id].lb+=Number(m.quantity_wet_lb||0);out[m.storage_unit_id].moistMass+=Number(m.quantity_wet_bu||0)*Number(m.moisture_percent||0)}return out}
function dry15ForPounds(lb,m){const wet=Number(lb||0)/56;const shrink=Number(data.settings.shrink_percent_per_point||1.2);return wet*(Number(m)<=15?1:Math.max(0,1-(shrink/100)*(Number(m)-15)))}
function nav(){ $('#nav').innerHTML=NAV.map(([id,ic,label])=>`<button data-v="${id}" class="${view===id?'active':''}"><span>${ic}</span>${label}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v)); }
function show(v){view=v;$$('.view').forEach(x=>x.classList.toggle('active',x.id===v));nav();render();scrollTo({top:0,behavior:'smooth'})}
async function activate(){const name=$('#actName').value.trim()||'GVF Device',code=$('#actCode').value.trim();$('#actErr').textContent='';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'activate',deviceName:name,code})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Activation failed');localStorage.setItem('gvf_device_token',x.token);localStorage.setItem('gvf_device_name',name);$('#activate').classList.add('hidden');await refresh();}catch(e){$('#actErr').textContent=e.message}}
$('#actBtn').onclick=activate;
async function refresh(silent=false){if(!token()){ $('#activate').classList.remove('hidden');return }try{const x=await call('bootstrap');data=x;$('#yearTop').textContent=`Crop Year ${data.cropYear.year}`;activePit=data.runtime.active_harvest_type||activePit;render();updateNet();if(!silent)flushOffline();}catch(e){if(!silent)toast('Could not refresh cloud data: '+esc(e.message),5200)}}
function render(){if(!data)return;nav();renderDashboard();renderScale();renderDumping();renderDryer();renderCombine();renderElevator();renderReports();renderSettings()}
function renderDashboard(){const bal=currentBalances(),pending=data.loads.filter(l=>['waiting_tare','awaiting_moisture','dumped_waiting_tare'].includes(l.status));const last=data.loads.filter(l=>l.completed_at||l.dumped_at).sort((a,b)=>new Date(b.completed_at||b.dumped_at)-new Date(a.completed_at||a.dumped_at))[0];const af=data.fields.find(f=>f.id===data.runtime.active_field_id);const cards=data.storage.filter(s=>s.kind!=='hmc_pile').map(s=>{const b=bal[s.id]||{};const qty=s.kind==='wet_bin'?b.wet:b.dry15;const pct=s.working_capacity_bu?Math.max(0,Math.min(100,qty/Number(s.working_capacity_bu)*100)):0;return `<div class="card"><div class="head">${esc(s.name)}</div><div class="body"><div class="kpi">${num(qty,0)} bu</div><div class="progress"><span style="width:${pct}%"></span></div><div class="small muted" style="margin-top:7px">${num(pct,0)}% of ${num(s.working_capacity_bu)} working capacity</div></div></div>`}).join('');
$('#dashboard').innerHTML=`<h1 class="title">Harvest Overview</h1><p class="sub">Live farm status from the shared GVF Harvest cloud database.</p><div class="grid g4"><div class="card"><div class="head">ACTIVE FIELD</div><div class="body"><div class="kpi">${esc(af?.name||'Not set')}</div><div class="muted">${data.runtime.active_harvest_type==='hmc'?'High Moisture Corn':'Dry Corn'}</div></div></div><div class="card"><div class="head">PIT QUEUE</div><div class="body"><div class="kpi">${pending.length}</div><div class="muted">unfinished harvest load${pending.length===1?'':'s'}</div></div></div><div class="card"><div class="head">LAST MOISTURE</div><div class="body"><div class="kpi">${last?.moisture_percent!=null?num(last.moisture_percent,1)+'%':'—'}</div><div class="muted">${last?truckName(last.truck_id)+' • '+fieldText(last):'No completed loads'}</div></div></div><div class="card"><div class="head">CLOUD STATUS</div><div class="body"><div class="kpi" style="font-size:24px">${navigator.onLine?'CONNECTED':'OFFLINE'}</div><div class="muted">${deviceName()}</div></div></div></div><div class="grid g3" style="margin-top:14px">${cards}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="head">NEXT AT DUMPING PITS</div><div class="body">${pending.length?pending.slice().sort((a,b)=>new Date(a.weighed_at)-new Date(b.weighed_at)).slice(0,5).map(l=>`<div class="queue"><div><b>${esc(truckName(l.truck_id))}</b><div class="small muted">${esc(fieldText(l))} • ${l.harvest_type==='hmc'?'HMC':'Dry Corn'} • ${time(l.weighed_at)}</div></div><div><b>${l.net_lb!=null?num(l.net_lb)+' lb':'TARE PENDING'}</b></div></div>`).join(''):'<div class="empty">Pit queue is clear.</div>'}</div></div><div class="card"><div class="head">RECENT COMPLETED LOADS</div><div class="body">${data.loads.filter(l=>l.completed_at).slice(0,5).map(l=>`<div class="queue"><div><b>${esc(truckName(l.truck_id))}</b><div class="small muted">${esc(fieldText(l))} • ${time(l.completed_at)}</div></div><div style="text-align:right"><b>${num(l.moisture_percent,1)}%</b><div class="small muted">${num(l.net_lb)} lb</div></div></div>`).join('')||'<div class="empty">No completed loads yet.</div>'}</div></div></div>`}
function renderScale(){const selectedTruck=$('#scaleTruck')?.value||data.trucks[0]?.id,selectedDriver=$('#scaleDriver')?.value||data.drivers[0]?.id,selectedField=$('#scaleField')?.value||data.runtime.active_field_id||data.fields[0]?.id,selectedType=$('#scaleType')?.value||data.runtime.active_harvest_type||'dry_corn';const tare=latestTare(selectedTruck);const pending=data.loads.filter(l=>['waiting_tare','awaiting_moisture','dumped_waiting_tare'].includes(l.status));$('#scale').innerHTML=`<h1 class="title">Scale / Tare</h1><p class="sub">Manual live mode now. WI-127 + RFID will feed this same workflow later.</p><div class="scalehero"><div class="card"><div class="head">TRUCK ON SCALE</div><div class="body"><div class="grid g2"><div class="field"><label>Truck</label><select id="scaleTruck">${options(data.trucks,selectedTruck)}</select></div><div class="field"><label>Driver</label><select id="scaleDriver">${options(data.drivers,selectedDriver)}</select></div><div class="field"><label>Field</label><select id="scaleField">${options(data.fields,selectedField)}</select></div><div class="field"><label>Harvest Type</label><select id="scaleType"><option value="dry_corn" ${selectedType==='dry_corn'?'selected':''}>Dry Corn</option><option value="hmc" ${selectedType==='hmc'?'selected':''}>High Moisture Corn</option></select></div></div><div class="section"></div><div class="field"><label>Stable Scale Weight (lb)</label><input id="scaleWeight" type="number" inputmode="numeric" placeholder="e.g. 78240"></div><div class="row wrap" style="margin-top:12px"><button id="saveTare" class="btn gold big">I’M EMPTY — SAVE TARE</button><button id="captureFull" class="btn good big">CAPTURE FULL LOAD</button></div></div></div><div class="card"><div class="head">SCALE STATUS</div><div class="body"><div class="traffic"><div class="lamp"></div><div><b>RED = WAIT</b><div class="small muted">Green light automation comes with WI-127/RFID gateway.</div></div></div><div class="section"></div><div class="small muted">Current today tare</div><div class="kpi">${tare?num(tare.weight_lb)+' lb':'NONE'}</div>${tare?`<div class="small muted">Saved ${dt(tare.measured_at)}</div>`:`<div class="notice" style="margin-top:10px"><b>No current-day tare.</b> A full load can still be captured and dumped. It will wait for the later empty tare.</div>`}</div></div></div><div class="card" style="margin-top:14px"><div class="head">LOADS WAITING FOR DUMPING PITS</div><div class="body">${pending.length?pending.slice().sort((a,b)=>new Date(a.weighed_at)-new Date(b.weighed_at)).map(l=>`<div class="queue"><div><b>#${l.load_number} ${esc(truckName(l.truck_id))}</b><div class="small muted">${esc(fieldText(l))} • ${l.harvest_type==='hmc'?'HMC':'Dry Corn'} • ${time(l.weighed_at)}</div></div><div style="text-align:right"><b>${num(l.gross_lb)} gross</b><div class="small ${l.tare_lb?'muted':'" style="color:var(--amber)' }">${l.tare_lb?num(l.net_lb)+' net':'TARE PENDING'}</div></div></div>`).join(''):'<div class="empty">No waiting loads.</div>'}</div></div>`;
$('#scaleTruck').onchange=()=>renderScale();$('#scaleType').onchange=e=>{activePit=e.target.value;};$('#saveTare').onclick=async()=>{const weight=Number($('#scaleWeight').value||0);if(!weight)return toast('Enter the empty scale weight.');try{await call('setActive',{fieldId:$('#scaleField').value,harvestType:$('#scaleType').value},{queue:true});const r=await call('saveTare',{truckId:$('#scaleTruck').value,driverId:$('#scaleDriver').value,weightLb:weight},{queue:true});if(!r.queued)toast(`✅ Tare saved${r.resolved?` • ${r.resolved} waiting load resolved`:''}.`);await refresh(true)}catch(e){toast(esc(e.message),5200)}};$('#captureFull').onclick=async()=>{const weight=Number($('#scaleWeight').value||0);if(!weight)return toast('Enter the full scale weight.');const p={truckId:$('#scaleTruck').value,driverId:$('#scaleDriver').value,fieldId:$('#scaleField').value,harvestType:$('#scaleType').value,weightLb:weight,todayStart:(()=>{const d=new Date();d.setHours(0,0,0,0);return d.toISOString()})(),idempotencyKey:crypto.randomUUID()};try{await call('setActive',{fieldId:p.fieldId,harvestType:p.harvestType},{queue:true});const r=await call('captureFull',p,{queue:true});if(!r.queued)toast(`✅ Full load #${r.load_number} captured — ${r.tare_lb?'net '+num(r.net_lb)+' lb':'waiting for tare'}.`,4600);await refresh(true)}catch(e){toast(esc(e.message),5200)}}}
function moisturePad(prefix,onChange){let v='';const draw=()=>{$('#'+prefix+'Moist').textContent=v?Number(v).toFixed(v.includes('.')?Math.min(1,(v.split('.')[1]||'').length):0):'0.0';onChange(Number(v||0))};$$('#'+prefix+'Keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='C')v='';else if(k==='⌫')v=v.slice(0,-1);else if(k==='.'&&!v.includes('.'))v+=(v?'':0)+'.';else if(v.replace('.','').length<4)v+=k;draw()});draw()}
function renderDumping(){const type=activePit==='hmc'?'hmc':'dry_corn';const queue=data.loads.filter(l=>l.harvest_type===type&&['waiting_tare','awaiting_moisture','dumped_waiting_tare'].includes(l.status)).sort((a,b)=>new Date(a.weighed_at)-new Date(b.weighed_at));const l=queue[0];$('#dumping').innerHTML=`<h1 class="title">Dumping Pits</h1><p class="sub">One page for both pits. It follows the active harvest type, but you can switch manually.</p><div class="card"><div class="body"><div class="seg"><button class="btn ${type==='dry_corn'?'sel':''}" data-pit="dry_corn">🏠 DRY CORN PIT</button><button class="btn ${type==='hmc'?'sel':''}" data-pit="hmc">🌽 HIGH MOISTURE CORN PIT</button></div></div></div>${l?dumpForm(l,type):`<div class="card" style="margin-top:14px"><div class="head">NEXT TRUCK</div><div class="empty">No ${type==='hmc'?'HMC':'Dry Corn'} loads are waiting.</div></div>`}${queue.length>1?`<div class="card" style="margin-top:14px"><div class="head">PIT QUEUE</div><div class="body">${queue.slice(1,7).map(x=>`<div class="queue"><div><b>#${x.load_number} ${esc(truckName(x.truck_id))}</b><div class="small muted">${esc(fieldText(x))} • ${time(x.weighed_at)}</div></div><div>${x.net_lb!=null?num(x.net_lb)+' lb':'TARE PENDING'}</div></div>`).join('')}</div></div>`:''}`;$$('[data-pit]').forEach(b=>b.onclick=()=>{activePit=b.dataset.pit;renderDumping()});if(l)bindDump(l,type)}
function dumpForm(l,type){const p=portionsFor(l.id)[0],fs=data.fieldSeasons.find(x=>x.id===p?.field_season_id),fieldId=fs?.field_id||data.runtime.active_field_id||data.fields[0]?.id;const dryStorage=data.storage.filter(s=>s.kind==='wet_bin'||s.kind==='dry_bin');return `<div class="grid g2" style="margin-top:14px"><div class="card"><div class="head">CURRENT LOAD #${l.load_number}</div><div class="body"><div class="truck">${esc(truckName(l.truck_id))}</div><div class="muted">${esc(driverName(l.driver_id))} • ${esc(fieldText(l))}</div><div class="section"></div><div class="grid g3"><div><div class="small muted">Gross</div><b>${num(l.gross_lb)} lb</b></div><div><div class="small muted">Tare</div><b>${l.tare_lb!=null?num(l.tare_lb)+' lb':'PENDING'}</b></div><div><div class="small muted">Net</div><b>${l.net_lb!=null?num(l.net_lb)+' lb':'PENDING'}</b></div></div>${l.net_lb==null?`<div class="notice" style="margin-top:12px"><b>Missing empty tare does not stop dumping.</b> Moisture and destination will save now; final bushels calculate when this truck later records an empty tare.</div>`:''}</div></div><div class="card"><div class="head">BIN / HMC STATUS</div><div class="body">${type==='hmc'?`<div class="kpi">High Moisture Corn Pile</div><div class="muted">Harvest-production tracking only</div>`:dryStorage.map(s=>{const b=currentBalances()[s.id]||{};const q=s.kind==='wet_bin'?b.wet:b.dry15;const pct=Math.max(0,Math.min(100,q/Number(s.working_capacity_bu||1)*100));return `<div style="margin-bottom:12px"><div class="row"><b>${esc(s.name)}</b><span class="spacer"></span><b>${num(q,0)} bu</b></div><div class="progress"><span style="width:${pct}%"></span></div></div>`}).join('')}</div></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="head">1. ENTER MOISTURE</div><div class="body"><div id="dumpMoist" class="moist">0.0</div><div id="dumpKeys" class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button data-k="C" style="grid-column:span 3">CLEAR</button></div></div></div><div class="card"><div class="head">2. DESTINATION</div><div class="body">${type==='hmc'?`<div style="text-align:center;font-size:46px">🌽</div><h2 style="text-align:center;color:var(--maroon)">HIGH MOISTURE CORN PILE</h2>`:`<div class="destgrid">${dryStorage.map((s,i)=>`<button class="dest ${i===0?'sel':''}" data-dest="${s.id}">${esc(s.name)}</button>`).join('')}</div>`}</div></div><div class="card"><div class="head">3. FIELD / SPLIT</div><div class="body"><div class="field"><label>Field for this load</label><select id="dumpField">${options(data.fields,fieldId)}</select></div><button id="splitLoad" class="btn" style="margin-top:10px;width:100%">SPLIT LOAD</button><div id="splitSummary" class="small muted" style="margin-top:8px">Single-field load</div></div></div></div><button id="completeDump" class="btn good big" style="margin-top:14px" disabled>COMPLETE LOAD</button>`}
function bindDump(l,type){let moist=0,dest=type==='hmc'?null:data.storage.filter(s=>s.kind==='wet_bin'||s.kind==='dry_bin')[0]?.id,split=null;moisturePad('dump',v=>{moist=v;$('#completeDump').disabled=!(v>=12&&v<=40)});$$('[data-dest]').forEach(b=>b.onclick=()=>{dest=b.dataset.dest;$$('[data-dest]').forEach(x=>x.classList.toggle('sel',x===b))});$('#splitLoad').onclick=()=>{modal('Split Load',`<div class="notice info"><b>Official net:</b> ${l.net_lb!=null?num(l.net_lb)+' lb':'Tare pending — enter the known first-field pounds now; remainder will calculate later.'}</div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Field 1</label><select id="sf1">${options(data.fields,$('#dumpField').value)}</select></div><div class="field"><label>Pounds from Field 1</label><input id="sp1" type="number" inputmode="numeric" placeholder="e.g. 28000"></div><div class="field"><label>Field 2 (remainder)</label><select id="sf2">${options(data.fields,data.runtime.active_field_id)}</select></div></div><button id="saveSplit" class="btn primary big" style="margin-top:12px">USE SPLIT</button>`,()=>{$('#saveSplit').onclick=()=>{const f1=$('#sf1').value,f2=$('#sf2').value,p=Number($('#sp1').value||0);if(f1===f2)return toast('Choose two different fields.');if(!(p>0))return toast('Enter pounds for Field 1.');if(l.net_lb!=null&&p>=l.net_lb)return toast('Field 1 pounds must be less than official net.');split={field1Id:f1,field2Id:f2,pounds1:p};$('#splitSummary').textContent=`Split: ${data.fields.find(f=>f.id===f1)?.name} ${num(p)} lb + remainder to ${data.fields.find(f=>f.id===f2)?.name}`;closeModal()}})};$('#completeDump').onclick=async()=>{const btn=$('#completeDump');btn.disabled=true;try{const r=await call('completeLoad',{loadId:l.id,moisture:moist,destinationStorageId:dest,fieldId:$('#dumpField').value,split},{queue:true});if(!r.queued)toast(`✅ ${esc(r.notification?.title||'Load completed')} — ${esc(r.notification?.body||'')}`,5000);await refresh(true)}catch(e){btn.disabled=false;toast(esc(e.message),5200)}}}
function renderDryer(){const bal=currentBalances(),wet=data.storage.find(s=>s.kind==='wet_bin'),drys=data.storage.filter(s=>s.kind==='dry_bin'),wetBal=bal[wet?.id]||{},avg=wetBal.wet>0?wetBal.moistMass/wetBal.wet:0;$('#dryer').innerHTML=`<h1 class="title">Dryer / Bins</h1><p class="sub">Manual live mode now. Dryer Master 510 automation will feed these same records later.</p><div class="grid g3">${data.storage.filter(s=>s.kind!=='hmc_pile').map(s=>{const b=bal[s.id]||{},q=s.kind==='wet_bin'?b.wet:b.dry15,p=Math.max(0,Math.min(100,q/Number(s.working_capacity_bu||1)*100));return `<div class="card"><div class="head">${esc(s.name)}</div><div class="body"><div class="kpi">${num(q,0)} bu</div><div class="progress"><span style="width:${p}%"></span></div><div class="small muted" style="margin-top:8px">${num(p,0)}% full${s.kind==='wet_bin'?` • ${num(avg,1)}% avg moisture`:''}</div></div></div>`}).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="head">MANUAL DRYER PROCESSING</div><div class="body"><div class="field"><label>Wet bushels processed</label><input id="dryWetBu" type="number" inputmode="decimal" placeholder="e.g. 950"></div><div class="field" style="margin-top:10px"><label>Dryer output destination</label><select id="dryDest">${options(drys,data.runtime.dryer_output_storage_id)}</select></div><button id="dryProcess" class="btn good big" style="margin-top:12px">PROCESS WET CORN</button><div class="small muted" style="margin-top:9px">Subtracts wet bushels from Wet Bin and adds calculated 15%-equivalent output to the selected dry bin.</div></div></div><div class="card"><div class="head">DRYER MASTER 510</div><div class="body">${data.dryerReadings[0]?`<div class="grid g2"><div><div class="small muted">Status</div><div class="kpi">${data.dryerReadings[0].running?'RUNNING':'STOPPED'}</div></div><div><div class="small muted">Throughput</div><div class="kpi">${num(data.dryerReadings[0].throughput_bph,0)} BPH</div></div><div><div class="small muted">Inlet</div><b>${num(data.dryerReadings[0].inlet_moisture,1)}%</b></div><div><div class="small muted">Outlet</div><b>${num(data.dryerReadings[0].outlet_moisture,1)}%</b></div></div>`:`<div class="notice info"><b>Hardware integration is ready to be added later.</b><br>The app is live without it. Manual processing remains available as a permanent fallback.</div>`}</div></div></div>`;$('#dryDest').onchange=async e=>{try{await call('setActive',{dryerOutputStorageId:e.target.value},{queue:true});await refresh(true)}catch(e){toast(esc(e.message))}};$('#dryProcess').onclick=async()=>{try{await call('dryerProcess',{wetBu:Number($('#dryWetBu').value||0),destinationStorageId:$('#dryDest').value},{queue:true});toast('✅ Dryer movement recorded.');await refresh(true)}catch(e){toast(esc(e.message),5200)}}}
function renderCombine(){const notes=data.notifications.filter(n=>n.kind==='load_dumped').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const last=notes[0];const recent=data.loads.filter(l=>l.completed_at||l.dumped_at).sort((a,b)=>new Date(b.completed_at||b.dumped_at)-new Date(a.completed_at||a.dumped_at)).slice(0,8);$('#combine').innerHTML=`<h1 class="title">Combine View</h1><p class="sub">Read-only. This screen live-refreshes; background push delivery will be enabled before official harvest use.</p><div class="card"><div class="body">${last?`<div class="grid g3"><div><div class="small muted">LAST TRUCK</div><div class="truck">${esc(last.title)}</div></div><div><div class="small muted">DETAIL</div><div class="huge" style="font-size:34px">${esc(last.body)}</div></div><div><div class="small muted">TIME</div><div class="kpi">${time(last.created_at)}</div></div></div>`:'<div class="empty">Complete a load at Dumping Pits to populate Combine View.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="head">RECENT LOADS</div><div class="body tablewrap">${recent.length?`<table class="table"><thead><tr><th>Truck</th><th>Moisture</th><th>Field</th><th>Time</th><th>Net</th></tr></thead><tbody>${recent.map(l=>`<tr><td><b>${esc(truckName(l.truck_id))}</b></td><td>${num(l.moisture_percent,1)}%</td><td>${esc(fieldText(l))}</td><td>${time(l.completed_at||l.dumped_at)}</td><td>${l.net_lb!=null?num(l.net_lb)+' lb':'Tare pending'}</td></tr>`).join('')}</tbody></table>`:'No completed loads.'}</div></div>`}
function renderElevator(){const open=data.deliveries.filter(d=>d.status==='open'),recent=data.deliveries.filter(d=>d.status==='completed').slice(0,10);const sourceType=$('#elSourceType')?.value||'bin';$('#elevator').innerHTML=`<h1 class="title">Elevator Delivery</h1><p class="sub">Start before leaving the farm; finish when the POET/WesCon ticket is received.</p>${open.length?`<div class="notice" style="margin-bottom:14px"><b>⚠️ ${open.length} OPEN DELIVERY${open.length===1?'':'IES'} — TICKET NEEDED</b></div>`:''}<div class="grid g2"><div class="card"><div class="head">START ELEVATOR DELIVERY</div><div class="body"><div class="field"><label>Source type</label><select id="elSourceType"><option value="bin" ${sourceType==='bin'?'selected':''}>Grain Bin</option><option value="field" ${sourceType==='field'?'selected':''}>Field — Direct to Elevator</option></select></div><div class="field" style="margin-top:9px"><label>Source</label><select id="elSource">${sourceType==='bin'?options(data.storage.filter(s=>s.kind!=='hmc_pile'),null):options(data.fields,null)}</select></div><div class="grid g2" style="margin-top:9px"><div class="field"><label>Truck</label><select id="elTruck">${options(data.trucks,null)}</select></div><div class="field"><label>Driver</label><select id="elDriver">${options(data.drivers,null)}</select></div></div><div class="field" style="margin-top:9px"><label>Destination</label><select id="elDest">${options(data.destinations,null)}</select></div><button id="startEl" class="btn good big" style="margin-top:12px">START DELIVERY</button></div></div><div><div class="card"><div class="head">OPEN DELIVERIES — FINISH TICKET</div><div class="body">${open.length?open.map(d=>`<div class="queue now"><div><b>#${d.delivery_number} ${esc(truckName(d.truck_id))} → ${esc(destName(d.destination_id))}</b><div class="small muted">${d.source_type==='bin'?storageName(d.source_storage_id):fieldBySeason(d.source_field_season_id)?.name||'Field'} • started ${time(d.started_at)}</div></div><button class="btn primary finishEl" data-id="${d.id}">FINISH TICKET</button></div>`).join(''):'<div class="empty">No open deliveries.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="head">RECENT ELEVATOR DELIVERIES</div><div class="body">${recent.length?recent.map(d=>`<div class="queue"><div><b>${esc(truckName(d.truck_id))} → ${esc(destName(d.destination_id))}</b><div class="small muted">${d.source_type==='bin'?storageName(d.source_storage_id):fieldBySeason(d.source_field_season_id)?.name||'Field'} • ${dt(d.completed_at)}</div></div><div style="text-align:right"><b>${num(d.ticket_bushels_adjusted,1)} bu</b><div class="small muted">${num(d.buyer_moisture,1)}%</div></div></div>`).join(''):'<div class="empty">No completed deliveries.</div>'}</div></div></div></div>`;$('#elSourceType').onchange=()=>renderElevator();$('#startEl').onclick=async()=>{try{await call('startDelivery',{sourceType:$('#elSourceType').value,sourceId:$('#elSource').value,truckId:$('#elTruck').value,driverId:$('#elDriver').value,destinationId:$('#elDest').value,idempotencyKey:crypto.randomUUID()},{queue:true});toast('✅ Elevator delivery started — ticket required after unloading.');await refresh(true)}catch(e){toast(esc(e.message),5200)}};$$('.finishEl').forEach(b=>b.onclick=()=>finishTicket(b.dataset.id))}
function finishTicket(id){const d=data.deliveries.find(x=>x.id===id);modal('Finish Elevator Ticket',`<div class="notice info"><b>${esc(truckName(d.truck_id))} → ${esc(destName(d.destination_id))}</b><br>${d.source_type==='bin'?esc(storageName(d.source_storage_id)):esc(fieldBySeason(d.source_field_season_id)?.name||'Field')}</div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Ticket Bushels — Already Adjusted / Shrunk</label><input id="ftBu" type="number" inputmode="decimal"></div><div class="field"><label>Buyer Moisture (%)</label><input id="ftM" type="number" inputmode="decimal"></div><div class="field"><label>Buyer Net Weight (lb) — optional</label><input id="ftNet" type="number" inputmode="numeric"></div><div class="field"><label>Ticket Number — optional</label><input id="ftNo"></div></div><div class="field" style="margin-top:10px"><label>Ticket Photo</label><input id="ftPhoto" type="file" accept="image/*" capture="environment"><img id="ftPreview" class="photo"></div><div class="notice" style="margin-top:10px"><b>No second shrink:</b> ticket bushels are stored exactly as the elevator reports them.</div><button id="finishTicketBtn" class="btn good big" style="margin-top:12px">COMPLETE DELIVERY</button>`,()=>{let photo=null;$('#ftPhoto').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;photo=await compressImage(f);$('#ftPreview').src=photo;$('#ftPreview').style.display='block'};$('#finishTicketBtn').onclick=async()=>{try{await call('finishDelivery',{deliveryId:id,bushels:Number($('#ftBu').value||0),moisture:Number($('#ftM').value||0),netLb:Number($('#ftNet').value||0)||null,ticketNumber:$('#ftNo').value.trim()||null,photoDataUrl:photo},{queue:true});closeModal();toast('✅ Elevator ticket completed and saved.');await refresh(true)}catch(e){toast(esc(e.message),5200)}}})}
async function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function fieldSummary(){const rows={};for(const fs of data.fieldSeasons){const f=data.fields.find(x=>x.id===fs.field_id);if(!f)continue;rows[fs.id]={fsId:fs.id,field:f.name,owner:data.owners.find(o=>o.id===fs.owner_id)?.name||'Unassigned',wet:0,moistMass:0,dry15:0,loads:0,dates:[],direct:0};}for(const l of data.loads.filter(x=>x.status==='completed')){const ps=portionsFor(l.id);for(const p of ps){const r=rows[p.field_season_id];if(!r)continue;const lbs=Number(p.pounds||0);r.wet+=lbs/56;r.moistMass+=lbs*Number(l.moisture_percent||0);r.dry15+=l.harvest_type==='hmc'?0:dry15ForPounds(lbs,l.moisture_percent);r.loads++;r.dates.push(l.completed_at)}}for(const d of data.deliveries.filter(x=>x.status==='completed'&&x.source_type==='field'&&x.source_field_season_id)){const r=rows[d.source_field_season_id];if(!r)continue;r.direct+=Number(d.ticket_bushels_adjusted||0);r.dry15+=Number(d.ticket_bushels_adjusted||0);if(d.buyer_net_lb){r.wet+=Number(d.buyer_net_lb)/56;r.moistMass+=Number(d.buyer_net_lb)*Number(d.buyer_moisture||0)}r.dates.push(d.completed_at)}return Object.values(rows).filter(r=>r.loads||r.direct)}
function renderReports(){const rows=fieldSummary(),ownerMap={};for(const r of rows){ownerMap[r.owner]=(ownerMap[r.owner]||0)+r.dry15}$('#reports').innerHTML=`<div class="printonly"><h1>Granite View Farms Harvest — ${data.cropYear.year}</h1></div><h1 class="title">Fields / Reports</h1><p class="sub">Field, owner/entity and crop-year production. Elevator direct-from-field tickets stay separate from bin inventory.</p><div class="grid g2"><div class="card"><div class="head">OWNER / ENTITY TOTALS</div><div class="body">${Object.entries(ownerMap).map(([o,b])=>`<div class="queue"><div><b>${esc(o)}</b></div><div><b>${num(b,0)} bu @15% / adjusted</b></div></div>`).join('')||'<div class="empty">No owner totals yet.</div>'}</div></div><div class="card"><div class="head">CROP YEAR</div><div class="body"><div class="kpi">${data.cropYear.year}</div><div class="muted">Status: ${esc(data.cropYear.status)}</div><div class="notice info" style="margin-top:10px">A new calendar year will not automatically switch crop years. Carryover grain can stay assigned to the old crop.</div></div></div></div><div class="bar noprint"><button id="printReport" class="btn primary">🖨️ Print All Fields</button></div><div class="card"><div class="head">ALL FIELD SUMMARIES</div><div class="body tablewrap">${rows.length?`<table class="table"><thead><tr><th>Field</th><th>Owner</th><th>Wet Bu</th><th>Avg Moisture</th><th>15% / Adjusted Bu</th><th>Direct Elevator</th><th>Acres</th><th>Yield</th><th class="noprint">Action</th></tr></thead><tbody>${rows.map(r=>{const acreRec=data.acres.find(a=>a.field_season_id===r.fsId&&a.harvest_type==='dry_corn'),ac=Number(acreRec?.harvested_acres||0),avg=r.wet? r.moistMass/(r.wet*56):0,y=ac?r.dry15/ac:0;return `<tr><td><b>${esc(r.field)}</b></td><td>${esc(r.owner)}</td><td>${num(r.wet,0)}</td><td>${r.wet?num(avg,1)+'%':'—'}</td><td>${num(r.dry15,0)}</td><td>${num(r.direct,0)}</td><td>${ac?num(ac,1):'—'}</td><td>${ac?num(y,1):'—'}</td><td class="noprint"><button class="btn setAcres" data-fs="${r.fsId}">Acres</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No completed harvest production yet.</div>'}</div></div><div class="card noprint" style="margin-top:14px"><div class="head">RECENT LOADS — CORRECT MISTAKES</div><div class="body">${data.loads.filter(l=>l.status==='completed').slice(0,20).map(l=>`<div class="queue"><div><b>#${l.load_number} ${esc(truckName(l.truck_id))}</b><div class="small muted">${esc(fieldText(l))} • ${num(l.moisture_percent,1)}% • ${dt(l.completed_at)}</div></div><button class="btn correctLoad" data-id="${l.id}">Correct</button></div>`).join('')||'<div class="empty">No completed loads.</div>'}</div></div>`;$('#printReport').onclick=()=>print();$$('.setAcres').forEach(b=>b.onclick=()=>setAcres(b.dataset.fs));$$('.correctLoad').forEach(b=>b.onclick=()=>correctLoadModal(b.dataset.id))}
async function needAdmin(){if(isAdmin())return true;return new Promise(resolve=>{modal('Admin PIN',`<p>Enter the GVF Harvest Admin PIN to make protected changes. Admin mode stays unlocked for 15 minutes.</p><div class="field"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric"></div><button id="pinBtn" class="btn gold big" style="margin-top:12px">UNLOCK ADMIN MODE</button>`,()=>{$('#pinBtn').onclick=async()=>{try{const r=await call('adminVerify',{pin:$('#pin').value});adminToken=r.token;adminExpires=Date.now()+r.expiresMinutes*60000;sessionStorage.setItem('gvf_admin',adminToken);sessionStorage.setItem('gvf_admin_exp',String(adminExpires));closeModal();renderSettings();resolve(true)}catch(e){toast(esc(e.message))}}})})}
async function setAcres(fsId){if(!await needAdmin())return;const current=data.acres.find(a=>a.field_season_id===fsId&&a.harvest_type==='dry_corn');const v=prompt('Harvested acres for this field (Dry Corn):',current?.harvested_acres||'');if(v===null)return;try{await call('master',{op:'setAcres',fieldSeasonId:fsId,harvestType:'dry_corn',acres:Number(v||0)});toast('Acres updated.');await refresh(true)}catch(e){toast(esc(e.message))}}
async function correctLoadModal(id){if(!await needAdmin())return;const l=data.loads.find(x=>x.id===id),p=portionsFor(l.id)[0],fieldId=data.fieldSeasons.find(x=>x.id===p?.field_season_id)?.field_id;modal(`Correct Load #${l.load_number}`,`<div class="notice"><b>Original values remain in the audit log.</b></div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Truck</label><select id="clTruck">${options(data.trucks,l.truck_id)}</select></div><div class="field"><label>Driver</label><select id="clDriver">${options(data.drivers,l.driver_id)}</select></div><div class="field"><label>Field</label><select id="clField">${options(data.fields,fieldId)}</select></div><div class="field"><label>Moisture</label><input id="clM" type="number" value="${l.moisture_percent??''}"></div><div class="field"><label>Gross lb</label><input id="clG" type="number" value="${l.gross_lb??''}"></div><div class="field"><label>Tare lb</label><input id="clT" type="number" value="${l.tare_lb??''}"></div><div class="field"><label>Destination</label><select id="clDest">${options(data.storage,l.destination_storage_id)}</select></div></div><button id="saveCorrection" class="btn good big" style="margin-top:12px">SAVE CORRECTION</button>`,()=>{$('#saveCorrection').onclick=async()=>{try{await call('correctLoad',{loadId:id,truck_id:$('#clTruck').value,driver_id:$('#clDriver').value,fieldId:$('#clField').value,moisture_percent:Number($('#clM').value),gross_lb:Number($('#clG').value),tare_lb:Number($('#clT').value),destination_storage_id:$('#clDest').value});closeModal();toast('✅ Load corrected and totals recalculated.');await refresh(true)}catch(e){toast(esc(e.message),5200)}}})}
function renderSettings(){const unlocked=isAdmin();if(!unlocked&&adminToken)clearAdmin();$('#settings').innerHTML=`<h1 class="title">Settings</h1><p class="sub">Normal harvest use is password-free. Major changes require the Admin PIN.</p><div class="grid g2"><div class="card"><div class="head">ADMIN MODE</div><div class="body"><div class="adminline"><span class="pill ${unlocked?'good':'warn'}">${unlocked?'UNLOCKED':'LOCKED'}</span><b>${unlocked?'Protected settings available for this session':'Normal harvest controls remain available'}</b></div><button id="adminToggle" class="btn ${unlocked?'red':'gold'}" style="margin-top:12px">${unlocked?'LOCK ADMIN MODE':'UNLOCK WITH ADMIN PIN'}</button></div></div><div class="card"><div class="head">THIS DEVICE</div><div class="body"><div class="statusbox"><b>${esc(deviceName())}</b><br><span class="small muted">Cloud-connected farm device • ${navigator.onLine?'Online':'Offline'}</span></div><button id="notifBtn" class="btn" style="margin-top:10px">Enable Notifications on This Device</button></div></div></div><div class="card" style="margin-top:14px"><div class="head">TRUCKS / DRIVERS / FIELDS / OWNERS</div><div class="body">${unlocked?masterManager():`<div class="notice info">Unlock Admin Mode to add or rename trucks, drivers, fields, owners, or change field ownership.</div>`}</div></div><div class="card" style="margin-top:14px"><div class="head">LIVE SYSTEM</div><div class="body"><div class="grid g3"><div><div class="small muted">App</div><b>GVF Harvest Live Beta</b></div><div><div class="small muted">Crop Year</div><b>${data.cropYear.year}</b></div><div><div class="small muted">Backend</div><b>Supabase Cloud</b></div></div><div class="section"></div><div class="small muted">WI-127/RFID scale automation and Dryer Master 510 automation can be added later without replacing the live app.</div></div></div>`;$('#adminToggle').onclick=async()=>{if(unlocked){clearAdmin();renderSettings()}else await needAdmin()};$('#notifBtn').onclick=async()=>{if(!('Notification'in window))return toast('Notifications are not supported in this browser.');const p=await Notification.requestPermission();toast(p==='granted'?'Notifications allowed on this device.':'Notifications were not allowed.');};if(unlocked)bindMaster()}
function masterManager(){const rows=(kind,arr)=>arr.map(x=>`<div class="queue"><div><b>${esc(x.name)}</b>${kind==='field'?`<div class="small muted">Owner: ${esc(ownerBySeason(fieldSeasonByField(x.id)?.id)?.name||'Unassigned')}</div>`:''}</div><button class="btn rename" data-kind="${kind}" data-id="${x.id}" data-name="${esc(x.name)}">Rename</button></div>`).join('');return `<div class="grid g4"><div><h3>Trucks</h3><div class="row"><input id="newTruck" placeholder="New truck" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="truck">Add</button></div>${rows('truck',data.trucks)}</div><div><h3>Drivers</h3><div class="row"><input id="newDriver" placeholder="New driver" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="driver">Add</button></div>${rows('driver',data.drivers)}</div><div><h3>Owners</h3><div class="row"><input id="newOwner" placeholder="New owner" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="owner">Add</button></div>${rows('owner',data.owners)}</div><div><h3>Fields</h3><div class="row"><input id="newField" placeholder="New field" style="min-width:0;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn add" data-kind="field">Add</button></div><div style="max-height:420px;overflow:auto">${rows('field',data.fields)}</div></div></div><div class="section"></div><h3>Field Owner / Entity — ${data.cropYear.year}</h3><div class="tablewrap"><table class="table"><thead><tr><th>Field</th><th>Owner</th></tr></thead><tbody>${data.fields.map(f=>{const fs=fieldSeasonByField(f.id);return `<tr><td><b>${esc(f.name)}</b></td><td><select class="ownerAssign" data-fs="${fs?.id||''}"><option value="">Unassigned</option>${options(data.owners,fs?.owner_id)}</select></td></tr>`}).join('')}</tbody></table></div>`}
function bindMaster(){$$('.add').forEach(b=>b.onclick=async()=>{const kind=b.dataset.kind,input=$('#new'+kind[0].toUpperCase()+kind.slice(1));if(!input?.value.trim())return;try{await call('master',{op:'add',kind,name:input.value.trim()});toast('Added '+kind+'.');await refresh(true)}catch(e){toast(esc(e.message))}});$$('.rename').forEach(b=>b.onclick=async()=>{const name=prompt('Rename '+b.dataset.kind+':',b.dataset.name);if(name===null||!name.trim())return;try{await call('master',{op:'rename',kind:b.dataset.kind,id:b.dataset.id,name:name.trim()});toast('Renamed.');await refresh(true)}catch(e){toast(esc(e.message))}});$$('.ownerAssign').forEach(s=>s.onchange=async()=>{try{await call('master',{op:'assignOwner',fieldSeasonId:s.dataset.fs,ownerId:s.value||null});toast('Field owner updated.');await refresh(true)}catch(e){toast(esc(e.message))}})}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
setInterval(()=>{if(token()&&navigator.onLine&&(view==='combine'||view==='dashboard'||view==='dumping'))refresh(true)},7000);
updateNet();if(!token())$('#activate').classList.remove('hidden');else refresh();
</script>
</body></html>
