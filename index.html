/* ===== GVF Harvest polished production-style skin — Live Beta 1.5 ===== */
:root{
  --maroon:#641522;--maroon-dark:#3e0b13;--maroon-deep:#26070d;--maroon-soft:#8a2635;
  --gold:#d5a62e;--gold-light:#f1d67a;--cream:#f4efe5;--paper:#fffdf8;--ink:#20242a;
  --muted:#6e716f;--line:#ded5c6;--green:#2a874b;--red:#bd342f;--amber:#a36b0e;--nav:#251218;
  --shadow:0 12px 32px rgba(57,27,17,.10);--shadow-strong:0 20px 50px rgba(45,12,18,.18)
}
html{background:var(--cream)}
body{background:
 radial-gradient(circle at 12% -10%,rgba(213,166,46,.14),transparent 29rem),
 radial-gradient(circle at 100% 0,rgba(100,21,34,.09),transparent 34rem),
 linear-gradient(180deg,#f8f4ec 0,#f3eee4 100%);background-attachment:fixed}
.top{min-height:70px;background:
 linear-gradient(118deg,rgba(255,255,255,.035),transparent 38%),
 linear-gradient(100deg,var(--maroon-deep),var(--maroon) 58%,#751b2a);border-bottom:1px solid rgba(241,214,122,.34);padding:10px 18px;box-shadow:0 7px 24px rgba(40,8,14,.30)}
.logo{width:50px;height:50px;border-radius:15px;border:1px solid rgba(241,214,122,.92);box-shadow:inset 0 0 0 2px rgba(213,166,46,.14),0 6px 18px rgba(0,0,0,.17);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(0,0,0,.10));font-size:17px;text-shadow:0 1px 0 #0004}
.brand b{font-size:19px;letter-spacing:.1px}.brand small{color:var(--gold-light);letter-spacing:1.15px;font-size:10px}.topright{padding:6px 10px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.shell{grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 70px)}
nav{top:70px;height:calc(100vh - 70px);padding:16px 11px;background:
 linear-gradient(180deg,rgba(213,166,46,.06),transparent 170px),linear-gradient(180deg,#261218,#160f12 72%);border-right:1px solid rgba(213,166,46,.16)}
nav:before{content:'HARVEST CONTROL';display:block;color:#d5b85b;font-size:9px;font-weight:950;letter-spacing:1.6px;padding:3px 13px 10px;opacity:.84}
nav button{min-height:49px;border:1px solid transparent;border-radius:13px;padding:12px 13px;color:#eee8e4;transition:.16s ease;letter-spacing:.05px}
nav button span{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.06);font-size:16px}
nav button:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.06)}
nav button.active{background:linear-gradient(100deg,var(--maroon-soft),var(--maroon));border-color:rgba(241,214,122,.28);box-shadow:inset 3px 0 0 var(--gold),0 7px 20px rgba(0,0,0,.18);color:#fff}
nav button.active span{background:rgba(213,166,46,.19);color:var(--gold-light)}
main{padding:24px 26px 40px;max-width:1560px;width:100%;margin:0 auto}
.title{font-size:30px;letter-spacing:-.75px;color:var(--maroon);position:relative;padding-bottom:7px}.title:after{content:'';position:absolute;left:0;bottom:0;width:48px;height:3px;border-radius:99px;background:var(--gold)}
.sub{font-size:14px;margin-top:7px;margin-bottom:19px}
.grid{gap:17px}
.card{border:1px solid rgba(125,104,76,.20);border-radius:18px;background:rgba(255,253,248,.96);box-shadow:var(--shadow);overflow:hidden;position:relative}
.card:before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--gold),rgba(213,166,46,.12) 62%,transparent);z-index:1}
.head{position:relative;padding:12px 15px 11px;background:linear-gradient(105deg,var(--maroon-dark),var(--maroon));font-size:12px;letter-spacing:1.05px;border-bottom:1px solid rgba(213,166,46,.34)}
.body{padding:17px}.kpi{font-size:33px}.huge{font-size:52px}.weight{font-size:58px;color:var(--maroon);font-variant-numeric:tabular-nums}
.btn{min-height:44px;border-radius:11px;border-color:#cbc1b2;background:linear-gradient(180deg,#fff,#faf7f0);box-shadow:0 2px 5px rgba(38,25,11,.04);transition:transform .08s ease,box-shadow .15s ease,border-color .15s ease}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#761c2b,var(--maroon));box-shadow:0 7px 17px rgba(100,21,34,.20)}.btn.gold{background:linear-gradient(180deg,#e3bb4e,var(--gold));box-shadow:0 7px 17px rgba(155,112,13,.18)}.btn.good{background:linear-gradient(180deg,#369957,var(--green))}.btn.red{background:linear-gradient(180deg,#cc4b45,var(--red))}.btn.big{min-height:54px;border-radius:13px}
.field label{color:#5d564e;font-size:11px;text-transform:uppercase;letter-spacing:.55px}.field input,.field select,.field textarea{min-height:47px;border:1px solid #cec3b2;border-radius:11px;background:#fffefa;box-shadow:inset 0 1px 2px rgba(68,47,22,.04)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid rgba(213,166,46,.18);border-color:#b88b22}
.notice{border-radius:13px}.pill{border:1px solid rgba(0,0,0,.045)}
.progress{height:13px;background:#e7e0d4}.progress span{background:linear-gradient(90deg,#20733f,#54a56d)}
.queue{border-radius:13px;border-color:#ded5c6;padding:12px 13px;background:linear-gradient(180deg,#fff,#fffdf8);box-shadow:0 3px 9px rgba(42,31,16,.035)}.queue.now{border:2px solid var(--gold);background:linear-gradient(120deg,#fff9e7,#fffdf7);box-shadow:0 8px 20px rgba(164,116,15,.11)}
.truck{font-size:30px}.traffic{padding:4px}.lamp{width:46px;height:46px;box-shadow:inset 0 0 0 3px #0002,0 5px 13px rgba(0,0,0,.14)}
.moist{border-radius:15px;border:2px solid #d4cab9;background:linear-gradient(180deg,#fff,#fffaf1);box-shadow:inset 0 2px 8px rgba(72,48,21,.045);color:var(--maroon)}
.keypad{gap:9px}.keypad button{border-radius:13px;background:linear-gradient(180deg,#fff,#fbf8f2);border-color:#cec4b5;box-shadow:0 3px 8px rgba(52,39,21,.045)}.keypad button:active{background:#f4ead7}
.dest{border-radius:14px;background:linear-gradient(180deg,#fff,#fbf7ef);box-shadow:0 4px 10px rgba(42,29,15,.04)}.dest.sel{border-color:var(--gold);background:linear-gradient(135deg,#fff8df,#f9ecee);box-shadow:0 7px 18px rgba(100,21,34,.10);color:var(--maroon)}
.tablewrap{border-radius:11px}.table th{background:#f2ece2;color:#675f54;letter-spacing:.45px}.table tbody tr:hover{background:#fff8e8}
.modal{border-radius:20px;box-shadow:var(--shadow-strong);border:1px solid rgba(213,166,46,.22)}.modal .mhead{padding:15px 17px;background:linear-gradient(100deg,var(--maroon-dark),var(--maroon));border-bottom:1px solid rgba(213,166,46,.35)}.modal .mbody{padding:18px}
.toast{border:1px solid rgba(213,166,46,.22);border-radius:14px;background:#22161a;box-shadow:0 18px 44px rgba(0,0,0,.30)}
.activation{background:radial-gradient(circle at 50% 0,rgba(213,166,46,.20),transparent 36rem),linear-gradient(145deg,#2e080e,#65121f 60%,#7a1f2e)}.activation .box{border-radius:24px;padding:28px;border:1px solid rgba(213,166,46,.45);box-shadow:0 30px 80px rgba(0,0,0,.38)}.activation .biglogo{width:82px;height:82px;border-radius:21px;box-shadow:0 12px 25px rgba(73,16,25,.25)}

function tareSessionStart(value=new Date()){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value)).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
  const day=new Date(Date.UTC(parts.year,parts.month-1,parts.day));
  if(parts.hour<2)day.setUTCDate(day.getUTCDate()-1);
  const wall=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),2);
  const candidates=[wall+5*3600000,wall+6*3600000];
  for(const candidate of candidates){
    const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(candidate)).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
    const local=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
    if(local>=wall)return new Date(candidate).toISOString();
  }
  throw new Error('Could not determine tare session');
}

async function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}

async function fetchSeasonSummary(yearId){if(seasonLoading)return;seasonLoading=true;seasonError='';renderSeasonSummary();try{const s=await call('seasonSummary',yearId?{cropYearId:yearId}:{});seasonView=s;seasonYearId=s.cropYear.id;if(s.cropYear.id===data.cropYear.id)data.seasonSummary=s;}catch(e){seasonError=e.message||'Could not load season totals';}finally{seasonLoading=false;renderSeasonSummary();}}
function renderSeasonSummary(){
 if(!data)return;let el=$('#seasonSummary');if(!el){el=document.createElement('section');el.id='seasonSummary';const dashboard=$('#dashboard');dashboard.insertBefore(el,dashboard.children[2]||null);}
 const s=seasonYearId&&seasonYearId!==data.cropYear.id?seasonView:(data.seasonSummary||seasonView);
 if(!s){el.innerHTML='<div class="notice info">Loading full-season totals…</div>';return;}
 const card=(label,value,note)=>`<div class="card"><div class="head">${label}</div><div class="body"><div class="kpi">${num(value,0)} bu</div><div class="small muted">${note}</div></div></div>`;
 el.innerHTML=`<div class="row wrap" style="margin:22px 0 12px"><h2 style="margin:0;color:var(--maroon)">Season Summary</h2><div class="spacer"></div><label class="field"><span class="small muted">Crop year</span><select id="seasonYear" style="padding:8px">${s.years.map(y=>`<option value="${esc(y.id)}" ${y.id===s.cropYear.id?'selected':''}>${y.year}</option>`).join('')}</select></label><button id="seasonRefresh" class="btn" ${seasonLoading?'disabled':''}>${seasonLoading?'Updating…':'Refresh totals'}</button></div>
 ${seasonError?`<div class="notice bad">${esc(seasonError)} — showing the last loaded totals.</div>`:''}
 <div class="grid g3">${card('DRY CORN INTO BINS',s.dry.receivedDry15,'15% equivalent • '+num(s.dry.receivedWet,0)+' wet bu • '+num(s.dry.loads)+' loads')}${card('HAULED OUT OF BINS',s.dry.outbound,'Completed ticket bushels • excludes direct-from-field deliveries')}${card('REMAINING IN BINS',s.dry.remaining,'Recorded inventory at 15% equivalent • includes inventory corrections')}</div>
 <div class="card" style="margin-top:14px"><div class="head">HIGH MOISTURE CORN PILE — ${s.cropYear.year}</div><div class="body"><div class="grid g3"><div><div class="small muted">Harvested into pile — wet bushels</div><div class="kpi">${num(s.hmc.receivedWet,0)}</div><div class="small muted">${num(s.hmc.loads)} completed loads</div></div><div><div class="small muted">Recorded haul-out — ticket bushels</div><div class="kpi">${num(s.hmc.outbound,0)}</div></div><div><div class="small muted">Recorded pile balance — wet bushels</div><div class="kpi">${num(s.hmc.remaining,0)}</div></div></div><div class="small muted" style="margin-top:10px">HMC stays separate from dry corn. Feeding and other removals must be recorded for the pile balance to reflect what remains. Available each crop year, including next season.</div></div></div>
 <div class="card" style="margin-top:14px"><div class="head">DELIVERIES BY ELEVATOR / DESTINATION — ${s.cropYear.year}</div><div class="body tablewrap"><table class="table"><thead><tr><th>Destination</th><th>From bins</th><th>From HMC pile</th><th>Direct from fields</th><th>Total ticket bu</th><th>Loads</th></tr></thead><tbody>${s.elevators.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${num(e.fromBins,0)}</td><td>${num(e.fromHmc,0)}</td><td>${num(e.fromFields,0)}</td><td><b>${num(e.total,0)}</b></td><td>${num(e.loads)}</td></tr>`).join('')}<tr><td><b>TOTAL</b></td>${['fromBins','fromHmc','fromFields','total','loads'].map(k=>`<td><b>${num(s.elevators.reduce((n,e)=>n+e[k],0),0)}</b></td>`).join('')}</tr></tbody></table></div></div>
 <div class="small muted" style="margin-top:9px">Full crop year • completed loads and tickets only • dryer transfers between bins are excluded from hauled-in/out totals. Intake and ticket quantities use different moisture bases, so remaining inventory is shown from the inventory ledger. Updated ${dt(s.generatedAt)}.${s.pendingTare?' '+s.pendingTare+' dumped load(s) awaiting tare are not included yet.':''}</div>`;
 $('#seasonYear').disabled=seasonLoading;$('#seasonYear').onchange=e=>fetchSeasonSummary(e.target.value);$('#seasonRefresh').onclick=()=>fetchSeasonSummary(s.cropYear.id);
}

</script>
</body></html>
