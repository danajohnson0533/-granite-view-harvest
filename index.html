<div class="app">
  <header class="topbar">

<div class="modalBackdrop" id="modalBackdrop"><div class="modal"><div class="modalHead"><span id="modalTitle">Modal</span><button class="btn" id="modalClose">✕</button></div><div class="modalBody" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='gvfHarvestPrototypeV2';
const BACKUP_KEY='gvfHarvestPrototypeV2_backup';
const SYNC_KEY='gvfHarvestPrototypeV2_syncMeta';
const CAPACITY=65000;
const DEFAULT_TRUCKS=['Titan','Outlaw','International','08 Pete'];
const DEFAULT_DRIVERS=['Dana','Mike','Keenan','Jacob','Martin','Morgan','Nancy'];
const DEFAULT_FIELDS=['Field 1','Field 2',"Adler's — Field 3",'Field 4','Field 5','Field 7','Field 8','Stragies — Field 9',"Gar's — Field 11",'Field 10',"Betty's — Field 15","Cussy's — Field 20",'Field 23','North Delno — Field 24','South Delno — Field 25','Field 26','Field 27','Field 28','Field 29','Field 30','Field 31','Field 32','Field 33','Field 34',"Dana's — Field 36",'Cold Springs #1','Cold Springs #2','Cold Springs #3','Cold Springs #4',"Darren's Home","Deb's Alfalfa","Deb's Corn",'Germantown 3','Germantown 4','Germantown 6 South','Germantown 6 North','Germantown 9','Germantown 30','Germantown 31 North','Germantown 31 South','Lura 12 North','Lura 12 South'];
const DESTINATIONS=['POET – Big Stone','WesCon – Twin Brooks','Feed – Feedlot','Other'];
const DEFAULT_OWNERS=['Granite View Farms','Dana Johnson'];
const DEFAULT_FIELD_OWNERS=Object.fromEntries(DEFAULT_fieldList().map(f=>[f,f.startsWith('Lura 12')?'Dana Johnson':'Granite View Farms']));
const NAV=[['scale','⚖️','Scale / Tare'],['dumping','🌽','Dumping Pits'],['dryer','🏭','Dryer / Bins'],['combine','🚜','Combine View'],['loadout','🚛','Elevator Delivery'],['reports','📊','Fields / Reports'],['settings','⚙️','Settings / Demo']];
function defaultState(){
  const yesterday=new Date(Date.now()-86400000).toISOString();
  return {
    version:2,activeScreen:'scale',activeField:'Field 1',harvestType:'Dry Corn',dumpingPit:'Dry Corn Pit',
    masterData:{trucks:[...DEFAULT_TRUCKS],drivers:[...DEFAULT_DRIVERS],fields:[...DEFAULT_FIELDS]},
    truckDrivers:{Titan:'Dana',Outlaw:'Mike',International:'Keenan','08 Pete':'Jacob'},
    lastKnownTares:{Titan:{weight:25620,time:yesterday},Outlaw:{weight:26100,time:yesterday},International:{weight:28000,time:yesterday},'08 Pete':{weight:24800,time:yesterday}},
    todayTares:{},tareHistory:[],scale:{truck:'Titan',weight:0,light:'red',locked:false,lastEvent:null},
    pending:[],completed:[],nextLoadId:1,
    fieldTransition:null,
    bins:{wet:{wetBu:0,dry15Bu:0,moistureMass:0},dry1:0,dry2:0},
    dryer:{running:false,bph:950,destination:'Dry Bin #1',processedWetBu:0},
    hmc:{wetPounds:0,wetBu:0,moistureMassLb:0},
    acres:{},loadouts:[],openLoadouts:[],photoData:null,binReconciliations:[],auditLog:[],
    ownerNames:[...DEFAULT_OWNERS],fieldOwners:{...DEFAULT_FIELD_OWNERS},
    deviceControl:{binShack:'primary',hmcPit:'primary'},
    recentNotification:null
  };
}
let state=loadState();
function loadState(){let parsed=null;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)parsed=JSON.parse(raw)}catch(e){}if(!parsed){try{const backup=localStorage.getItem(BACKUP_KEY);if(backup)parsed=JSON.parse(backup)}catch(e){}}const st=parsed?Object.assign(defaultState(),parsed):defaultState();st.auditLog=Array.isArray(st.auditLog)?st.auditLog:[];st.masterData=Object.assign({trucks:[...DEFAULT_TRUCKS],drivers:[...DEFAULT_DRIVERS],fields:[...DEFAULT_FIELDS]},st.masterData||{});st.masterData.trucks=Array.from(new Set((st.masterData.trucks||DEFAULT_TRUCKS).map(String).filter(Boolean)));st.masterData.drivers=Array.from(new Set((st.masterData.drivers||DEFAULT_DRIVERS).map(String).filter(Boolean)));st.masterData.fields=Array.from(new Set((st.masterData.fields||DEFAULT_FIELDS).map(String).filter(Boolean)));if(!st.masterData.trucks.includes('08 Pete')&&st.masterData.trucks.includes('OAP'))st.masterData.trucks=st.masterData.trucks.map(x=>x==='OAP'?'08 Pete':x);if(st.activeScreen==='bin'){st.activeScreen='dumping';st.dumpingPit='Dry Corn Pit'}if(st.activeScreen==='hmc'){st.activeScreen='dumping';st.dumpingPit='High Moisture Corn Pit'}const doneIds=new Set((st.completed||[]).map(x=>String(x.id)));st.pending=(st.pending||[]).filter(x=>x&&x.status!=='completed'&&!doneIds.has(String(x.id)));return st}
function truckList(){return state.masterData?.trucks||DEFAULT_TRUCKS}
function driverList(){return state.masterData?.drivers||DEFAULT_DRIVERS}
function fieldList(){return state.masterData?.fields||DEFAULT_FIELDS}
function getSyncMeta(){try{return Object.assign({pendingLocalSaves:0,lastLocalSave:null,lastReconnect:null,lastOffline:null},JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'))}catch(e){return {pendingLocalSaves:0,lastLocalSave:null,lastReconnect:null,lastOffline:null}}}
function putSyncMeta(meta){try{localStorage.setItem(SYNC_KEY,JSON.stringify(meta))}catch(e){}}
function save(){try{const payload=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,payload);localStorage.setItem(BACKUP_KEY,payload);const meta=getSyncMeta();meta.lastLocalSave=nowISO();if(!navigator.onLine)meta.pendingLocalSaves=(meta.pendingLocalSaves||0)+1;putSyncMeta(meta);updateNetworkUI();return true}catch(e){console.error('Local save failed',e);toast('⚠️ This device could not save the latest change. Do not leave this screen until storage is available.',6500);return false}}
function nowISO(){return new Date().toISOString()}
function fmtTime(iso){if(!iso)return '—';return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}
function n(v,d=0){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function wetBushels(lb){return Number(lb||0)/56}
function shrinkFactor(m){m=Number(m); if(!isFinite(m)||m<=15)return 1; return Math.max(0,1-0.012*(m-15))}
function dry15From(lb,m){return wetBushels(lb)*shrinkFactor(m)}
function avgWetMoist(){const w=state.bins.wet.wetBu;return w>0?state.bins.wet.moistureMass/w:0}
function wetPercent(){return Math.min(100,(state.bins.wet.wetBu/CAPACITY)*100)}
function pct(v){return Math.max(0,Math.min(100,(Number(v||0)/CAPACITY)*100))}
function todayKey(){return new Date().toLocaleDateString()}
function isToday(iso){return iso && new Date(iso).toLocaleDateString()===todayKey()}
function options(arr,selected){return arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function toast(msg,ms=2800){const el=document.getElementById('toast');el.innerHTML=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms)}
function updateNetworkUI(){const online=navigator.onLine,meta=getSyncMeta(),dot=document.getElementById('networkDot'),txt=document.getElementById('networkText'),banner=document.getElementById('offlineBanner');if(dot)dot.classList.toggle('offline',!online);if(txt)txt.textContent=online?'Online • Offline protection ready':`OFFLINE • ${meta.pendingLocalSaves||0} local save${(meta.pendingLocalSaves||0)===1?'':'s'} protected`;if(banner){banner.classList.toggle('show',!online);banner.innerHTML=`⚠️ OFFLINE — KEEP WORKING. ${meta.pendingLocalSaves||0} local save${(meta.pendingLocalSaves||0)===1?' is':'s are'} protected on this device. They will sync when the connection returns.`}}
function handleOffline(){const meta=getSyncMeta();meta.lastOffline=nowISO();putSyncMeta(meta);updateNetworkUI();toast('⚠️ Internet connection lost. KEEP WORKING — entries will be saved on this device.',5200)}
function handleOnline(){const meta=getSyncMeta();const waiting=meta.pendingLocalSaves||0;meta.lastReconnect=nowISO();meta.pendingLocalSaves=0;putSyncMeta(meta);updateNetworkUI();if(waiting)toast(`✅ Connection restored. ${waiting} protected local save${waiting===1?'':'s'} preserved. Production cloud sync will upload automatically.`,5200)}
function offlineProtectionHTML(){const meta=getSyncMeta(),online=navigator.onLine;return `<div class="card offlineCard" style="margin-top:14px"><div class="cardHead">OFFLINE PROTECTION</div><div class="cardBody"><div class="syncLine"><span class="pill ${online?'good':'warn'}">${online?'● ONLINE':'● OFFLINE'}</span><b>${online?'Connection available':'Keep working — do not stop harvest'}</b></div><p>Every change is written immediately to <b>two local copies on this device</b>. If internet drops, Scale / Tare, Dumping Pits, moisture, taring and elevator entries continue working.</p><p><b>Waiting local saves:</b> ${meta.pendingLocalSaves||0}<br><b>Last device save:</b> ${meta.lastLocalSave?fmtDate(meta.lastLocalSave)+' '+fmtTime(meta.lastLocalSave):'None yet'}${meta.lastOffline?`<br><b>Last offline:</b> ${fmtDate(meta.lastOffline)} ${fmtTime(meta.lastOffline)}`:''}</p><div class="notice info"><b>Prototype note:</b> this version protects records locally and simulates the reconnect step. The production cloud version will automatically upload the protected records and confirm each one with the server.</div></div></div>`}
function setScreen(id){state.activeScreen=id;save();renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function navHTML(){return NAV.map(([id,ic,label])=>`<button class="navbtn ${state.activeScreen===id?'active':''}" data-nav="${id}"><span>${ic}</span>${label}</button>`).join('')}
function renderNav(){document.getElementById('nav').innerHTML=navHTML();document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setScreen(b.dataset.nav)))}
function showModal(title,html,onReady){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show');if(onReady)onReady()}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalClose').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function currentTare(truck){return state.todayTares[truck]||null}
function lastTare(truck){return state.todayTares[truck]||state.lastKnownTares[truck]||null}
function resolveWaitingTares(truck,newTare){let count=0,finalized=0;state.pending.forEach(l=>{if(l.truck===truck && (l.status==='waiting_tare'||l.status==='dumped_waiting_tare')){const wasDumped=l.status==='dumped_waiting_tare';l.tare=newTare.weight;l.net=Math.max(0,l.gross-newTare.weight);if(l.pendingSplit){const p=Number(l.pendingSplit.pounds||0),f1=l.pendingSplit.field1,f2=l.pendingSplit.field2;if(p>0&&p<l.net&&f1!==f2){l.fieldPortions=[{field:f1,pounds:p},{field:f2,pounds:l.net-p}];l.fieldMode='split';l.field=`${f1} / ${f2}`;delete l.pendingSplit}else{l.splitNeedsReview=true}}if(wasDumped&&!l.splitNeedsReview){if(!l.fieldPortions)l.fieldPortions=[{field:l.field,pounds:l.net}];l.status='completed';l.completedTime=l.dumpedTime||nowISO();applyCompletedLoad(l,false);state.completed.push(l);finalized++}else if(wasDumped&&l.splitNeedsReview){l.status='awaiting_moisture';}else l.status='awaiting_moisture';count++}});state.pending=state.pending.filter(l=>l.status!=='completed');return {count,finalized}}
function saveTare(){const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight first.');return}const rec={weight,time:nowISO()};state.todayTares[truck]=rec;state.lastKnownTares[truck]=rec;state.tareHistory.push({truck,weight,time:rec.time});const resolved=resolveWaitingTares(truck,rec);state.scale.light='green';state.scale.locked=true;state.scale.lastEvent=`Saved ${truck} tare at ${n(weight)} lb`;save();renderAll();toast(`✅ ${truck} tare saved at <b>${n(weight)} lb</b>${resolved.count?` • ${resolved.count} waiting load${resolved.count>1?'s':''} resolved${resolved.finalized?` (${resolved.finalized} already-dumped load${resolved.finalized>1?'s':''} finalized)`:''}`:''}`)}
function captureScale(){if(state.scale.locked){toast('Scale is locked until the truck leaves and the scale returns to zero.');return}const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight.');return}const tToday=currentTare(truck), tLast=lastTare(truck);const ref=tToday||tLast; if(!ref){showUnknownScaleModal();return}
  const diff=weight-ref.weight;

function splitLoadModal(load){let portion=0;const tarePending=load.net==null;showModal('SPLIT LOAD',`<div class="notice info">${tarePending?'Official net weight is <b>pending tare</b>. Enter the known first-field/cart pounds now; the official remainder will calculate automatically after the empty tare is recorded.':`Official net weight: <b>${n(load.net)} lb</b>`}</div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Portion 1 weight (lb)</label><input id="splitWeight" type="number" inputmode="numeric" placeholder="e.g. 28000"></div><div class="field"><label>Portion 1 field</label><select id="splitField1">${options(fieldList(),load.field)}</select></div><div class="field"><label>Remainder</label><input id="splitRemainder" disabled value="${tarePending?'CALCULATES AFTER TARE':n(load.net)}"></div><div class="field"><label>Remainder field</label><select id="splitField2">${options(fieldList(),state.activeField)}</select></div></div><div id="splitMsg" class="small muted" style="margin-top:10px"></div><button class="btn primary big" id="saveSplit" style="margin-top:12px">Save Split</button>`,()=>{const sw=document.getElementById('splitWeight'),rem=document.getElementById('splitRemainder'),msg=document.getElementById('splitMsg');sw.oninput=()=>{portion=Number(sw.value||0);if(!tarePending)rem.value=n(Math.max(0,load.net-portion));msg.textContent=tarePending?(portion>0?'Known portion saved; remainder will use the official net after tare.':''):(portion>0&&portion<load.net?'Total will equal official truck net.':'')};document.getElementById('saveSplit').onclick=()=>{const p=Number(sw.value||0),f1=document.getElementById('splitField1').value,f2=document.getElementById('splitField2').value;if(!(p>0)){msg.textContent='Enter the known first-field portion.';return}if(!tarePending&&!(p<load.net)){msg.textContent='Enter a portion less than the official net weight.';return}if(f1===f2){msg.textContent='Select two different fields.';return}if(tarePending){load.pendin function completePending(load,moisture,destination){
  if(!load){toast('This load is no longer available. Refreshing the pit queue.');renderAll();return}
  const stillPending=state.pending.some(x=>String(x.id)===String(load.id));
  const alreadyCompleted=state.completed.some(x=>String(x.id)===String(load.id))||load.status==='completed';
  if(alreadyCompleted||!stillPending){state.pending=state.pending.filter(x=>String(x.id)!==String(load.id));save();renderAll();toast(`Load #${load.id} has already been completed. It was not counted again.`);return}
  if(!(moisture>=12&&moisture<=40)){toast('Enter a valid moisture between 12.0% and 40.0%.');return}
  load.moisture=moisture;load.destination=destination;
  ensureRecentFieldChoice(load,()=>{
    const stillThere=state.pending.some(x=>String(x.id)===String(load.id));
    if(!stillThere||state.completed.some(x=>String(x.id)===String(load.id))){renderAll();toast(`Load #${load.id} was already handled. It was not counted again.`);return}
    if(load.net==null||load.tare==null){
      load.status='dumped_waiting_tare';load.dumpedTime=nowISO();
      state.recentNotification={truck:load.truck,moisture,field:load.field,time:load.dumpedTime,net:null,waitingTare:true};
      save();renderAll();
      const next=pendingFor(load.harvestType)[0];
      toast(`✅ Load #${load.id} ${esc(load.truck)} recorded as dumped — ${n(moisture,1)}% • ${esc(load.field)}.<br>⚠️ Gross is saved; final bushels wait for tare.${next?`<br><b>Next:</b> Load #${next.id} ${esc(next.truck)}`:'<br><b>Pit queue is clear.</b>'}`,5600);return
    }
    const completedId=load.id;
    state.pending=state.pending.filter(x=>String(x.id)!==String(completedId));
    load.status='completed';load.completedTime=nowISO();
    if(!load.fieldPortions)load.fieldPortions=[{field:load.field,pounds:load.net}];
    applyCompletedLoad(load);state.completed.push(load);save();renderAll();
    const next=pendingFor(load.harvestType)[0];
    toast(`✅ Completed Load #${completedId} — ${esc(load.truck)} • ${n(moisture,1)}%.${next?`<br><b>Next:</b> Load #${next.id} ${esc(next.truck)}`:'<br><b>Pit queue is clear.</b>'}`,4800)
  })
}

" type="number" value="${state.dryer.bph}"></div><div class="field"><label>Minutes to simulate</label><input id="dryerMinutes" type="number" value="60"></div></div><div class="row wrap" style="margin-top:12px"><button class="btn good" id="runDryer">Process Wet Corn</button><button class="btn" id="toggleDryer">${state.dryer.running?'Stop Dryer':'Start Dryer Status'}</button></div><div class="footerNote">Processing subtracts wet bushels from Wet Bin and adds the corresponding 15%-equivalent bushels to the selected dry bin. Wet bin is assumed well mixed.</div></div></div><div class="card"><div class="cardHead">DRYER OUTPUT DESTINATION</div><div class="cardBody"><div class="seg"><button class="btn ${state.dryer.destination==='Dry Bin #1'?'selected':''}" data-drydest="Dry Bin #1">Dry Bin #1</button><button class="btn ${state.dryer.destination==='Dry Bin #2'?'selected':''}" data-drydest="Dry Bin #2">Dry Bin #2</button></div><div class="notice" style="margin-top:12px"><b>Important:</b> change this setting whenever the physical double-run conveyor is switched.</div><div class="sectionLine"></div><div>Processed this prototype session: <b>${n(state.dryer.processedWetBu,0)} wet bu</b></div></div></div></div><div class="card" style="margin-top:14px"><div class="cardHead">END-OF-SEASON BIN RECONCILIATION</div><div class="cardBody"><div class="notice info"><b>Do not let a calculated zero stop load-out.</b> If grain is still physically in the bin, keep entering the official elevator tickets. The calculated balance may go negative. When the bin is actually empty, reconcile it to zero.</div><div class="grid g3" style="margin-top:12px">${['Wet Bin','Dry Bin #1','Dry Bin #2'].map(b=>`<div class="binCard" style="display:block"><b>${esc(b)}</b><div class="kpi" style="font-size:24px;margin:6px 0">${n(binBalance15(b),1)} bu</div><button class="btn reconcileBin" data-bin="${esc(b)}">BIN IS PHYSICALLY EMPTY</button></div>`).join('')}</div><div class="sectionLine"></div><div class="grid g2"><div><div class="small muted">Current planning shrink assumption</div><div class="kpi">1.20% / point</div><div class="small muted">above 15% moisture</div></div><div>${storageEmpty&&sm.impliedRate!=null?`<div class="small muted">Observed effective season shrink</div><div class="kpi">${n(sm.impliedRate,2)}% / point</div><div class="small">Official bin load-out: ${n(sm.officialOut,0)} bu • Calculated at 1.20%: ${n(sm.expected15,0)} bu • Difference: ${sm.officialOut-sm.expected15>=0?'+':''}${n(sm.officialOut-sm.expected15,0)} bu</div>`:`<div class="small muted">Observed effective season shrink</div><div class="kpi">PENDING</div><div class="small muted">This becomes meaningful after all stored corn is physically gone and the bin balances are reconciled.</div>`}</div></div><div class="notice warn" style="margin-top:12px"><b>Effective shrink is a calibration number, not pure drying shrink.</b> It can also reflect moisture-sample error, test weight, handling loss and elevator adjustments. We can use it to tune next year's default instead of blindly assuming 1.20%.</div>${(state.binReconciliations||[]).length?`<div class="sectionLine"></div><b>Recent reconciliations</b>${state.binReconciliations.slice().reverse().slice(0,5).map(r=>`<div class="queueItem"><div><b>${esc(r.bin)}</b><div class="small muted">${fmtDate(r.time)} ${fmtTime(r.time)} • calculated ${n(r.before,1)} bu → physical 0</div></div><div style="text-align:right"><b>${r.adjustment>=0?'+':''}${n(r.adjustment,1)} bu</b><div class="small muted">adjustment</div></div></div>`).join('')}`:''}</div></div>`;
 document.getElementById('dryerBph').onchange=e=>{state.dryer.bph=Math.max(0,Number(e.target.value||0));save()};document.getElementById('toggleDryer').onclick=()=>{state.dryer.running=!state.dryer.running;save();renderAll()};document.querySelectorAll('[data-drydest]').forEach(b=>b.onclick=()=>{state.dryer.destination=b.dataset.drydest;save();renderAll();toast(`Dryer output set to <b>${esc(state.dryer.destination)}</b>.`)});document.querySelectorAll('.reconcileBin').forEach(b=>b.onclick=()=>reconcileBin(b.dataset.bin));document.getElementById('runDryer').onclick=()=>{const bph=Math.max(0,Number(document.getElementById('dryerBph').value||0)),mins=Math.max(0,Number(document.getElementById('dryerMinutes').value||0));let amount=bph*(mins/60);if(amount<=0){toast('Enter a valid throughput and minutes.');return}amount=Math.min(amount,state.bins.wet.wetBu);if(amount<=0){toast('Wet Bin has no wet corn to process.');return}const fraction=state.bins.wet.wetBu?amount/state.bins.wet.wetBu:0;const dryOut=state.bins.wet.dry15Bu*fraction;const avgM=avgWetMoist();state.bins.wet.wetBu-=amount;state.bins.wet.dry15Bu-=dryOut;state.bins.wet.moistureMass=Math.max(0,state.bins.wet.moistureMass-amount*avgM);if(state.dryer.destination==='Dry Bin #1')state.bins.dry1+=dryOut;else state.bins.dry2+=dryOut;state.dryer.processedWetBu+=amount;save();renderAll();toast(`Processed <b>${n(amount,0)} wet bu</b> → ${esc(state.dryer.destination)} (+${n(dryOut,0)} bu @15%).`)}

function renderCombine(){const rows=state.completed.slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).slice(0,8);const last=rows[0];const last5=rows.slice(0,5);const avg=last5.length?last5.reduce((s,l)=>s+l.moisture,0)/last5.length:0;document.getElementById('combineScreen').innerHTML=`<h1 class="screenTitle">Combine View</h1><p class="subtitle">Read-only quick check. In the real app, FieldView can stay open and this system will send a push banner/sound when a load is completed.</p><div class="card"><div class="cardBody">${last?`<div class="grid g3"><div><div class="small muted">LAST TRUCK</div><div class="truckName">${esc(last.truck)} IS DUMPING</div></div><div><div class="small muted">MOISTURE</div><div class="bigWeight">${n(last.moisture,1)}%</div></div><div><div class="small muted">FIELD</div><div class="kpi">${esc(last.field)}</div></div></div>`:`<div class="emptyState">Complete a load at Dumping Pits to populate Combine View.</div>`}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardHead">RECENT LOADS</div><div class="cardBody tableWrap">${rows.length?`<table class="table"><thead><tr><th>Truck</th><th>Moisture</th><th>Field</th><th>Time</th><th>Net Weight</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l.truck)}</b></td><td>${n(l.moisture,1)}%</td><td>${esc(l.field)}</td><td>${fmtTime(l.completedTime)}</td><td>${n(l.net)} lb</td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed loads.</div>`}</div></div><div class="card"><div class="cardHead">MOISTURE QUICK STATS</div><div class="cardBody"><div class="grid g3"><div><div class="small muted">Last 5 Avg.</div><div class="kpi">${n(avg,1)}%</div></div><div><div class="small muted">High</div><div class="kpi">${last5.length?n(Math.max(...last5.map(x=>x.moisture)),1):'0.0'}%</div></div><div><div class="small muted">Low</div><div class="kpi">${last5.length?n(Math.min(...last5.map(x=>x.moisture)),1):'0.0'}%</div></div></div><div class="sectionLine"></div><b>Active field:</b> ${esc(state.activeField)}<br><b>Harvest type:</b> ${esc(state.harvestType)}</div></div></div>`}
function subtractBinBushels(source,bushels){bushels=Number(bushels||0);if(source==='Dry Bin #1')state.bins.dry1-=bushels;else if(source==='Dry Bin #2')state.bins.dry2-=bushels;else if(source==='Wet Bin'){const avail=Number(state.bins.wet.dry15Bu||0);if(avail>0){const take=Math.min(avail,bushels),frac=take/avail;state.bins.wet.wetBu=Math.max(0,state.bins.wet.wetBu*(1-frac));state.bins.wet.moistureMass=Math.max(0,state.bins.wet.moistureMass*(1-frac))}state.bins.wet.dry15Bu=avail-bushels}}
function finishOpenLoadout(id){const o=state.openLoadouts.find(x=>x.id===id);if(!o)return;showModal('FINISH ELEVATOR TICKET',`<div class="notice warn"><b>${esc(o.truck)} → ${esc(o.destination)}</b><br>${esc(o.sourceType)}: ${esc(o.source)}<br><span class="small">Started ${fmtDate(o.startTime)} ${fmtTime(o.startTime)} • Ticket still needed</span></div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Ticket Bushels — Already Adjusted / Shrunk</label><input id="finishBu" type="number" inputmode="decimal" placeholder="e.g. 1086.4"></div><div class="field"><label>Buyer Moisture (%)</label><input id="finishMoist" type="number" inputmode="decimal" placeholder="e.g. 17.8"></div></div><div class="field" style="margin-top:10px"><label>Buyer Net Weight (lb) — optional but useful for field production records</label><input id="finishNet" type="number" inputmode="numeric" placeholder="e.g. 60838"></div><div class="field" style="margin-top:10px"><label>Buyer Ticket Photo</label><input id="finishPhoto" type="file" accept="image/*" capture="environment" style="display:none"><button class="btn primary big" id="finishTakePhoto">📷 TAKE TICKET PHOTO</button><img id="finishPreview" class="photoPreview" alt="Ticket photo preview"><div id="finishPhotoSaved" class="small muted">No photo attached yet.</div></div><div class="notice info" style="margin-top:10px"><b>No second shrink:</b> the ticket bushels are stored exactly as the elevator reports them. The app will not apply the 1.2% harvest shrink again.</div><button class="btn good big" id="finishComplete" style="margin-top:12px">COMPLETE LOAD</button>`,()=>{let photoData=null;document.getElementById('finishTakePhoto').onclick=()=>document.getElementById('finishPhoto').click();document.getElementById('finishPhoto').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;const img=document.getElementById('finishPreview');img.src=photoData;img.style.display='block';document.getElementById('finishPhotoSaved').textContent='Photo attached.'};r.readAsDataURL(f)};document.getElementById('finishComplete').onclick=()=>{const bushels=Number(document.getElementById('finishBu').value||0),moisture=Number(document.getElementById('finishMoist').value||0),netLb=Number(document.getElementById('finishNet').value||0);if(!(bushels>0)){toast('Enter the buyer ticket bushels.');return}if(!(moisture>=12&&moisture<=40)){toast('Enter a valid buyer moisture between 12% and 40%.');return}if(o.sourceType==='Bin')subtractBinBushels(o.source,bushels);state.loadouts.push({id:o.id,startTime:o.startTime,time:nowISO(),truck:o.truck,driver:o.driver,destination:o.destination,sourceType:o.sourceType,source:o.source,sourceLabel:o.source,field:o.sourceType==='Field'?o.source:null,owner:o.sourceType==='Field'?(state.fieldOwners[o.source]||'Unassigned'):null,bushels,moisture,netLb,photoData:photoData||null,status:'completed',ticketAlreadyAdjusted:true});state.openLoadouts=state.openLoadouts.filter(x=>x.id!==id);save();closeModal();renderAll();toast(`Completed ${esc(o.truck)} → ${esc(o.destination)}: ${n(bushels,1)} adjusted bu.`)}})}
function renderLoadout(){const open=state.openLoadouts||[];document.getElementById('loadoutScreen').innerHTML=`<h1 class="screenTitle">Elevator Delivery</h1><p class="subtitle">One workflow for loads leaving a grain bin or going directly from a field to POET/WesCon. Start the load before leaving; finish it when the elevator ticket is received.</p>${open.length?`<div class="notice warn" style="margin-bottom:14px"><b>⚠️ ${open.length} OPEN LOAD${open.length===1?'':'S'} — TICKET NEEDED</b><div class="small">An open load stays visible until its buyer ticket is entered. A truck cannot normally start another outbound load while its previous ticket is unfinished.</div></div>`:''}<div class="grid g2 mobileOne"><div class="card mobileForm"><div class="cardHead">START ELEVATOR DELIVERY</div><div class="cardBody"><div class="notice info"><b>Calculated bin balances:</b> Wet ${n(state.bins.wet.dry15Bu,0)} bu @15% • Dry #1 ${n(state.bins.dry1,0)} • Dry #2 ${n(state.bins.dry2,0)}<div class="small">If a bin physically still has corn after the app reaches zero, keep recording tickets. Negative balances are allowed until the bin is actually empty, then reconcile it under Dryer / Bins.</div></div><div class="field"><label>Where is this load coming from?</label><select id="loSourceType"><option>Bin</option><option>Field</option></select></div><div class="field"><label id="loSourceLabel">Source Bin</label><select id="loSource"></select></div><div class="field"><label>Truck</label><select id="loTruck">${options(truckList(),'Titan')}</select></div><div class="field"><label>Driver</label><select id="loDriver">${options(driverList(),'Dana')}</select></div><div class="field"><label>Destination</label><select id="loDest">${options(DESTINATIONS,'POET – Big Stone')}</select></div><button class="btn good big" id="startLoadout">START LOAD</button><div class="footerNote">No bushels or moisture are needed yet. This creates an OPEN LOAD — TICKET NEEDED record.</div></div></div><div><div class="card"><div class="cardHead">OPEN LOADS — FINISH TICKET</div><div class="cardBody">${open.length?open.slice().sort((a,b)=>new Date(a.startTime)-new Date(b.startTime)).map(o=>`<div class="queueItem current"><div><div class="qTruck">${esc(o.truck)} → ${esc(o.destination)}</div><div class="small">${esc(o.sourceType)}: ${esc(o.source)} • ${esc(o.driver)}</div><div class="small muted">Started ${fmtTime(o.startTime)} — TICKET NOT ENTERED</div></div><button class="btn primary finishOpen" data-id="${esc(o.id)}">FINISH TICKET</button></div>`).join(''):`<div class="emptyState">No unfinished outbound loads.</div>`}</div></div><div class="card" style="margin-top:14px"><div class="cardHead">RECENT ELEVATOR DELIVERIES</div><div class="cardBody">${state.loadouts.length?state.loadouts.slice().reverse().slice(0,8).map(l=>`<div class="queueItem"><div><b>${esc(l.truck)}</b> → ${esc(l.destination)}<div class="small muted">${esc(l.sourceType||'Bin')}: ${esc(l.sourceLabel||l.source||'')} • ${fmtDate(l.time)} ${fmtTime(l.time)}</div>${l.sourceType==='Field'?`<div class="small">Owner: ${esc(l.owner||state.fieldOwners[l.field]||'Unassigned')}</div>`:''}</div><div style="text-align:right"><b>${n(l.bushels,1)} bu</b><div class="small">${n(l.moisture,1)}%</div><button class="btn correctDelivery" data-id="${esc(l.id)}" style="margin-top:6px">Correct</button></div></div>`).join(''):`<div class="emptyState">No completed elevator deliveries recorded.</div>`}</div></div></div></div>`;
 const type=document.getElementById('loSourceType'),source=document.getElementById('loSource'),label=document.getElementById('loSourceLabel');function refreshSource(){if(type.value==='Field'){source.innerHTML=options(fieldList(),state.activeField);label.textContent='Source Field'}else{source.innerHTML='<option>Dry Bin #1</option><option>Dry Bin #2</option><option>Wet Bin</option>';label.textContent='Source Bin'}}type.onchange=refreshSource;refreshSource();document.getElementById('startLoadout').onclick=()=>{const truck=document.getElementById('loTruck').value;if((state.openLoadouts||[]).some(x=>x.truck===truck)){toast(`<b>${esc(truck)}</b> already has an unfinished outbound load. Finish that ticket before starting another.`);return}const sourceType=type.value,src=source.value,driver=document.getElementById('loDriver').value,destination=document.getElementById('loDest').value;state.openLoadouts.push({id:'LO-'+Date.now(),startTime:nowISO(),sourceType,source:src,truck,driver,destination,status:'ticket_needed'});save();renderAll();toast(`Started ${esc(truck)} load. Ticket is now pending.`)};document.querySelectorAll('.finishOpen').forEach(b=>b.onclick=()=>finishOpenLoadout(b.dataset.id));document.querySelectorAll('.correctDelivery').forEach(b=>b.onclick=()=>correctElevatorDelivery(b.dataset.id))}
function fieldRows(){const map={};function getRow(field,type){const key=field+'|'+type;if(!map[key])map[key]={field,type,owner:state.fieldOwners[field]||'Unassigned',loads:new Set(),wetLb:0,moistMass:0,dry15:0,dates:[],directAdjustedBu:0};return map[key]}for(const l of state.completed){for(const p of (l.fieldPortions||[{field:l.field,pounds:l.net}])){const r=getRow(p.field,l.harvestType);r.loads.add('H'+l.id);r.wetLb+=p.pounds;r.moistMass+=p.pounds*l.moisture;r.dry15+=dry15From(p.pounds,l.moisture);r.dates.push(l.completedTime||l.time)}}for(const l of (state.loadouts||[])){if(l.sourceType!=='Field'||!l.field)continue;const r=getRow(l.field,'Dry Corn');r.loads.add(l.id||('O'+l.time));if(Number(l.netLb)>0){r.wetLb+=Number(l.netLb);r.moistMass+=Number(l.netLb)*Number(l.moisture||0)}r.dry15+=Number(l.bushels||0);r.directAdjustedBu+=Number(l.bushels||0);r.dates.push(l.time)}return Object.values(map).map(r=>{r.wetBu=wetBushels(r.wetLb);r.avgMoist=r.wetLb?r.moistMass/r.wetLb:0;r.loadCount=r.loads.size;const ac=Number(state.acres[r.field+'|'+r.type]||0);r.acres=ac;r.yield=ac?(r.type==='Dry Corn'?r.dry15:r.wetBu)/ac:0;r.minDate=r.dates.length?new Date(Math.min(...r.dates.map(x=>+new Date(x)))).toISOString():null;r.maxDate=r.dates.length?new Date(Math.max(...r.dates.map(x=>+new Date(x)))).toISOString():null;return r}).sort((a,b)=>a.field.localeCompare(b.field))}
function ownerTotals(rows){const m={};for(const r of rows){const o=r.owner||'Unassigned';if(!m[o])m[o]={owner:o,dry15:0,wetBu:0,fields:new Set()};m[o].dry15+=r.type==='Dry Corn'?r.dry15:0;m[o].wetBu+=r.wetBu;m[o].fields.add(r.field)}return Object.values(m).map(x=>({...x,fieldCount:x.fields.size})).sort((a,b)=>a.owner.localeCompare(b.owner))}
function dateRange(r){if(!r.minDate)return '—';const a=fmtDate(r.minDate),b=fmtDate(r.maxDate);return a===b?a:`${a} – ${b}`}
function renderReports(){const rows=fieldRows(),owners=ownerTotals(rows),audit=(state.auditLog||[]).slice().reverse().slice(0,30);document.getElementById('reportsScreen').innerHTML=`<div class="printOnly"><h1>Granite View Farms — Field Harvest Summary</h1><p>15% equivalent uses prototype USDA-style 1.2% shrink per moisture point above 15% for farm-measured harvest loads. Elevator ticket bushels marked already adjusted are never shrunk again.</p></div><h1 class="screenTitle">Fields / Owners / Reports</h1><p class="subtitle">Every field is tied to an owner/entity. Completed harvest loads and elevator deliveries can be corrected here without erasing the original values.</p><div class="grid g2" style="margin-bottom:14px"><div class="card"><div class="cardHead">OWNER / ENTITY TOTALS</div><div class="cardBody">${owners.length?owners.map(o=>`<div class="queueItem"><div><b>${esc(o.owner)}</b><div class="small muted">${o.fieldCount} field${o.fieldCount===1?'':'s'}</div></div><div style="text-align:right"><b>${n(o.dry15,0)} bu @15%</b><div class="small">${n(o.wetBu,0)} wet bu measured</div></div></div>`).join(''):`<div class="emptyState">Owner totals appear as harvest loads are completed.</div>`}</div></div><div class="card"><div class="cardHead">CORRECTION RULE</div><div class="cardBody"><div class="notice good"><b>Corrections recalculate the affected totals.</b><br>Changing a field, moisture, weight or destination adjusts field/owner production and calculated inventory.</div><div class="notice info" style="margin-top:10px"><b>Audit trail:</b> original values are kept with the correction time and who made the change. Nothing is silently overwritten.</div></div></div></div><div class="row wrap reportControls noPrint"><button class="btn primary" id="printReport">🖨️ Print All-Fields Summary</button><button class="btn" id="exportCsv">Export CSV</button><span class="small muted">Harvested acres can be entered below.</span></div><div class="card" style="margin-top:14px"><div class="cardHead">ALL FIELD SUMMARIES</div><div class="cardBody tableWrap">${rows.length?`<table class="table" id="fieldSummaryTable"><thead><tr><th>Field</th><th>Owner</th><th>Type</th><th>Harvest Date(s)</th><th>Wet Bushels</th><th>Avg Moisture</th><th>15% / Adjusted Bu</th><th>Direct Elevator Bu</th><th>Harvested Acres</th><th>Yield</th><th class="noPrint">Loads</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.field)}</b></td><td>${esc(r.owner)}</td><td>${esc(r.type)}</td><td>${dateRange(r)}</td><td>${n(r.wetBu,0)}</td><td>${r.wetLb?n(r.avgMoist,1)+'%':'—'}</td><td>${n(r.dry15,0)}</td><td>${n(r.directAdjustedBu,0)}</td><td class="noPrint"><input class="acreInput" data-key="${esc(r.field+'|'+r.type)}" type="number" step="0.1" value="${r.acres||''}" style="width:86px;padding:6px"></td><td class="printOnly">${r.acres?n(r.acres,1):'—'}</td><td>${r.acres?n(r.yield,1):'—'} ${r.type==='Dry Corn'?'bu/ac @15%':'wet bu/ac'}</td><td class="noPrint">${r.loadCount}</td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed harvest loads yet.</div>`}</div></div><div class="card fieldDetail noPrint" style="margin-top:14px"><div class="cardHead">INDIVIDUAL HARVEST LOAD HISTORY — CORRECT MISTAKES</div><div class="cardBody tableWrap">${state.completed.length?`<table class="table"><thead><tr><th>Load</th><th>Date / Time</th><th>Truck</th><th>Driver</th><th>Field(s)</th><th>Net Weight</th><th>Moisture</th><th>Destination</th><th>Action</th></tr></thead><tbody>${state.completed.slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).map(l=>`<tr><td><b>#${esc(l.id)}</b>${l.corrected?`<div class="small" style="color:var(--goldDark)">Corrected</div>`:''}</td><td>${fmtDate(l.completedTime)} ${fmtTime(l.completedTime)}</td><td>${esc(l.truck)}</td><td>${esc(l.driver)}</td><td>${esc((l.fieldPortions||[]).map(p=>p.field).join(' / ')||l.field)}</td><td>${n(l.net)} lb</td><td>${n(l.moisture,1)}%</td><td>${esc(l.destination||'')}</td><td><button class="btn correctHarvest" data-id="${esc(l.id)}">Correct Load</button></td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed loads.</div>`}</div></div><div class="card noPrint" style="margin-top:14px"><div class="cardHead">ELEVATOR DELIVERY HISTORY — CORRECT TICKETS</div><div class="cardBody tableWrap">${state.loadouts.length?`<table class="table"><thead><tr><th>Date</th><th>Truck</th><th>Source</th><th>Destination</th><th>Ticket Bu</th><th>Moisture</th><th>Action</th></tr></thead><tbody>${state.loadouts.slice().sort((a,b)=>new Date(b.time)-new Date(a.time)).map(l=>`<tr><td>${fmtDate(l.time)} ${fmtTime(l.time)}</td><td>${esc(l.truck)}</td><td>${esc(l.sourceType)}: ${esc(l.sourceLabel||l.source||'')}</td><td>${esc(l.destination)}</td><td>${n(l.bushels,1)}</td><td>${n(l.moisture,1)}%</td><td><button class="btn correctDeliveryReport" data-id="${esc(l.id)}">Correct Delivery</button></td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed elevator deliveries.</div>`}</div></div><div class="card noPrint" style="margin-top:14px"><div class="cardHead">CORRECTION AUDIT TRAIL</div><div class="cardBody">${audit.length?audit.map(a=>`<div class="queueItem"><div><b>${esc(a.recordType)} ${esc(a.recordId)}</b><div class="small">${esc(a.summary)}</div><div class="small muted">Changed by ${esc(a.changedBy)} • ${fmtDate(a.time)} ${fmtTime(a.time)}</div></div></div>`).join(''):`<div class="emptyState">No corrections have been made.</div>`}</div></div>`;
 document.querySelectorAll('.acreInput').forEach(i=>i.onchange=e=>{state.acres[e.target.dataset.key]=Math.max(0,Number(e.target.value||0));save();renderAll()});document.querySelectorAll('.correctHarvest').forEach(b=>b.onclick=()=>correctHarvestLoad(b.dataset.id));document.querySelectorAll('.correctDeliveryReport').forEach(b=>b.onclick=()=>correctElevatorDelivery(b.dataset.id));document.getElementById('printReport').onclick=()=>window.print();document.getElementById('exportCsv').onclick=()=>{const header=['Field','Owner','Harvest Type','Harvest Dates','Wet Bushels','Average Moisture','15% / Adjusted Bushels','Direct Elevator Adjusted Bushels','Harvested Acres','Yield'];const csv=[header.join(',')].concat(rows.map(r=>[r.field,r.owner,r.type,dateRange(r),r.wetBu.toFixed(2),r.wetLb?r.avgMoist.toFixed(2):'',r.dry15.toFixed(2),r.directAdjustedBu.toFixed(2),r.acres||'',r.yield?r.yield.toFixed(2):''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='granite-view-field-owner-summary.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function seedDemo(){state=defaultState();const t=nowISO();state.todayTares={Titan:{weight:25620,time:t},Outlaw:{weight:26100,time:t},International:{weight:28000,time:t},'08 Pete':{weight:24800,time:t}};Object.assign(state.lastKnownTares,state.todayTares);state.bins.dry1=18400;state.bins.dry2=12600;state.activeField='Field 5';state.harvestType='Dry Corn';const demos=[['Titan','Dana','Field 5',78340,25620,24.1,'Wet Bin'],['Outlaw','Mike','Field 5',76440,26100,23.6,'Wet Bin'],['International','Keenan','Field 5',76920,28000,19.8,'Wet Bin'],['08 Pete','Jacob','Germantown 4',74680,24800,16.0,'Dry Bin #1']];demos.forEach((d,i)=>{const [truck,driver,field,gross,tare,m,dest]=d;const l={id:state.nextLoadId++,truck,driver,field,harvestType:'Dry Corn',gross,tare,net:gross-tare,time:new Date(Date.now()-(demos.length-i)*12*60000).toISOString(),status:'completed',moisture:m,destination:dest,fieldPortions:[{field,pounds:gross-tare}],fieldMode:'default',completedTime:new Date(Date.now()-(demos.length-i)*10*60000).toISOString()};applyCompletedLoad(l);state.completed.push(l)});state.recentNotification=state.completed.at(-1);save();renderAll();toast('Demo scenario loaded. You can reset anytime in Settings / Demo.')}
function cleanName(v){return String(v||'').trim().replace(/\s+/g,' ')}
function masterList(kind){return kind==='truck'?truckList():kind==='driver'?driverList():fieldList()}
function addMasterItem(kind,raw){const name=cleanName(raw);if(!name){toast('Enter a name first.');return false}const list=masterList(kind);if(list.some(x=>x.toLowerCase()===name.toLowerCase())){toast(`That ${kind} already exists.`);return false}if(kind==='truck'){state.masterData.trucks.push(name);state.truckDrivers[name]=driverList()[0]||''}else if(kind==='driver'){state.masterData.drivers.push(name)}else{state.masterData.fields.push(name);state.fieldOwners[name]=(state.ownerNames||DEFAULT_OWNERS)[0]||'Granite View Farms'}save();renderAll();toast(`Added ${kind}: <b>${esc(name)}</b>`);return true}
function renameTruck(oldName,newName){state.masterData.trucks=truckList().map(x=>x===oldName?newName:x);if(state.scale.truck===oldName)state.scale.truck=newName;if(Object.prototype.hasOwnProperty.call(state.truckDrivers,oldName)){state.truckDrivers[newName]=state.truckDrivers[oldName];delete state.truckDrivers[oldName]}for(const key of ['lastKnownTares','todayTares']){if(Object.prototype.hasOwnProperty.call(state[key],oldName)){state[key][newName]=state[key][oldName];delete state[key][oldName]}}(state.tareHistory||[]).forEach(x=>{if(x.truck===oldName)x.truck=newName});[state.pending,state.completed,state.openLoadouts,state.loadouts].forEach(arr=>(arr||[]).forEach(x=>{if(x.truck===oldName)x.truck=newName}))}
function renameDriver(oldName,newName){state.masterData.drivers=driverList().map(x=>x===oldName?newName:x);Object.keys(state.truckDrivers||{}).forEach(t=>{if(state.truckDrivers[t]===oldName)state.truckDrivers[t]=newName});[state.pending,state.completed,state.openLoadouts,state.loadouts].forEach(arr=>(arr||[]).forEach(x=>{if(x.driver===oldName)x.driver=newName}))}
function renameField(oldName,newName){state.masterData.fields=fieldList().map(x=>x===oldName?newName:x);if(state.activeField===oldName)state.activeField=newName;if(state.fieldTransition){if(state.fieldTransition.from===oldName)state.fieldTransition.from=newName;if(state.fieldTransition.to===oldName)state.fieldTransition.to=newName}if(Object.prototype.hasOwnProperty.call(state.fieldOwners,oldName)){state.fieldOwners[newName]=state.fieldOwners[oldName];delete state.fieldOwners[oldName]}const acres={};Object.entries(state.acres||{}).forEach(([k,v])=>{const prefix=oldName+'|';acres[k.startsWith(prefix)?newName+k.slice(oldName.length):k]=v});state.acres=acres;const changeLoad=l=>{if(!l)return;if(l.field===oldName)l.field=newName;(l.fieldPortions||[]).forEach(p=>{if(p.field===oldName)p.field=newName});if(l.pendingSplit){if(l.pendingSplit.field1===oldName)l.pendingSplit.field1=newName;if(l.pendingSplit.field2===oldName)l.pendingSplit.field2=newName}if(l.fieldPortions&&l.fieldPortions.length)l.field=l.fieldPortions.map(p=>p.field).join(' / ')};[state.pending,state.completed].forEach(arr=>(arr||[]).forEach(changeLoad));(state.openLoadouts||[]).forEach(x=>{if(x.sourceType==='Field'&&x.source===oldName)x.source=newName});(state.loadouts||[]).forEach(x=>{if(x.sourceType==='Field'){if(x.source===oldName)x.source=newName;if(x.sourceLabel===oldName)x.sourceLabel=newName;if(x.field===oldName)x.field=newName}})}
function renameMasterItem(kind,oldName,raw){const newName=cleanName(raw);if(!newName||newName===oldName)return false;const list=masterList(kind);if(list.some(x=>x!==oldName&&x.toLowerCase()===newName.toLowerCase())){toast(`Another ${kind} already uses that name.`);return false}if(kind==='truck')renameTruck(oldName,newName);else if(kind==='driver')renameDriver(oldName,newName);else renameField(oldName,newName);save();renderAll();toast(`Renamed ${kind}: <b>${esc(oldName)}</b> → <b>${esc(newName)}</b>`);return true}
function masterDataManagerHTML(){const rows=(kind,list)=>list.map(x=>`<div class="queueItem"><div><b>${esc(x)}</b>${kind==='field'?`<div class="small muted">Owner: ${esc(state.fieldOwners[x]||'Unassigned')}</div>`:''}</div><button class="btn editMaster" data-kind="${kind}" data-name="${encodeURIComponent(x)}">Rename</button></div>`).join('');return `<div class="card" style="margin-top:14px"><div class="cardHead">TRUCKS / DRIVERS / FIELDS</div><div class="cardBody"><div class="notice info"><b>Editable master lists:</b> rename an existing item or add a new one. Renaming updates the prototype records tied to that same truck, driver or field. If you replace a truck with a different truck, add it as a new truck instead of renaming the old one.</div><div class="grid g3" style="margin-top:14px"><div><h3 style="margin:0 0 8px">Trucks</h3><div class="row"><input id="newTruck" placeholder="New truck name" style="min-width:0;flex:1;padding:10px;border:1px solid #cfc8c0;border-radius:9px"><button class="btn primary" id="addTruck">Add</button></div><div style="margin-top:10px">${rows('truck',truckList())}</div></div><div><h3 style="margin:0 0 8px">Drivers</h3><div class="row"><input id="newDriver" placeholder="New driver name" style="min-width:0;flex:1;padding:10px;border:1px solid #cfc8c0;border-radius:9px"><button class="btn primary" id="addDriver">Add</button></div><div style="margin-top:10px">${rows('driver',driverList())}</div></div><div><h3 style="margin:0 0 8px">Fields</h3><div class="row"><input id="newField" placeholder="New field name" style="min-width:0;flex:1;padding:10px;border:1px solid #cfc8c0;border-radius:9px"><button class="btn primary" id="addField">Add</button></div><div style="margin-top:10px;max-height:430px;overflow:auto">${rows('field',fieldList())}</div></div></div></div></div>`}
function renderSettings(){const ownerOpts=sel=>(state.ownerNames||DEFAULT_OWNERS).map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');document.getElementById('settingsScreen').innerHTML=`<h1 class="screenTitle">Settings / Demo</h1><p class="subtitle">Prototype controls plus editable trucks, drivers, fields and owner/entity assignments.</p>${masterDataManagerHTML()}<div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardHead">PROTOTYPE ASSUMPTIONS</div><div class="cardBody"><ul><li>Working capacity: 65,000 bu each for Wet Bin, Dry Bin #1 and Dry Bin #2.</li><li>Dry-equivalent basis: 15.0%.</li><li>Farm-measured harvest shrink: 1.2% per moisture point above 15%.</li><li>Elevator ticket bushels marked already adjusted are never shrunk again.</li><li><b>End-of-season reconciliation:</b> bin balances may go negative rather than stopping load-out. When a bin is physically empty, reconcile it to zero; after all stored corn is gone, the app calculates the season's observed effective shrink rate for comparison with the 1.2% planning assumption.</li><li>Likely-empty threshold: within 5,000 lb of last known tare.</li><li><b>Forgotten empty tare safeguard:</b> a loaded truck can still weigh and dump. Gross, moisture and destination are saved; net weight/inventory finalize automatically when that truck later records its empty tare.</li><li><b>Offline protection:</b> every change is saved locally in duplicate; harvest can continue through an internet outage and protected records sync after reconnect.</li><li><b>Load corrections:</b> completed harvest loads and elevator deliveries can be corrected from Fields / Reports. The original values remain in an audit trail and inventory/owner totals are adjusted automatically.</li><li>Moisture completion range: 12.0%–40.0%.</li><li>HMC feed-out is not tracked here; Performance Beef handles that after harvest.</li></ul></div></div><div class="card"><div class="cardHead">MULTI-DEVICE SAFEGUARDS — PRODUCTION DESIGN</div><div class="cardBody"><p><b>Dumping Pits:</b> one page contains both the Dry Corn Pit and High Moisture Corn Pit. Each physical pit keeps its own active control device.</p><p><b>Other phones/computers:</b> open those screens View Only by default.</p><p><b>Load locking:</b> only one device can actively edit a load at a time.</p><p><b>Duplicate protection:</b> server accepts a load completion once; a second completion attempt is rejected.</p><p><b>Take Control:</b> admin can deliberately transfer control if the primary device fails.</p><div class="notice info">This single-file prototype uses local browser storage, so true cross-device locking requires the production cloud database/server.</div></div></div></div>${offlineProtectionHTML()}<div class="card" style="margin-top:14px"><div class="cardHead">FIELD OWNER / ENTITY ASSIGNMENTS</div><div class="cardBody"><div class="row wrap"><div class="field" style="min-width:240px"><label>Add another owner/entity</label><input id="newOwner" placeholder="e.g. Johnson Farms LLC"></div><button class="btn primary" id="addOwner">Add Owner</button></div><div class="sectionLine"></div><div class="tableWrap"><table class="table"><thead><tr><th>Field</th><th>Owner / Entity</th></tr></thead><tbody>${fieldList().map(f=>`<tr><td><b>${esc(f)}</b></td><td><select class="ownerSelect" data-field="${esc(f)}" style="padding:7px;min-width:190px">${ownerOpts(state.fieldOwners[f]||'Granite View Farms')}</select></td></tr>`).join('')}</tbody></table></div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardHead">DEMO DATA</div><div class="cardBody"><button class="btn gold big" id="seedDemo">Load Sample Harvest Data</button><div class="sectionLine"></div><button class="btn" id="clearPending">Clear Pending Test Loads Only</button><div class="sectionLine"></div><button class="btn danger big" id="resetAll">Reset Prototype to Empty</button><p class="footerNote">Prototype data is stored only in this browser/device using local storage.</p></div></div><div class="card"><div class="cardHead">WHAT IS SIMULATED</div><div class="cardBody"><p><b>RFID:</b> choose a truck manually on Scale / Tare.</p><p><b>WI-127:</b> type a stable weight and tap Capture Stable Weight.</p><p><b>Grain Handler / Dryer Master:</b> enter BPH and minutes manually.</p><p><b>Combine notification:</b> completing a load shows a prototype toast.</p><p><b>Ticket camera:</b> Finish Ticket uses the device camera/file picker.</p></div></div></div>`;
 document.getElementById('addTruck').onclick=()=>addMasterItem('truck',document.getElementById('newTruck').value);document.getElementById('addDriver').onclick=()=>addMasterItem('driver',document.getElementById('newDriver').value);document.getElementById('addField').onclick=()=>addMasterItem('field',document.getElementById('newField').value);document.querySelectorAll('.editMaster').forEach(b=>b.onclick=()=>{const kind=b.dataset.kind,oldName=decodeURIComponent(b.dataset.name),v=prompt(`Rename ${kind}:`,oldName);if(v!==null)renameMasterItem(kind,oldName,v)});document.querySelectorAll('.ownerSelect').forEach(x=>x.onchange=e=>{state.fieldOwners[e.target.dataset.field]=e.target.value;save();renderAll()});document.getElementById('addOwner').onclick=()=>{const v=document.getElementById('newOwner').value.trim();if(!v)return;if(!(state.ownerNames||[]).includes(v))state.ownerNames.push(v);save();renderAll();toast(`Added owner/entity: <b>${esc(v)}</b>`)};document.getElementById('seedDemo').onclick=()=>{if(confirm('Replace current prototype data with a sample scenario?'))seedDemo()};document.getElementById('clearPending').onclick=()=>{if(confirm('Clear only unfinished test loads from the scale/dumping queues? Completed totals and settings will stay.')){state.pending=[];save();renderAll();toast('Pending test loads cleared.')}};document.getElementById('resetAll').onclick=()=>{if(confirm('Reset all prototype data?')){state=defaultState();save();renderAll();toast('Prototype reset.')}}}
function renderAll(){renderNav();NAV.forEach(([id])=>document.getElementById(id+'Screen').classList.toggle('active',state.activeScreen===id));renderScale();renderBin();renderHMC();renderDumping();renderDryer();renderCombine();renderLoadout();renderReports();renderSettings();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.activeScreen))}
window.addEventListener('offline',handleOffline);window.addEventListener('online',handleOnline);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(()=>updateNetworkUI()).catch(e=>console.warn('Offline cache registration failed',e)))}
setInterval(()=>{document.getElementById('clockText').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})},1000);document.getElementById('clockText').textContent=new Date().toLocaleString();renderAll();updateNetworkUI();
})();
