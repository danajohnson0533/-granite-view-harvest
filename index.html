<style>

kground:var(--good)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{border-bottom:1px solid #e6e2dd;padding:9px 8px;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#555;background:#faf9f7}.modalBackdrop{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modalBackdrop.show{display:flex}.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0005}.modalHead{background:var(--maroon);color:#fff;padding:13px 16px;font-weight:850;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:16px}.toast{position:fixed;right:16px;bottom:16px;z-index:150;background:#1b1f23;color:white;border-radius:12px;padding:14px 16px;max-width:360px;box-shadow:0 12px 30px #0004;display:none}.toast.show{display:block}.notice{border:1px solid #d7c18b;background:#fff8e7;border-radius:10px;padding:10px 12px}.notice.info{border-color:#bcd0e8;background:#f1f7fd}.notice.good{border-color:#b8ddc0;background:#f0faf2}.recentChange{border:2px solid var(--gold);background:#fffaf0;border-radius:12px;padding:12px;margin-bottom:12px}.mobileForm .cardBody{display:grid;gap:12px}.photoPreview{max-width:100%;border:1px solid var(--line);border-radius:10px;display:none}.footerNote{font-size:11px;color:#777;margin-top:10px}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .btn.selected{background:var(--maroon);color:#fff;border-color:var(--maroon)}.printOnly{display:none}.statusDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22a447;margin-right:5px}.emptyState{padding:30px;text-align:center;color:#777}.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#eee}.right{margin-left:auto}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:62px;height:auto;z-index:19;display:flex;overflow:auto;padding:6px}.navbtn{white-space:nowrap;width:auto;flex:0 0 auto;padding:10px 12px}.content{padding:12px}.g2,.g3,.g4,.scalePanel{grid-template-columns:1fr}.weightStack{grid-template-columns:1fr 1fr 1fr}.destButtons{grid-template-columns:1fr}.topMeta{display:none}.brandText{font-size:14px}.screenTitle{font-size:22px}}
@media(max-width:560px){.sidebar{top:58px}.topbar{padding:9px}.content{padding:8px}.cardBody{padding:11px}.weightStack{grid-template-columns:1fr}.bigWeight{font-size:38px}.truckName{font-size:28px}.moistureDisplay{font-size:42px}.keypad{max-width:none}.btn.big{width:100%}.mobileHide{display:none}.g2.mobileOne,.g3.mobileOne{grid-template-columns:1fr}.topbar{min-height:58px}.layout{min-height:calc(100vh - 58px)}}
@media print{body{background:#fff}.topbar,.sidebar,.noPrint,.toast,.modalBackdrop{display:none!important}.layout{display:block}.content{padding:0}.screen{display:none!important}#reportsScreen{display:block!important}.screenTitle,.subtitle,.reportControls,.fieldDetail{display:none!important}.printOnly{display:block}.card{border:0}.table{min-width:0}.table th,.table td{font-size:10pt;padding:6px}.tableWrap{overflow:visible}}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandMark">🌽</div><div><div class="brandText">GRANITE VIEW FARMS</div><div class="brandSub">HARVEST SYSTEM • PROTOTYPE v2</div></div></div>
    <div class="topMeta"><span class="statusDot"></span>Prototype Online<br><span id="clockText"></span></div>
  </header>
  <div class="layout">
    <nav class="sidebar noPrint" id="nav"></nav>
    <main class="content">
      <section class="screen active" id="scaleScreen"></section>
      <section class="screen" id="dumpingScreen">
        <div id="dumpingSelector"></div>
        <div id="binWrap"><div id="binScreen"></div></div>
        <div id="hmcWrap"><div id="hmcScreen"></div></div>
      </section>
      <section class="screen" id="dryerScreen"></section>
      <section class="screen" id="combineScreen"></section>
      <section class="screen" id="loadoutScreen"></section>
      <section class="screen" id="reportsScreen"></section>
      <section class="screen" id="settingsScreen"></section>
    </main>
  </div>
</div>
<div class="modalBackdrop" id="modalBackdrop"><div class="modal"><div class="modalHead"><span id="modalTitle">Modal</span><button class="btn" id="modalClose">✕</button></div><div class="modalBody" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='gvfHarvestPrototypeV2';
const CAPACITY=65000;
const TRUCKS=['Titan','Outlaw','International','OAP'];
const DRIVERS=['Dana','Mike','Keenan','Jacob','Martin','Morgan','Nancy'];
const FIELDS=['Field 1','Field 2',"Adler's — Field 3",'Field 4','Field 5','Field 7','Field 8','Stragies — Field 9',"Gar's — Field 11",'Field 10',"Betty's — Field 15","Cussy's — Field 20",'Field 23','North Delno — Field 24','South Delno — Field 25','Field 26','Field 27','Field 28','Field 29','Field 30','Field 31','Field 32','Field 33','Field 34',"Dana's — Field 36",'Cold Springs #1','Cold Springs #2','Cold Springs #3','Cold Springs #4',"Darren's Home","Deb's Alfalfa","Deb's Corn",'Germantown 3','Germantown 4','Germantown 6 South','Germantown 6 North','Germantown 9','Germantown 30','Germantown 31 North','Germantown 31 South','Lura 12 North','Lura 12 South'];
const DESTINATIONS=['POET – Big Stone','WesCon – Twin Brooks','Feed – Feedlot','Other'];
const DEFAULT_OWNERS=['Granite View Farms','Dana Johnson'];
const DEFAULT_FIELD_OWNERS=Object.fromEntries(FIELDS.map(f=>[f,f.startsWith('Lura 12')?'Dana Johnson':'Granite View Farms']));
const NAV=[['scale','⚖️','Scale / Tare'],['dumping','🌽','Dumping Pits'],['dryer','🏭','Dryer / Bins'],['combine','🚜','Combine View'],['loadout','🚛','Elevator Delivery'],['reports','📊','Fields / Reports'],['settings','⚙️','Settings / Demo']];
function defaultState(){
  const yesterday=new Date(Date.now()-86400000).toISOString();
  return {
    version:1,activeScreen:'scale',activeField:'Field 1',harvestType:'Dry Corn',dumpingPit:'Dry Corn Pit',
    truckDrivers:{Titan:'Dana',Outlaw:'Mike',International:'Keenan',OAP:'Jacob'},
    lastKnownTares:{Titan:{weight:25620,time:yesterday},Outlaw:{weight:26100,time:yesterday},International:{weight:28000,time:yesterday},OAP:{weight:24800,time:yesterday}},
    todayTares:{},tareHistory:[],scale:{truck:'Titan',weight:0,light:'red',locked:false,lastEvent:null},
    pending:[],completed:[],nextLoadId:1,
    fieldTransition:null,
    bins:{wet:{wetBu:0,dry15Bu:0,moistureMass:0},dry1:0,dry2:0},
    dryer:{running:false,bph:950,destination:'Dry Bin #1',processedWetBu:0},
    hmc:{wetPounds:0,wetBu:0,moistureMassLb:0},
    acres:{},loadouts:[],openLoadouts:[],photoData:null,
    ownerNames:[...DEFAULT_OWNERS],fieldOwners:{...DEFAULT_FIELD_OWNERS},
    deviceControl:{binShack:'primary',hmcPit:'primary'},
    recentNotification:null
  };
}
let state=loadState();
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);const st=raw?Object.assign(defaultState(),JSON.parse(raw)):defaultState();if(st.activeScreen==='bin'){st.activeScreen='dumping';st.dumpingPit='Dry Corn Pit'}if(st.activeScreen==='hmc'){st.activeScreen='dumping';st.dumpingPit='High Moisture Corn Pit'}return st}catch(e){return defaultState()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function nowISO(){return new Date().toISOString()}
function fmtTime(iso){if(!iso)return '—';return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}
function n(v,d=0){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function wetBushels(lb){return Number(lb||0)/56}
function shrinkFactor(m){m=Number(m); if(!isFinite(m)||m<=15)return 1; return Math.max(0,1-0.012*(m-15))}
function dry15From(lb,m){return wetBushels(lb)*shrinkFactor(m)}
function avgWetMoist(){const w=state.bins.wet.wetBu;return w>0?state.bins.wet.moistureMass/w:0}
function wetPercent(){return Math.min(100,(state.bins.wet.wetBu/CAPACITY)*100)}
function pct(v){return Math.min(100,(Number(v||0)/CAPACITY)*100)}
function todayKey(){return new Date().toLocaleDateString()}
function isToday(iso){return iso && new Date(iso).toLocaleDateString()===todayKey()}
function options(arr,selected){return arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function toast(msg,ms=2800){const el=document.getElementById('toast');el.innerHTML=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms)}
function setScreen(id){state.activeScreen=id;save();renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function navHTML(){return NAV.map(([id,ic,label])=>`<button class="navbtn ${state.activeScreen===id?'active':''}" data-nav="${id}"><span>${ic}</span>${label}</button>`).join('')}
function renderNav(){document.getElementById('nav').innerHTML=navHTML();document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setScreen(b.dataset.nav)))}
function showModal(title,html,onReady){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show');if(onReady)onReady()}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalClose').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function currentTare(truck){return state.todayTares[truck]||null}
function lastTare(truck){return state.todayTares[truck]||state.lastKnownTares[truck]||null}
function resolveWaitingTares(truck,newTare){let count=0,finalized=0;state.pending.forEach(l=>{if(l.truck===truck && (l.status==='waiting_tare'||l.status==='dumped_waiting_tare')){const wasDumped=l.status==='dumped_waiting_tare';l.tare=newTare.weight;l.net=Math.max(0,l.gross-newTare.weight);if(l.pendingSplit){const p=Number(l.pendingSplit.pounds||0),f1=l.pendingSplit.field1,f2=l.pendingSplit.field2;if(p>0&&p<l.net&&f1!==f2){l.fieldPortions=[{field:f1,pounds:p},{field:f2,pounds:l.net-p}];l.fieldMode='split';l.field=`${f1} / ${f2}`;delete l.pendingSplit}else{l.splitNeedsReview=true}}if(wasDumped&&!l.splitNeedsReview){if(!l.fieldPortions)l.fieldPortions=[{field:l.field,pounds:l.net}];l.status='completed';l.completedTime=l.dumpedTime||nowISO();applyCompletedLoad(l,false);state.completed.push(l);finalized++}else if(wasDumped&&l.splitNeedsReview){l.status='awaiting_moisture';}else l.status='awaiting_moisture';count++}});state.pending=state.pending.filter(l=>l.status!=='completed');return {count,finalized}}
function saveTare(){const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight first.');return}const rec={weight,time:nowISO()};state.todayTares[truck]=rec;state.lastKnownTares[truck]=rec;state.tareHistory.push({truck,weight,time:rec.time});const resolved=resolveWaitingTares(truck,rec);state.scale.light='green';state.scale.locked=true;state.scale.lastEvent=`Saved ${truck} tare at ${n(weight)} lb`;save();renderAll();toast(`✅ ${truck} tare saved at <b>${n(weight)} lb</b>${resolved.count?` • ${resolved.count} waiting load${resolved.count>1?'s':''} resolved${resolved.finalized?` (${resolved.finalized} already-dumped load${resolved.finalized>1?'s':''} finalized)`:''}`:''}`)}
function captureScale(){if(state.scale.locked){toast('Scale is locked until the truck leaves and the scale returns to zero.');return}const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight.');return}const tToday=currentTare(truck), tLast=lastTare(truck);const ref=tToday||tLast; if(!ref){showUnknownScaleModal();return}
  const diff=weight-ref.weight;
  if(diff<=5000){showModal('LIKELY EMPTY TRUCK',`<div class="notice"><b>${esc(truck)}</b> is only <b>${n(Math.max(0,diff))} lb</b> above its last known tare.<br><br>Current scale weight: <b>${n(weight)} lb</b><br><br>Save this as today's empty weight?</div><div class="row wrap" style="margin-top:14px"><button class="btn good big" id="confirmEmpty">I'M EMPTY — SAVE TARE</button><button class="btn" id="treatLoaded">NO — TREAT AS LOADED</button></div>`,()=>{document.getElementById('confirmEmpty').onclick=()=>{closeModal();saveTare()};document.getElementById('treatLoaded').onclick=()=>{closeModal();createLoadedScaleEvent()}})}else createLoadedScaleEvent();
}
function showUnknownScaleModal(){showModal('NO TARE REFERENCE',`<p>There is no tare history for <b>${esc(state.scale.truck)}</b>.</p><div class="row wrap"><button class="btn good big" id="unknownEmpty">I'M EMPTY — SAVE TARE</button><button class="btn primary big" id="unknownLoaded">THIS IS A LOADED WEIGHT</button></div>`,()=>{document.getElementById('unknownEmpty').onclick=()=>{closeModal();saveTare()};document.getElementById('unknownLoaded').onclick=()=>{closeModal();createLoadedScaleEvent()}})}
function createLoadedScaleEvent(){const truck=state.scale.truck, gross=Number(state.scale.weight), tare=currentTare(truck);const load={id:state.nextLoadId++,truck,driver:state.truckDrivers[truck]||DRIVERS[0],field:state.activeField,harvestType:state.harvestType,gross,tare:tare?tare.weight:null,net:tare?Math.max(0,gross-tare.weight):null,time:nowISO(),status:tare?'awaiting_moisture':'waiting_tare',moisture:0,destination:null,fieldPortions:null,fieldMode:'default'};state.pending.push(load);state.scale.light='green';state.scale.locked=true;state.scale.lastEvent=`Captured loaded ${truck} at ${n(gross)} lb`;save();renderAll();toast(tare?`✅ ${truck} loaded weight captured. Sent to Dumping Pits — ${load.harvestType==='High Moisture Corn'?'High Moisture Corn Pit':'Dry Corn Pit'} queue.`:`⚠️ ${truck} captured but is waiting for today's tare.`)}
function scaleLeft(){state.scale.weight=0;state.scale.light='red';state.scale.locked=false;save();renderAll();toast('Scale reset to zero. Ready for next truck.')}
function changeActiveField(newField){if(newField===state.activeField)return;const old=state.activeField;state.activeField=newField;state.fieldTransition={from:old,to:newField,confirmed:0,active:true,started:nowISO()};save();renderAll();toast(`Active field changed: <b>${esc(old)}</b> → <b>${esc(newField)}</b>. Recent-field safeguard is active.`)}
function changeHarvestType(newType){state.harvestType=newType;save();renderAll();toast(`Harvest type changed to <b>${esc(newType)}</b>.`)}
function pendingFor(type){return state.pending.filter(l=>l.harvestType===type && (l.status==='awaiting_moisture'||l.status==='waiting_tare')).sort((a,b)=>new Date(a.time)-new Date(b.time))}
function waitingTareCount(){return state.pending.filter(l=>l.status==='waiting_tare').length}
function binStatusHTML(){const wet=state.bins.wet.wetBu, d1=state.bins.dry1,d2=state.bins.dry2;return `<div class="card"><div class="cardHead">BIN STATUS / CALCULATED INVENTORY</div><div class="cardBody" style="padding:0"><div class="binCard"><div><b>Wet Bin</b><div class="small muted">${n(wet,0)} wet bu • ${n(avgWetMoist(),1)}% avg • ${n(state.bins.wet.dry15Bu,0)} bu @15%</div><div class="progress"><span style="width:${wetPercent()}%"></span></div></div><b>${n(wetPercent(),0)}%</b></div><div class="binCard"><div><b>Dry Bin #1</b><div class="small muted">${n(d1,0)} bu @15%</div><div class="progress"><span style="width:${pct(d1)}%"></span></div></div><b>${n(pct(d1),0)}%</b></div><div class="binCard"><div><b>Dry Bin #2</b><div class="small muted">${n(d2,0)} bu @15%</div><div class="progress"><span style="width:${pct(d2)}%"></span></div></div><b>${n(pct(d2),0)}%</b></div></div></div>`}
function renderScale(){const t=state.scale.truck, wt=Number(state.scale.weight), tt=currentTare(t), lt=lastTare(t), net=tt&&wt>0?wt-tt.weight:null;const queue=state.pending.slice().sort((a,b)=>new Date(a.time)-new Date(b.time));document.getElementById('scaleScreen').innerHTML=`
<h1 class="screenTitle">Scale / Tare</h1><p class="subtitle">Prototype: truck selection stands in for RFID; “Capture Stable Weight” stands in for automatic WI-127 capture.</p>
<div class="grid g3">
<div class="card"><div class="cardHead">SCALE TRAFFIC LIGHT</div><div class="cardBody"><div class="row"><div class="light ${state.scale.light}"></div><div><div class="lightLabel">${state.scale.light==='green'?'GREEN — WEIGHT SAVED':'RED — WAIT'}</div><div class="small muted">${state.scale.locked?'Locked until scale returns to zero':'Ready for a truck'}</div></div></div><div class="sectionLine"></div><button class="btn" id="scaleLeftBtn">Simulate Truck Left / Scale Zero</button></div></div>
<div class="card"><div class="cardHead">CURRENT TRUCK / SCALE</div><div class="cardBody"><div class="field"><label>Truck (RFID simulation)</label><select id="scaleTruck">${options(TRUCKS,t)}</select></div><div class="field" style="margin-top:10px"><label>Stable WI-127 Weight (lb)</label><input id="scaleWeight" type="number" inputmode="numeric" value="${wt||''}" placeholder="e.g. 78420"></div><div class="row wrap" style="margin-top:12px"><button class="btn primary big" id="captureWeight" ${state.scale.locked?'disabled':''}>Capture Stable Weight</button><button class="btn good" id="emptyBtn" ${state.scale.locked?'disabled':''}>I'M EMPTY — SAVE TARE</button></div></div></div>
<div class="card"><div class="cardHead">${esc(t)} TARE STATUS</div><div class="cardBody"><div class="small muted">Today's tare</div><div class="kpi">${tt?n(tt.weight)+' lb':'Not saved'}</div><div class="small muted">Last known: ${lt?n(lt.weight)+' lb • '+fmtDate(lt.time):'none'}</div>${tt?`<div class="sectionLine"></div><div>At current scale weight:</div><div class="kpi" style="color:${net!==null&&net>5000?'var(--good)':'var(--ink)'}">${net!==null?n(net)+' lb net':'—'}</div>`:''}</div></div>
</div>
<div class="grid g2" style="margin-top:14px">
<div class="card"><div class="cardHead">ACTIVE HARVEST DEFAULTS</div><div class="cardBody"><div class="grid g2"><div class="field"><label>Active Field</label><select id="activeFieldScale">${options(FIELDS,state.activeField)}</select></div><div class="field"><label>Harvest Type</label><select id="harvestTypeScale"><option ${state.harvestType==='Dry Corn'?'selected':''}>Dry Corn</option><option ${state.harvestType==='High Moisture Corn'?'selected':''}>High Moisture Corn</option></select></div></div><p class="footerNote">Normal loaded trucks inherit these defaults. Final field/destination can be corrected at Dumping Pits.</p></div></div>
<div class="card"><div class="cardHead">TRUCK / DRIVER ASSIGNMENT</div><div class="cardBody"><div class="grid g2">${TRUCKS.map(x=>`<div class="field"><label>${esc(x)}</label><select class="driverAssign" data-truck="${esc(x)}">${options(DRIVERS,state.truckDrivers[x])}</select></div>`).join('')}</div></div></div>
</div>
<div class="card" style="margin-top:14px"><div class="cardHead">LOAD QUEUE <span class="right">${queue.length} waiting${waitingTareCount()?` • ${waitingTareCount()} need tare`:''}</span></div><div class="cardBody">${queue.length?queue.map(l=>`<div class="queueItem ${l.status==='waiting_tare'?'current':''}"><div><div class="qTruck">#${l.id} ${esc(l.truck)} • ${esc(l.driver)}</div><div class="small">${esc(l.field)} • ${esc(l.harvestType)} • ${fmtTime(l.time)}</div></div><div style="text-align:right"><b>${n(l.gross)} lb gross</b><div class="small ${l.status==='waiting_tare'?'muted':''}">${l.status==='waiting_tare'?'WAITING FOR TARE':n(l.net)+' lb net'}</div></div></div>`).join(''):`<div class="emptyState">No loads waiting.</div>`}</div></div>`;
  document.getElementById('scaleTruck').onchange=e=>{state.scale.truck=e.target.value;save();renderAll()};
  document.getElementById('scaleWeight').oninput=e=>{state.scale.weight=Number(e.target.value||0);save()};
  document.getElementById('captureWeight').onclick=()=>{state.scale.weight=Number(document.getElementById('scaleWeight').value||0);captureScale()};
  document.getElementById('emptyBtn').onclick=()=>{state.scale.weight=Number(document.getElementById('scaleWeight').value||0);if(state.scale.weight<=0){toast('Enter the stable empty weight first.');return}showModal("I'M EMPTY — SAVE TARE",`<p>Save <b>${n(state.scale.weight)} lb</b> as <b>${esc(state.scale.truck)}</b>'s new empty weight?</p><div class="row wrap"><button id="tareYes" class="btn good big">YES — SAVE TARE</button><button id="tareNo" class="btn">Cancel</button></div>`,()=>{document.getElementById('tareYes').onclick=()=>{closeModal();saveTare()};document.getElementById('tareNo').onclick=closeModal})};
  document.getElementById('scaleLeftBtn').onclick=scaleLeft;
  document.getElementById('activeFieldScale').onchange=e=>changeActiveField(e.target.value);
  document.getElementById('harvestTypeScale').onchange=e=>changeHarvestType(e.target.value);
  document.querySelectorAll('.driverAssign').forEach(el=>el.onchange=e=>{state.truckDrivers[e.target.dataset.truck]=e.target.value;save();renderAll()});
}
function moisturePadHTML(prefix){return `<div class="moistureDisplay" id="${prefix}MoistDisplay">0.0%</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-key="${k}" class="${prefix}Key">${k}</button>`).join('')}</div><div class="small muted" style="margin-top:8px">Valid range: 12.0%–40.0%. Every new load starts at 0.</div>`}
function attachKeypad(prefix,onChange){let value='';const display=document.getElementById(prefix+'MoistDisplay');function refresh(){display.textContent=(value||'0')+(value&&value.includes('.')?'':'')+'%';onChange(Number(value||0))}document.querySelectorAll('.'+prefix+'Key').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='⌫')value=value.slice(0,-1);else if(k==='.'&&value.includes('.')){}else if(value.length<5)value+=k;refresh()});refresh()}
function loadTopHTML(load){const tarePending=load.tare==null||load.net==null;return `<div class="card"><div class="cardHead">CURRENT TRUCK — READY TO DUMP${tarePending?' • TARE PENDING':''}</div><div class="cardBody">${tarePending?`<div class="notice warn" style="margin-bottom:10px"><b>⚠️ NO CURRENT TARE YET — DUMPING IS STILL ALLOWED.</b><br>Gross weight is safely saved. Enter moisture and destination normally. This load will remain waiting for tare, then its net weight and inventory will finalize automatically when ${esc(load.truck)} gets an empty weight.</div>`:''}<div class="grid g2"><div><div class="truckName">${esc(load.truck)}</div><div><b>Driver:</b> ${esc(load.driver)} <button class="btn small editDriverBtn">Edit Driver</button></div><div style="margin-top:7px"><b>Field:</b> ${esc(load.field)}</div><div style="margin-top:7px"><b>Harvest Type:</b> ${esc(load.harvestType)}</div></div><div class="weightStack"><div class="weightBox"><span class="small muted">Gross</span><b>${n(load.gross)} lb</b></div><div class="weightBox"><span class="small muted">Tare</span><b>${tarePending?'PENDING':n(load.tare)+' lb'}</b></div><div class="weightBox net"><span class="small muted">Net</span><b>${tarePending?'PENDING':n(load.net)+' lb'}</b></div></div></div><div class="small muted" style="margin-top:8px">Weighed ${fmtTime(load.time)} • Load #${load.id}</div></div></div>`}
function editDriverModal(load){showModal('EDIT DRIVER',`<div class="field"><label>Driver for this load</label><select id="modalDriver">${options(DRIVERS,load.driver)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveDriver">Save Driver</button></div>`,()=>document.getElementById('saveDriver').onclick=()=>{load.driver=document.getElementById('modalDriver').value;state.truckDrivers[load.truck]=load.driver;save();closeModal();renderAll()})}
function differentFieldModal(load){showModal('DIFFERENT FIELD FOR THIS LOAD',`<p>This changes only this load. It does <b>not</b> change the active field.</p><div class="field"><label>Field</label><select id="differentField">${options(FIELDS,load.field)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveDifferentField">Use This Field</button></div>`,()=>document.getElementById('saveDifferentField').onclick=()=>{load.field=document.getElementById('differentField').value;load.fieldMode='different';save();closeModal();renderAll()})}
function activeFieldModal(load){showModal('CHANGE ACTIVE FIELD',`<p>The selected field becomes the default for future loads. A temporary recent-field safeguard will start.</p><div class="field"><label>New active field</label><select id="newActiveField">${options(FIELDS,state.activeField)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveActiveField">Change Active Field</button></div>`,()=>document.getElementById('saveActiveField').onclick=()=>{const f=document.getElementById('newActiveField').value;changeActiveField(f);load.field=f;load.fieldMode='default';closeModal();renderAll()})}
function splitLoadModal(load){let portion=0;const tarePending=load.net==null;showModal('SPLIT LOAD',`<div class="notice info">${tarePending?'Official net weight is <b>pending tare</b>. Enter the known first-field/cart pounds now; the official remainder will calculate automatically after the empty tare is recorded.':`Official net weight: <b>${n(load.net)} lb</b>`}</div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Portion 1 weight (lb)</label><input id="splitWeight" type="number" inputmode="numeric" placeholder="e.g. 28000"></div><div class="field"><label>Portion 1 field</label><select id="splitField1">${options(FIELDS,load.field)}</select></div><div class="field"><label>Remainder</label><input id="splitRemainder" disabled value="${tarePending?'CALCULATES AFTER TARE':n(load.net)}"></div><div class="field"><label>Remainder field</label><select id="splitField2">${options(FIELDS,state.activeField)}</select></div></div><div id="splitMsg" class="small muted" style="margin-top:10px"></div><button class="btn primary big" id="saveSplit" style="margin-top:12px">Save Split</button>`,()=>{const sw=document.getElementById('splitWeight'),rem=document.getElementById('splitRemainder'),msg=document.getElementById('splitMsg');sw.oninput=()=>{portion=Number(sw.value||0);if(!tarePending)rem.value=n(Math.max(0,load.net-portion));msg.textContent=tarePending?(portion>0?'Known portion saved; remainder will use the official net after tare.':''):(portion>0&&portion<load.net?'Total will equal official truck net.':'')};document.getElementById('saveSplit').onclick=()=>{const p=Number(sw.value||0),f1=document.getElementById('splitField1').value,f2=document.getElementById('splitField2').value;if(!(p>0)){msg.textContent='Enter the known first-field portion.';return}if(!tarePending&&!(p<load.net)){msg.textContent='Enter a portion less than the official net weight.';return}if(f1===f2){msg.textContent='Select two different fields.';return}if(tarePending){load.pendingSplit={pounds:p,field1:f1,field2:f2};load.fieldMode='split';load.field=`${f1} / ${f2}`;}else{load.fieldPortions=[{field:f1,pounds:p},{field:f2,pounds:load.net-p}];load.fieldMode='split';load.field=`${f1} / ${f2}`;}save();closeModal();renderAll()}})}
function recentFieldPromptHTML(){if(!state.fieldTransition||!state.fieldTransition.active)return '';return `<div class="recentChange"><b>⚠️ FIELD CHANGED RECENTLY</b><div style="margin-top:5px">Active field is <b>${esc(state.activeField)}</b>. Confirm the field for this load before completing it.</div></div>`}
function ensureRecentFieldChoice(load,after){if(!state.fieldTransition||!state.fieldTransition.active||load.fieldMode==='different'||load.fieldMode==='split'||load.recentConfirmed){after();return}showModal('FIELD CHANGED RECENTLY',`<div class="notice"><b>Active field: ${esc(state.activeField)}</b><br>Is this load from ${esc(state.activeField)}?</div><div class="grid g3" style="margin-top:14px"><button class="btn good big" id="fieldYes">YES — ${esc(state.activeField)}</button><button class="btn big" id="fieldDifferent">DIFFERENT FIELD</button><button class="btn big" id="fieldSplit">SPLIT LOAD</button></div><p class="small muted">This safeguard disappears automatically after five fully confirmed loads from the new field. No countdown is shown.</p>`,()=>{document.getElementById('fieldYes').onclick=()=>{load.field=state.activeField;load.recentConfirmed=true;closeModal();after()};document.getElementById('fieldDifferent').onclick=()=>{closeModal();differentFieldModal(load)};document.getElementById('fieldSplit').onclick=()=>{closeModal();splitLoadModal(load)}})}
function addToFieldStatsNoop(){}
function applyCompletedLoad(load,notify=true){const m=load.moisture,lb=load.net,wet=wetBushels(lb),dry15=dry15From(lb,m);if(load.harvestType==='Dry Corn'){
    if(load.destination==='Wet Bin'){state.bins.wet.wetBu+=wet;state.bins.wet.dry15Bu+=dry15;state.bins.wet.moistureMass+=wet*m}
    else if(load.destination==='Dry Bin #1') state.bins.dry1+=dry15;
    else if(load.destination==='Dry Bin #2') state.bins.dry2+=dry15;
  }else{state.hmc.wetPounds+=lb;state.hmc.wetBu+=wet;state.hmc.moistureMassLb+=lb*m}
  if(state.fieldTransition&&state.fieldTransition.active&&load.recentConfirmed&&load.fieldMode!=='split'&&load.field===state.activeField){state.fieldTransition.confirmed++;if(state.fieldTransition.confirmed>=5)state.fieldTransition.active=false}
  if(notify)state.recentNotification={truck:load.truck,moisture:m,field:load.field,time:nowISO()};
}
function completePending(load,moisture,destination){if(!(moisture>=12&&moisture<=40)){toast('Enter a valid moisture between 12.0% and 40.0%.');return}load.moisture=moisture;load.destination=destination;ensureRecentFieldChoice(load,()=>{if(load.net==null||load.tare==null){load.status='dumped_waiting_tare';load.dumpedTime=nowISO();state.recentNotification={truck:load.truck,moisture,field:load.field,time:load.dumpedTime,net:null,waitingTare:true};save();renderAll();toast(`🔔 ${esc(load.truck)} IS DUMPING — ${n(moisture,1)}% • ${esc(load.field)}<br>⚠️ Gross is saved; this load will finalize automatically after today's empty tare.`,5200);return}state.pending=state.pending.filter(x=>x.id!==load.id);load.status='completed';load.completedTime=nowISO();if(!load.fieldPortions)load.fieldPortions=[{field:load.field,pounds:load.net}];applyCompletedLoad(load);state.completed.push(load);save();renderAll();toast(`🔔 Combine notification: <b>${esc(load.truck)} IS DUMPING — ${n(moisture,1)}%</b> • ${esc(load.field)}`,4200)})}
function recentLoadsHTML(type,limit=5){const rows=state.completed.filter(l=>!type||l.harvestType===type).slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).slice(0,limit);return rows.length?rows.map(l=>`<div class="queueItem"><div><b>${esc(l.truck)}</b> • ${n(l.moisture,1)}%<div class="small muted">${esc(l.field)} • ${fmtTime(l.completedTime)}</div></div><div><b>${n(l.net)} lb</b></div></div>`).join(''):`<div class="emptyState">No completed loads yet.</div>`}
function renderDumping(){
  if(!state.dumpingPit)state.dumpingPit='Dry Corn Pit';
  const el=document.getElementById('dumpingSelector');
  el.innerHTML=`<h1 class="screenTitle">Dumping Pits</h1><p class="subtitle">One page for both dumping locations. Choose the pit this device is working at; the Dry Corn and High Moisture Corn queues stay separate.</p><div class="card"><div class="cardBody"><div class="seg"><button class="btn ${state.dumpingPit==='Dry Corn Pit'?'selected':''}" data-pit="Dry Corn Pit">🏠 DRY CORN PIT</button><button class="btn ${state.dumpingPit==='High Moisture Corn Pit'?'selected':''}" data-pit="High Moisture Corn Pit">🌽 HIGH MOISTURE CORN PIT</button></div><div class="footerNote">Prototype: this browser remembers the selected pit. Production: the station preference is device-specific, so changing pits on a phone will not switch the physical pit iPad.</div></div></div>`;
  document.getElementById('binWrap').classList.toggle('hidden',state.dumpingPit!=='Dry Corn Pit');
  document.getElementById('hmcWrap').classList.toggle('hidden',state.dumpingPit!=='High Moisture Corn Pit');
  el.querySelectorAll('[data-pit]').forEach(b=>b.onclick=()=>{state.dumpingPit=b.dataset.pit;save();renderAll()});
}
function renderBin(){const list=pendingFor('Dry Corn'),load=list[0];document.getElementById('binScreen').innerHTML=`<h2 style="color:var(--maroon);margin:12px 0 4px">Dry Corn Pit</h2><p class="subtitle">Oldest Dry Corn scale load appears automatically. Enter moisture, confirm routing, and complete the load.</p><div class="notice good" style="margin-bottom:12px"><b>🟢 PRIMARY DRY CORN PIT CONTROL — THIS STATION</b><div class="small">Production safeguard: other phones/computers can view this same queue, but open in View Only. One station edits a load at a time; server-side completion prevents duplicate loads.</div></div>${load?`${recentFieldPromptHTML()}<div class="grid g2">${loadTopHTML(load)}${binStatusHTML()}</div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="cardHead">1. ENTER MOISTURE</div><div class="cardBody">${moisturePadHTML('bin')}</div></div><div class="card"><div class="cardHead">2. SELECT DESTINATION</div><div class="cardBody"><div class="destButtons"><button class="dest selected" data-dest="Wet Bin">Wet Bin</button><button class="dest" data-dest="Dry Bin #1">Dry Bin #1</button><button class="dest" data-dest="Dry Bin #2">Dry Bin #2</button></div><div class="notice" style="margin-top:12px">The physical routing choice wins. The app does not automatically route corn based only on moisture.</div></div></div><div class="card"><div class="cardHead">3. FIELD / LOAD OPTIONS</div><div class="cardBody"><div class="grid"><button class="btn" id="changeActiveFieldBin">Change Active Field</button><button class="btn" id="differentFieldBin">Different Field — This Load Only</button><button class="btn" id="splitBin">Split Load</button></div></div></div></div><div class="row wrap" style="margin-top:14px"><button class="btn good big" id="completeBin" disabled>COMPLETE LOAD</button><span class="small muted">Completing updates field totals, bin inventory, and Combine View.</span></div>`:`<div class="grid g2">${binStatusHTML()}<div class="card"><div class="cardHead">NEXT TRUCK</div><div class="emptyState">No Dry Corn loads are ready for moisture.<br><br>Create a loaded scale event first.</div></div></div>`}`;
  if(!load)return;let moisture=0,dest='Wet Bin';attachKeypad('bin',v=>{moisture=v;const btn=document.getElementById('completeBin');btn.disabled=!(v>=12&&v<=40)});document.querySelectorAll('#binScreen [data-dest]').forEach(b=>b.onclick=()=>{dest=b.dataset.dest;document.querySelectorAll('#binScreen [data-dest]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelector('#binScreen .editDriverBtn').onclick=()=>editDriverModal(load);document.getElementById('changeActiveFieldBin').onclick=()=>activeFieldModal(load);document.getElementById('differentFieldBin').onclick=()=>differentFieldModal(load);document.getElementById('splitBin').onclick=()=>splitLoadModal(load);document.getElementById('completeBin').onclick=()=>completePending(load,moisture,dest)
}
function renderHMC(){const list=pendingFor('High Moisture Corn'),load=list[0];const avg=state.hmc.wetPounds?state.hmc.moistureMassLb/state.hmc.wetPounds:0;document.getElementById('hmcScreen').innerHTML=`<h2 style="color:var(--maroon);margin:12px 0 4px">High Moisture Corn Pit</h2><p class="subtitle">Cellular iPad workflow. Destination is always the High Moisture Corn Pile.</p><div class="notice good" style="margin-bottom:12px"><b>🟢 PRIMARY HIGH MOISTURE CORN PIT CONTROL — THIS STATION</b><div class="small">Production safeguard: other phones/computers can view this same queue, but open in View Only. Control is separate from the Dry Corn Pit.</div></div>${load?`${recentFieldPromptHTML()}<div class="grid g2">${loadTopHTML(load)}<div class="card"><div class="cardHead">HMC HARVEST TOTAL</div><div class="cardBody"><div class="grid g2"><div><div class="small muted">Wet Pounds</div><div class="kpi">${n(state.hmc.wetPounds)} lb</div></div><div><div class="small muted">Wet Bushels</div><div class="kpi">${n(state.hmc.wetBu,0)} bu</div></div><div><div class="small muted">Average Moisture</div><div class="kpi">${n(avg,1)}%</div></div><div><div class="small muted">Loads</div><div class="kpi">${state.completed.filter(l=>l.harvestType==='High Moisture Corn').length}</div></div></div></div></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="cardHead">1. ENTER MOISTURE</div><div class="cardBody">${moisturePadHTML('hmc')}</div></div><div class="card"><div class="cardHead">2. DESTINATION (AUTOMATIC)</div><div class="cardBody" style="text-align:center"><div style="font-size:52px">🌽</div><h2 style="color:var(--maroon)">HIGH MOISTURE CORN PILE</h2><div class="small muted">Harvest production tracking only. Feed-out inventory remains in Performance Beef.</div></div></div><div class="card"><div class="cardHead">3. FIELD / LOAD OPTIONS</div><div class="cardBody"><div class="grid"><button class="btn" id="changeActiveFieldHmc">Change Active Field</button><button class="btn" id="differentFieldHmc">Different Field — This Load Only</button><button class="btn" id="splitHmc">Split Load</button></div></div></div></div><div class="row wrap" style="margin-top:14px"><button class="btn good big" id="completeHmc" disabled>COMPLETE LOAD</button></div><div class="card" style="margin-top:14px"><div class="cardHead">RECENT HMC LOADS</div><div class="cardBody">${recentLoadsHTML('High Moisture Corn',5)}</div></div>`:`<div class="grid g2"><div class="card"><div class="cardHead">HMC HARVEST TOTAL</div><div class="cardBody"><div class="kpi">${n(state.hmc.wetPounds)} lb</div><div class="muted">${n(state.hmc.wetBu,0)} wet bu • ${n(avg,1)}% avg moisture</div></div></div><div class="card"><div class="cardHead">NEXT TRUCK</div><div class="emptyState">No HMC loads are ready for moisture.</div></div></div>`}`;
 if(!load)return;let moisture=0;attachKeypad('hmc',v=>{moisture=v;document.getElementById('completeHmc').disabled=!(v>=12&&v<=40)});document.querySelector('#hmcScreen .editDriverBtn').onclick=()=>editDriverModal(load);document.getElementById('changeActiveFieldHmc').onclick=()=>activeFieldModal(load);document.getElementById('differentFieldHmc').onclick=()=>differentFieldModal(load);document.getElementById('splitHmc').onclick=()=>splitLoadModal(load);document.getElementById('completeHmc').onclick=()=>completePending(load,moisture,'High Moisture Corn Pile')

 document.querySelectorAll('.acreInput').forEach(i=>i.onchange=e=>{state.acres[e.target.dataset.key]=Math.max(0,Number(e.target.value||0));save();renderAll()});document.getElementById('printReport').onclick=()=>window.print();document.getElementById('exportCsv').onclick=()=>{const header=['Field','Owner','Harvest Type','Harvest Dates','Wet Bushels','Average Moisture','15% / Adjusted Bushels','Direct Elevator Adjusted Bushels','Harvested Acres','Yield'];const csv=[header.join(',')].concat(rows.map(r=>[r.field,r.owner,r.type,dateRange(r),r.wetBu.toFixed(2),r.wetLb?r.avgMoist.toFixed(2):'',r.dry15.toFixed(2),r.directAdjustedBu.toFixed(2),r.acres||'',r.yield?r.yield.toFixed(2):''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='granite-view-field-owner-summary.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function seedDemo(){state=defaultState();const t=nowISO();state.todayTares={Titan:{weight:25620,time:t},Outlaw:{weight:26100,time:t},International:{weight:28000,time:t},OAP:{weight:24800,time:t}};Object.assign(state.lastKnownTares,state.todayTares);state.bins.dry1=18400;state.bins.dry2=12600;state.activeField='Field 5';state.harvestType='Dry Corn';const demos=[['Titan','Dana','Field 5',78340,25620,24.1,'Wet Bin'],['Outlaw','Mike','Field 5',76440,26100,23.6,'Wet Bin'],['International','Keenan','Field 5',76920,28000,19.8,'Wet Bin'],['OAP','Jacob','Germantown 4',74680,24800,16.0,'Dry Bin #1']];demos.forEach((d,i)=>{const [truck,driver,field,gross,tare,m,dest]=d;const l={id:state.nextLoadId++,truck,driver,field,harvestType:'Dry Corn',gross,tare,net:gross-tare,time:new Date(Date.now()-(demos.length-i)*12*60000).toISOString(),status:'completed',moisture:m,destination:dest,fieldPortions:[{field,pounds:gross-tare}],fieldMode:'default',completedTime:new Date(Date.now()-(demos.length-i)*10*60000).toISOString()};applyCompletedLoad(l);state.completed.push(l)});state.recentNotification=state.completed.at(-1);save();renderAll();toast('Demo scenario loaded. You can reset anytime in Settings / Demo.')}
function renderSettings(){const ownerOpts=sel=>(state.ownerNames||DEFAULT_OWNERS).map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');document.getElementById('settingsScreen').innerHTML=`<h1 class="screenTitle">Settings / Demo</h1><p class="subtitle">Prototype controls plus field ownership assignments.</p><div class="grid g2"><div class="card"><div class="cardHead">PROTOTYPE ASSUMPTIONS</div><div class="cardBody"><ul><li>Working capacity: 65,000 bu each for Wet Bin, Dry Bin #1 and Dry Bin #2.</li><li>Dry-equivalent basis: 15.0%.</li><li>Farm-measured harvest shrink: 1.2% per moisture point above 15%.</li><li>Elevator ticket bushels marked already adjusted are never shrunk again.</li><li>Likely-empty threshold: within 5,000 lb of last known tare.</li><li><b>Forgotten empty tare safeguard:</b> a loaded truck can still weigh and dump. Gross, moisture and destination are saved; net weight/inventory finalize automatically when that truck later records its empty tare.</li><li>Moisture completion range: 12.0%–40.0%.</li><li>HMC feed-out is not tracked here; Performance Beef handles that after harvest.</li></ul></div></div><div class="card"><div class="cardHead">MULTI-DEVICE SAFEGUARDS — PRODUCTION DESIGN</div><div class="cardBody"><p><b>Dumping Pits:</b> one page contains both the Dry Corn Pit and High Moisture Corn Pit. Each physical pit keeps its own active control device.</p><p><b>Other phones/computers:</b> open those screens View Only by default.</p><p><b>Load locking:</b> only one device can actively edit a load at a time.</p><p><b>Duplicate protection:</b> server accepts a load completion once; a second completion attempt is rejected.</p><p><b>Take Control:</b> admin can deliberately transfer control if the primary device fails.</p><div class="notice info">This single-file prototype uses local browser storage, so true cross-device locking requires the production cloud database/server.</div></div></div></div><div class="card" style="margin-top:14px"><div class="cardHead">FIELD OWNER / ENTITY ASSIGNMENTS</div><div class="cardBody"><div class="row wrap"><div class="field" style="min-width:240px"><label>Add another owner/entity</label><input id="newOwner" placeholder="e.g. Johnson Farms LLC"></div><button class="btn primary" id="addOwner">Add Owner</button></div><div class="sectionLine"></div><div class="tableWrap"><table class="table"><thead><tr><th>Field</th><th>Owner / Entity</th></tr></thead><tbody>${FIELDS.map(f=>`<tr><td><b>${esc(f)}</b></td><td><select class="ownerSelect" data-field="${esc(f)}" style="padding:7px;min-width:190px">${ownerOpts(state.fieldOwners[f]||'Granite View Farms')}</select></td></tr>`).join('')}</tbody></table></div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardHead">DEMO DATA</div><div class="cardBody"><button class="btn gold big" id="seedDemo">Load Sample Harvest Data</button><div class="sectionLine"></div><button class="btn danger big" id="resetAll">Reset Prototype to Empty</button><p class="footerNote">Prototype data is stored only in this browser/device using local storage.</p></div></div><div class="card"><div class="cardHead">WHAT IS SIMULATED</div><div class="cardBody"><p><b>RFID:</b> choose a truck manually on Scale / Tare.</p><p><b>WI-127:</b> type a stable weight and tap Capture Stable Weight.</p><p><b>Grain Handler / Dryer Master:</b> enter BPH and minutes manually.</p><p><b>Combine notification:</b> completing a load shows a prototype toast.</p><p><b>Ticket camera:</b> Finish Ticket uses the device camera/file picker.</p></div></div></div>`;document.querySelectorAll('.ownerSelect').forEach(x=>x.onchange=e=>{state.fieldOwners[e.target.dataset.field]=e.target.value;save();renderAll()});document.getElementById('addOwner').onclick=()=>{const v=document.getElementById('newOwner').value.trim();if(!v)return;if(!(state.ownerNames||[]).includes(v))state.ownerNames.push(v);save();renderAll();toast(`Added owner/entity: <b>${esc(v)}</b>`)};document.getElementById('seedDemo').onclick=()=>{if(confirm('Replace current prototype data with a sample scenario?'))seedDemo()};document.getElementById('resetAll').onclick=()=>{if(confirm('Reset all prototype data?')){state=defaultState();save();renderAll();toast('Prototype reset.')}}}
function renderAll(){renderNav();NAV.forEach(([id])=>document.getElementById(id+'Screen').classList.toggle('active',state.activeScreen===id));renderScale();renderBin();renderHMC();renderDumping();renderDryer();renderCombine();renderLoadout();renderReports();renderSettings();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.activeScreen))}
setInterval(()=>{document.getElementById('clockText').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})},1000);document.getElementById('clockText').textContent=new Date().toLocaleString();renderAll();
})();
</script>
