<!doctype html>
<html lang="en">
<head>

<title>Granite View Farms Harvest Prototype v1</title>
<style>
:root{
  --maroon:#6f0d1b;--maroon2:#8c1628;--gold:#d8a51f;--ink:#171717;--muted:#667085;
  --bg:#f4f2ef;--card:#fff;--line:#ddd7d0;--good:#147a36;--warn:#b7791f;--bad:#b42318;
  --soft:#fbf7ed;--dark:#171c21;
}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit} button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#5f0816,var(--maroon));color:#fff;padding:10px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 1px 8px #0002}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brandMark{font-size:28px}.brandText{font-weight:800;letter-spacing:.4px;white-space:nowrap}.brandSub{font-size:11px;color:#ffd85a;font-weight:800}.topMeta{font-size:12px;text-align:right;opacity:.95}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}
.sidebar{background:var(--dark);color:white;padding:12px 8px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}.navbtn{width:100%;border:0;background:transparent;color:#fff;padding:13px 12px;border-radius:10px;text-align:left;margin:3px 0;font-weight:700;display:flex;gap:10px;align-items:center}.navbtn.active{background:var(--maroon2)}.navbtn:hover{background:#ffffff12}.content{padding:18px;min-width:0}.screen{display:none}.screen.active{display:block}.screenTitle{font-size:26px;font-weight:850;color:var(--maroon);margin:0 0 4px}.subtitle{color:var(--muted);margin:0 0 16px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cardHead{background:var(--maroon);color:white;padding:10px 13px;font-weight:800}.cardBody{padding:14px}.kpi{font-size:30px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.spacer{flex:1}.bigWeight{font-size:48px;font-weight:900;letter-spacing:-1px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#eee}.pill.good{background:#e8f5ec;color:var(--good)}.pill.warn{background:#fff4dc;color:#8a5a00}.pill.bad{background:#fdecea;color:var(--bad)}.btn{border:1px solid #b9b3ac;background:white;border-radius:10px;padding:11px 14px;font-weight:800}.btn.primary{background:var(--maroon);border-color:var(--maroon);color:white}.btn.good{background:var(--good);border-color:var(--good);color:white}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1e1600}.btn.danger{background:#fff;border-color:#d0a0a0;color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.big{padding:15px 18px;font-size:18px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#555}.field input,.field select{width:100%;padding:11px;border:1px solid #cfc8c0;border-radius:9px;background:white;min-height:44px}.field input[type=number]{font-variant-numeric:tabular-nums}.light{width:34px;height:34px;border-radius:50%;border:3px solid #333;box-shadow:inset 0 0 0 3px #0002}.light.red{background:#d82020}.light.green{background:#23b34e}.lightLabel{font-weight:900}.scalePanel{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}.truckName{font-size:36px;color:var(--maroon);font-weight:900}.weightStack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weightBox{padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#fff}.weightBox b{display:block;font-size:27px;margin-top:5px}.weightBox.net{background:#eef8f0;border-color:#a8d8b3}.queueItem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px;background:#fff}.queueItem.current{border-color:#d8a51f;background:#fff8e6}.queueItem .qTruck{font-weight:850;color:var(--maroon)}.sectionLine{height:1px;background:var(--line);margin:12px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px}.keypad button{min-height:54px;border:1px solid #ccc;border-radius:9px;background:#fafafa;font-size:22px;font-weight:800}.moistureDisplay{font-size:48px;font-weight:900;text-align:center;border:1px solid #ccc;border-radius:10px;padding:12px;background:#fff;margin-bottom:10px}.destButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dest{padding:18px 8px;border:2px solid #ddd;border-radius:12px;background:#fafafa;font-weight:850}.dest.selected{border-color:var(--maroon);background:#f9ecef;color:var(--maroon)}.binCard{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.progress{height:12px;border-radius:99px;background:#e8e8e8;overflow:hidden}.progress span{display:block;height:100%;background:var(--good)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{border-bottom:1px solid #e6e2dd;padding:9px 8px;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#555;background:#faf9f7}.modalBackdrop{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modalBackdrop.show{display:flex}.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0005}.modalHead{background:var(--maroon);color:#fff;padding:13px 16px;font-weight:850;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:16px}.toast{position:fixed;right:16px;bottom:16px;z-index:150;background:#1b1f23;color:white;border-radius:12px;padding:14px 16px;max-width:360px;box-shadow:0 12px 30px #0004;display:none}.toast.show{display:block}.notice{border:1px solid #d7c18b;background:#fff8e7;border-radius:10px;padding:10px 12px}.notice.info{border-color:#bcd0e8;background:#f1f7fd}.notice.good{border-color:#b8ddc0;background:#f0faf2}.recentChange{border:2px solid var(--gold);background:#fffaf0;border-radius:12px;padding:12px;margin-bottom:12px}.mobileForm .cardBody{display:grid;gap:12px}.photoPreview{max-width:100%;border:1px solid var(--line);border-radius:10px;display:none}.footerNote{font-size:11px;color:#777;margin-top:10px}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .btn.selected{background:var(--maroon);color:#fff;border-color:var(--maroon)}.printOnly{display:none}.statusDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22a447;margin-right:5px}.emptyState{padding:30px;text-align:center;color:#777}.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#eee}.right{margin-left:auto}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:62px;height:auto;z-index:19;display:flex;overflow:auto;padding:6px}.navbtn{white-space:nowrap;width:auto;flex:0 0 auto;padding:10px 12px}.content{padding:12px}.g2,.g3,.g4,.scalePanel{grid-template-columns:1fr}.weightStack{grid-template-columns:1fr 1fr 1fr}.destButtons{grid-template-columns:1fr}.topMeta{display:none}.brandText{font-size:14px}.screenTitle{font-size:22px}}
@media(max-width:560px){.sidebar{top:58px}.topbar{padding:9px}.content{padding:8px}.cardBody{padding:11px}.weightStack{grid-template-columns:1fr}.bigWeight{font-size:38px}.truckName{font-size:28px}.moistureDisplay{font-size:42px}.keypad{max-width:none}.btn.big{width:100%}.mobileHide{display:none}.g2.mobileOne,.g3.mobileOne{grid-template-columns:1fr}.topbar{min-height:58px}.layout{min-height:calc(100vh - 58px)}}
@media print{body{background:#fff}.topbar,.sidebar,.noPrint,.toast,.modalBackdrop{display:none!important}.layout{display:block}.content{padding:0}.screen{display:none!important}#reportsScreen{display:block!important}.screenTitle,.subtitle,.reportControls,.fieldDetail{display:none!important}.printOnly{display:block}.card{border:0}.table{min-width:0}.table th,.table td{font-size:10pt;padding:6px}.tableWrap{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandMark">🌽</div><div><div class="brandText">GRANITE VIEW FARMS</div><div class="brandSub">HARVEST SYSTEM • PROTOTYPE v1</div></div></div>
    <div class="topMeta"><span class="statusDot"></span>Prototype Online<br><span id="clockText"></span></div>
  </header>
  <div class="layout">
    <nav class="sidebar noPrint" id="nav"></nav>
    <main class="content">
      <section class="screen active" id="scaleScreen"></section>
      <section class="screen" id="binScreen"></section>
      <section class="screen" id="dryerScreen"></section>
      <section class="screen" id="combineScreen"></section>
      <section class="screen" id="hmcScreen"></section>
      <section class="screen" id="loadoutScreen"></section>
      <section class="screen" id="reportsScreen"></section>
      <section class="screen" id="settingsScreen"></section>
    </main>
  </div>
</div>
<div class="modalBackdrop" id="modalBackdrop"><div class="modal"><div class="modalHead"><span id="modalTitle">Modal</span><button class="btn" id="modalClose">✕</button></div><div class="modalBody" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='gvfHarvestPrototypeV1';
const CAPACITY=65000;
const TRUCKS=['Titan','Outlaw','International','OAP'];
const DRIVERS=['Dana','Mike','Keenan','Jacob','Martin','Morgan','Nancy'];
const FIELDS=['Field 1','Field 2',"Adler's — Field 3",'Field 4','Field 5','Field 7','Field 8','Stragies — Field 9',"Gar's — Field 11",'Field 10',"Betty's — Field 15","Cussy's — Field 20",'Field 23','North Delno — Field 24','South Delno — Field 25','Field 26','Field 27','Field 28','Field 29','Field 30','Field 31','Field 32','Field 33','Field 34',"Dana's — Field 36",'Cold Springs #1','Cold Springs #2','Cold Springs #3','Cold Springs #4',"Darren's Home","Deb's Alfalfa","Deb's Corn",'Germantown 3','Germantown 4','Germantown 6 South','Germantown 6 North','Germantown 9','Germantown 30','Germantown 31 North','Germantown 31 South','Lura 12 North','Lura 12 South'];
const DESTINATIONS=['POET – Big Stone','WesCon – Twin Brooks','Feed – Feedlot','Other'];
const NAV=[['scale','⚖️','Scale / Tare'],['bin','🏠','Bin Shack'],['dryer','🏭','Dryer / Bins'],['combine','🚜','Combine View'],['hmc','🌽','HMC Pit'],['loadout','🚛','Winter Load-Out'],['reports','📊','Fields / Reports'],['settings','⚙️','Settings / Demo']];
function defaultState(){
  const yesterday=new Date(Date.now()-86400000).toISOString();
  return {
    version:1,activeScreen:'scale',activeField:'Field 1',harvestType:'Dry Corn',
    truckDrivers:{Titan:'Dana',Outlaw:'Mike',International:'Keenan',OAP:'Jacob'},
    lastKnownTares:{Titan:{weight:25620,time:yesterday},Outlaw:{weight:26100,time:yesterday},International:{weight:28000,time:yesterday},OAP:{weight:24800,time:yesterday}},
    todayTares:{},tareHistory:[],scale:{truck:'Titan',weight:0,light:'red',locked:false,lastEvent:null},
    pending:[],completed:[],nextLoadId:1,
    fieldTransition:null,
    bins:{wet:{wetBu:0,dry15Bu:0,moistureMass:0},dry1:0,dry2:0},
    dryer:{running:false,bph:950,destination:'Dry Bin #1',processedWetBu:0},
    hmc:{wetPounds:0,wetBu:0,moistureMassLb:0},
    acres:{},loadouts:[],photoData:null,
    recentNotification:null
  };
}
let state=loadState();
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?Object.assign(defaultState(),JSON.parse(raw)):defaultState()}catch(e){return defaultState()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function nowISO(){return new Date().toISOString()}
function fmtTime(iso){if(!iso)return '—';return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}
function n(v,d=0){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function wetBushels(lb){return Number(lb||0)/56}
function shrinkFactor(m){m=Number(m); if(!isFinite(m)||m<=15)return 1; return Math.max(0,1-0.012*(m-15))}
function dry15From(lb,m){return wetBushels(lb)*shrinkFactor(m)}
function avgWetMoist(){const w=state.bins.wet.wetBu;return w>0?state.bins.wet.moistureMass/w:0}
function wetPercent(){return Math.min(100,(state.bins.wet.wetBu/CAPACITY)*100)}
function pct(v){return Math.min(100,(Number(v||0)/CAPACITY)*100)}
function todayKey(){return new Date().toLocaleDateString()}
function isToday(iso){return iso && new Date(iso).toLocaleDateString()===todayKey()}
function options(arr,selected){return arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function toast(msg,ms=2800){const el=document.getElementById('toast');el.innerHTML=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms)}
function setScreen(id){state.activeScreen=id;save();renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function navHTML(){return NAV.map(([id,ic,label])=>`<button class="navbtn ${state.activeScreen===id?'active':''}" data-nav="${id}"><span>${ic}</span>${label}</button>`).join('')}
function renderNav(){document.getElementById('nav').innerHTML=navHTML();document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setScreen(b.dataset.nav)))}
function showModal(title,html,onReady){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show');if(onReady)onReady()}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalClose').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function currentTare(truck){return state.todayTares[truck]||null}
function lastTare(truck){return state.todayTares[truck]||state.lastKnownTares[truck]||null}
function resolveWaitingTares(truck,newTare){let count=0;state.pending.forEach(l=>{if(l.truck===truck && l.status==='waiting_tare'){l.tare=newTare.weight;l.net=Math.max(0,l.gross-newTare.weight);l.status='awaiting_moisture';count++}});return count}
function saveTare(){const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight first.');return}const rec={weight,time:nowISO()};state.todayTares[truck]=rec;state.lastKnownTares[truck]=rec;state.tareHistory.push({truck,weight,time:rec.time});const resolved=resolveWaitingTares(truck,rec);state.scale.light='green';state.scale.locked=true;state.scale.lastEvent=`Saved ${truck} tare at ${n(weight)} lb`;save();renderAll();toast(`✅ ${truck} tare saved at <b>${n(weight)} lb</b>${resolved?` • ${resolved} waiting load${resolved>1?'s':''} resolved`:''}`)}
function captureScale(){if(state.scale.locked){toast('Scale is locked until the truck leaves and the scale returns to zero.');return}const truck=state.scale.truck, weight=Number(state.scale.weight);if(!(weight>0)){toast('Enter a stable scale weight.');return}const tToday=currentTare(truck), tLast=lastTare(truck);const ref=tToday||tLast; if(!ref){showUnknownScaleModal();return}
  const diff=weight-ref.weight;
  if(diff<=5000){showModal('LIKELY EMPTY TRUCK',`<div class="notice"><b>${esc(truck)}</b> is only <b>${n(Math.max(0,diff))} lb</b> above its last known tare.<br><br>Current scale weight: <b>${n(weight)} lb</b><br><br>Save this as today's empty weight?</div><div class="row wrap" style="margin-top:14px"><button class="btn good big" id="confirmEmpty">I'M EMPTY — SAVE TARE</button><button class="btn" id="treatLoaded">NO — TREAT AS LOADED</button></div>`,()=>{document.getElementById('confirmEmpty').onclick=()=>{closeModal();saveTare()};document.getElementById('treatLoaded').onclick=()=>{closeModal();createLoadedScaleEvent()}})}else createLoadedScaleEvent();
}
function showUnknownScaleModal(){showModal('NO TARE REFERENCE',`<p>There is no tare history for <b>${esc(state.scale.truck)}</b>.</p><div class="row wrap"><button class="btn good big" id="unknownEmpty">I'M EMPTY — SAVE TARE</button><button class="btn primary big" id="unknownLoaded">THIS IS A LOADED WEIGHT</button></div>`,()=>{document.getElementById('unknownEmpty').onclick=()=>{closeModal();saveTare()};document.getElementById('unknownLoaded').onclick=()=>{closeModal();createLoadedScaleEvent()}})}
function createLoadedScaleEvent(){const truck=state.scale.truck, gross=Number(state.scale.weight), tare=currentTare(truck);const load={id:state.nextLoadId++,truck,driver:state.truckDrivers[truck]||DRIVERS[0],field:state.activeField,harvestType:state.harvestType,gross,tare:tare?tare.weight:null,net:tare?Math.max(0,gross-tare.weight):null,time:nowISO(),status:tare?'awaiting_moisture':'waiting_tare',moisture:0,destination:null,fieldPortions:null,fieldMode:'default'};state.pending.push(load);state.scale.light='green';state.scale.locked=true;state.scale.lastEvent=`Captured loaded ${truck} at ${n(gross)} lb`;save();renderAll();toast(tare?`✅ ${truck} loaded weight captured. Sent to ${load.harvestType==='High Moisture Corn'?'HMC Pit':'Bin Shack'} queue.`:`⚠️ ${truck} captured but is waiting for today's tare.`)}
function scaleLeft(){state.scale.weight=0;state.scale.light='red';state.scale.locked=false;save();renderAll();toast('Scale reset to zero. Ready for next truck.')}
function changeActiveField(newField){if(newField===state.activeField)return;const old=state.activeField;state.activeField=newField;state.fieldTransition={from:old,to:newField,confirmed:0,active:true,started:nowISO()};save();renderAll();toast(`Active field changed: <b>${esc(old)}</b> → <b>${esc(newField)}</b>. Recent-field safeguard is active.`)}
function changeHarvestType(newType){state.harvestType=newType;save();renderAll();toast(`Harvest type changed to <b>${esc(newType)}</b>.`)}
function pendingFor(type){return state.pending.filter(l=>l.harvestType===type && l.status==='awaiting_moisture').sort((a,b)=>new Date(a.time)-new Date(b.time))}
function waitingTareCount(){return state.pending.filter(l=>l.status==='waiting_tare').length}
function binStatusHTML(){const wet=state.bins.wet.wetBu, d1=state.bins.dry1,d2=state.bins.dry2;return `<div class="card"><div class="cardHead">BIN STATUS / CALCULATED INVENTORY</div><div class="cardBody" style="padding:0"><div class="binCard"><div><b>Wet Bin</b><div class="small muted">${n(wet,0)} wet bu • ${n(avgWetMoist(),1)}% avg • ${n(state.bins.wet.dry15Bu,0)} bu @15%</div><div class="progress"><span style="width:${wetPercent()}%"></span></div></div><b>${n(wetPercent(),0)}%</b></div><div class="binCard"><div><b>Dry Bin #1</b><div class="small muted">${n(d1,0)} bu @15%</div><div class="progress"><span style="width:${pct(d1)}%"></span></div></div><b>${n(pct(d1),0)}%</b></div><div class="binCard"><div><b>Dry Bin #2</b><div class="small muted">${n(d2,0)} bu @15%</div><div class="progress"><span style="width:${pct(d2)}%"></span></div></div><b>${n(pct(d2),0)}%</b></div></div></div>`}
function renderScale(){const t=state.scale.truck, wt=Number(state.scale.weight), tt=currentTare(t), lt=lastTare(t), net=tt&&wt>0?wt-tt.weight:null;const queue=state.pending.slice().sort((a,b)=>new Date(a.time)-new Date(b.time));document.getElementById('scaleScreen').innerHTML=`
<h1 class="screenTitle">Scale / Tare</h1><p class="subtitle">Prototype: truck selection stands in for RFID; “Capture Stable Weight” stands in for automatic WI-127 capture.</p>
<div class="grid g3">
<div class="card"><div class="cardHead">SCALE TRAFFIC LIGHT</div><div class="cardBody"><div class="row"><div class="light ${state.scale.light}"></div><div><div class="lightLabel">${state.scale.light==='green'?'GREEN — WEIGHT SAVED':'RED — WAIT'}</div><div class="small muted">${state.scale.locked?'Locked until scale returns to zero':'Ready for a truck'}</div></div></div><div class="sectionLine"></div><button class="btn" id="scaleLeftBtn">Simulate Truck Left / Scale Zero</button></div></div>
<div class="card"><div class="cardHead">CURRENT TRUCK / SCALE</div><div class="cardBody"><div class="field"><label>Truck (RFID simulation)</label><select id="scaleTruck">${options(TRUCKS,t)}</select></div><div class="field" style="margin-top:10px"><label>Stable WI-127 Weight (lb)</label><input id="scaleWeight" type="number" inputmode="numeric" value="${wt||''}" placeholder="e.g. 78420"></div><div class="row wrap" style="margin-top:12px"><button class="btn primary big" id="captureWeight" ${state.scale.locked?'disabled':''}>Capture Stable Weight</button><button class="btn good" id="emptyBtn" ${state.scale.locked?'disabled':''}>I'M EMPTY — SAVE TARE</button></div></div></div>
<div class="card"><div class="cardHead">${esc(t)} TARE STATUS</div><div class="cardBody"><div class="small muted">Today's tare</div><div class="kpi">${tt?n(tt.weight)+' lb':'Not saved'}</div><div class="small muted">Last known: ${lt?n(lt.weight)+' lb • '+fmtDate(lt.time):'none'}</div>${tt?`<div class="sectionLine"></div><div>At current scale weight:</div><div class="kpi" style="color:${net!==null&&net>5000?'var(--good)':'var(--ink)'}">${net!==null?n(net)+' lb net':'—'}</div>`:''}</div></div>
</div>
<div class="grid g2" style="margin-top:14px">
<div class="card"><div class="cardHead">ACTIVE HARVEST DEFAULTS</div><div class="cardBody"><div class="grid g2"><div class="field"><label>Active Field</label><select id="activeFieldScale">${options(FIELDS,state.activeField)}</select></div><div class="field"><label>Harvest Type</label><select id="harvestTypeScale"><option ${state.harvestType==='Dry Corn'?'selected':''}>Dry Corn</option><option ${state.harvestType==='High Moisture Corn'?'selected':''}>High Moisture Corn</option></select></div></div><p class="footerNote">Normal loaded trucks inherit these defaults. Final field/destination can be corrected at the Bin Shack or HMC Pit.</p></div></div>
<div class="card"><div class="cardHead">TRUCK / DRIVER ASSIGNMENT</div><div class="cardBody"><div class="grid g2">${TRUCKS.map(x=>`<div class="field"><label>${esc(x)}</label><select class="driverAssign" data-truck="${esc(x)}">${options(DRIVERS,state.truckDrivers[x])}</select></div>`).join('')}</div></div></div>
</div>

function moisturePadHTML(prefix){return `<div class="moistureDisplay" id="${prefix}MoistDisplay">0.0%</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-key="${k}" class="${prefix}Key">${k}</button>`).join('')}</div><div class="small muted" style="margin-top:8px">Valid range: 12.0%–40.0%. Every new load starts at 0.</div>`}
function attachKeypad(prefix,onChange){let value='';const display=document.getElementById(prefix+'MoistDisplay');function refresh(){display.textContent=(value||'0')+(value&&value.includes('.')?'':'')+'%';onChange(Number(value||0))}document.querySelectorAll('.'+prefix+'Key').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='⌫')value=value.slice(0,-1);else if(k==='.'&&value.includes('.')){}else if(value.length<5)value+=k;refresh()});refresh()}

function editDriverModal(load){showModal('EDIT DRIVER',`<div class="field"><label>Driver for this load</label><select id="modalDriver">${options(DRIVERS,load.driver)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveDriver">Save Driver</button></div>`,()=>document.getElementById('saveDriver').onclick=()=>{load.driver=document.getElementById('modalDriver').value;state.truckDrivers[load.truck]=load.driver;save();closeModal();renderAll()})}
function differentFieldModal(load){showModal('DIFFERENT FIELD FOR THIS LOAD',`<p>This changes only this load. It does <b>not</b> change the active field.</p><div class="field"><label>Field</label><select id="differentField">${options(FIELDS,load.field)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveDifferentField">Use This Field</button></div>`,()=>document.getElementById('saveDifferentField').onclick=()=>{load.field=document.getElementById('differentField').value;load.fieldMode='different';save();closeModal();renderAll()})}
function activeFieldModal(load){showModal('CHANGE ACTIVE FIELD',`<p>The selected field becomes the default for future loads. A temporary recent-field safeguard will start.</p><div class="field"><label>New active field</label><select id="newActiveField">${options(FIELDS,state.activeField)}</select></div><div style="margin-top:12px"><button class="btn primary" id="saveActiveField">Change Active Field</button></div>`,()=>document.getElementById('saveActiveField').onclick=()=>{const f=document.getElementById('newActiveField').value;changeActiveField(f);load.field=f;load.fieldMode='default';closeModal();renderAll()})}
function splitLoadModal(load){let portion=0;showModal('SPLIT LOAD',`<div class="notice info">Official net weight: <b>${n(load.net)} lb</b></div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Portion 1 weight (lb)</label><input id="splitWeight" type="number" inputmode="numeric" placeholder="e.g. 28000"></div><div class="field"><label>Portion 1 field</label><select id="splitField1">${options(FIELDS,load.field)}</select></div><div class="field"><label>Remainder (calculated)</label><input id="splitRemainder" disabled value="${n(load.net)}"></div><div class="field"><label>Remainder field</label><select id="splitField2">${options(FIELDS,state.activeField)}</select></div></div><div id="splitMsg" class="small muted" style="margin-top:10px"></div><button class="btn primary big" id="saveSplit" style="margin-top:12px">Save Split</button>`,()=>{const sw=document.getElementById('splitWeight'),rem=document.getElementById('splitRemainder'),msg=document.getElementById('splitMsg');sw.oninput=()=>{portion=Number(sw.value||0);rem.value=n(Math.max(0,load.net-portion));msg.textContent=portion>0&&portion<load.net?'Total will equal official truck net.':''};document.getElementById('saveSplit').onclick=()=>{const p=Number(sw.value||0),f1=document.getElementById('splitField1').value,f2=document.getElementById('splitField2').value;if(!(p>0&&p<load.net)){msg.textContent='Enter a portion greater than 0 and less than the official net weight.';return}if(f1===f2){msg.textContent='Select two different fields.';return}load.fieldPortions=[{field:f1,pounds:p},{field:f2,pounds:load.net-p}];load.fieldMode='split';load.field=`${f1} / ${f2}`;save();closeModal();renderAll()}})}
function recentFieldPromptHTML(){if(!state.fieldTransition||!state.fieldTransition.active)return '';return `<div class="recentChange"><b>⚠️ FIELD CHANGED RECENTLY</b><div style="margin-top:5px">Active field is <b>${esc(state.activeField)}</b>. Confirm the field for this load before completing it.</div></div>`}
function ensureRecentFieldChoice(load,after){if(!state.fieldTransition||!state.fieldTransition.active||load.fieldMode==='different'||load.fieldMode==='split'||load.recentConfirmed){after();return}showModal('FIELD CHANGED RECENTLY',`<div class="notice"><b>Active field: ${esc(state.activeField)}</b><br>Is this load from ${esc(state.activeField)}?</div><div class="grid g3" style="margin-top:14px"><button class="btn good big" id="fieldYes">YES — ${esc(state.activeField)}</button><button class="btn big" id="fieldDifferent">DIFFERENT FIELD</button><button class="btn big" id="fieldSplit">SPLIT LOAD</button></div><p class="small muted">This safeguard disappears automatically after five fully confirmed loads from the new field. No countdown is shown.</p>`,()=>{document.getElementById('fieldYes').onclick=()=>{load.field=state.activeField;load.recentConfirmed=true;closeModal();after()};document.getElementById('fieldDifferent').onclick=()=>{closeModal();differentFieldModal(load)};document.getElementById('fieldSplit').onclick=()=>{closeModal();splitLoadModal(load)}})}

function applyCompletedLoad(load){const m=load.moisture,lb=load.net,wet=wetBushels(lb),dry15=dry15From(lb,m);if(load.harvestType==='Dry Corn'){
    if(load.destination==='Wet Bin'){state.bins.wet.wetBu+=wet;state.bins.wet.dry15Bu+=dry15;state.bins.wet.moistureMass+=wet*m}
    else if(load.destination==='Dry Bin #1') state.bins.dry1+=dry15;
    else if(load.destination==='Dry Bin #2') state.bins.dry2+=dry15;
  }else{state.hmc.wetPounds+=lb;state.hmc.wetBu+=wet;state.hmc.moistureMassLb+=lb*m}
  if(state.fieldTransition&&state.fieldTransition.active&&load.recentConfirmed&&load.fieldMode!=='split'&&load.field===state.activeField){state.fieldTransition.confirmed++;if(state.fieldTransition.confirmed>=5)state.fieldTransition.active=false}
  state.recentNotification={truck:load.truck,moisture:m,field:load.field,time:nowISO()};
}
function completePending(load,moisture,destination){if(!(moisture>=12&&moisture<=40)){toast('Enter a valid moisture between 12.0% and 40.0%.');return}load.moisture=moisture;load.destination=destination;ensureRecentFieldChoice(load,()=>{state.pending=state.pending.filter(x=>x.id!==load.id);load.status='completed';load.completedTime=nowISO();if(!load.fieldPortions)load.fieldPortions=[{field:load.field,pounds:load.net}];applyCompletedLoad(load);state.completed.push(load);save();renderAll();toast(`🔔 Combine notification: <b>${esc(load.truck)} IS DUMPING — ${n(moisture,1)}%</b> • ${esc(load.field)}`,4200)})}
function recentLoadsHTML(type,limit=5){const rows=state.completed.filter(l=>!type||l.harvestType===type).slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).slice(0,limit);return rows.length?rows.map(l=>`<div class="queueItem"><div><b>${esc(l.truck)}</b> • ${n(l.moisture,1)}%<div class="small muted">${esc(l.field)} • ${fmtTime(l.completedTime)}</div></div><div><b>${n(l.net)} lb</b></div></div>`).join(''):`<div class="emptyState">No completed loads yet.</div>`}

}

="margin-top:14px"><div class="cardHead">RECENT HMC LOADS</div><div class="cardBody">${recentLoadsHTML('High Moisture Corn',5)}</div></div>`:`<div class="grid g2"><div class="card"><div class="cardHead">HMC HARVEST TOTAL</div><div class="cardBody"><div class="kpi">${n(state.hmc.wetPounds)} lb</div><div class="muted">${n(state.hmc.wetBu,0)} wet bu • ${n(avg,1)}% avg moisture</div></div></div><div class="card"><div class="cardHead">NEXT TRUCK</div><div class="emptyState">No HMC loads are ready for moisture.</div></div></div>`}`;

function renderCombine(){const rows=state.completed.slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).slice(0,8);const last=rows[0];const last5=rows.slice(0,5);const avg=last5.length?last5.reduce((s,l)=>s+l.moisture,0)/last5.length:0;document.getElementById('combineScreen').innerHTML=`<h1 class="screenTitle">Combine View</h1><p class="subtitle">Read-only quick check. In the real app, FieldView can stay open and this system will send a push banner/sound when a load is completed.</p><div class="card"><div class="cardBody">${last?`<div class="grid g3"><div><div class="small muted">LAST TRUCK</div><div class="truckName">${esc(last.truck)} IS DUMPING</div></div><div><div class="small muted">MOISTURE</div><div class="bigWeight">${n(last.moisture,1)}%</div></div><div><div class="small muted">FIELD</div><div class="kpi">${esc(last.field)}</div></div></div>`:`<div class="emptyState">Complete a load at the Bin Shack or HMC Pit to populate Combine View.</div>`}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardHead">RECENT LOADS</div><div class="cardBody tableWrap">${rows.length?`<table class="table"><thead><tr><th>Truck</th><th>Moisture</th><th>Field</th><th>Time</th><th>Net Weight</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l.truck)}</b></td><td>${n(l.moisture,1)}%</td><td>${esc(l.field)}</td><td>${fmtTime(l.completedTime)}</td><td>${n(l.net)} lb</td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed loads.</div>`}</div></div><div class="card"><div class="cardHead">MOISTURE QUICK STATS</div><div class="cardBody"><div class="grid g3"><div><div class="small muted">Last 5 Avg.</div><div class="kpi">${n(avg,1)}%</div></div><div><div class="small muted">High</div><div class="kpi">${last5.length?n(Math.max(...last5.map(x=>x.moisture)),1):'0.0'}%</div></div><div><div class="small muted">Low</div><div class="kpi">${last5.length?n(Math.min(...last5.map(x=>x.moisture)),1):'0.0'}%</div></div></div><div class="sectionLine"></div><b>Active field:</b> ${esc(state.activeField)}<br><b>Harvest type:</b> ${esc(state.harvestType)}</div></div></div>`}
function renderLoadout(){document.getElementById('loadoutScreen').innerHTML=`<h1 class="screenTitle">Winter Load-Out</h1><p class="subtitle">iPhone-first manual workflow. Buyer ticket is the official outbound quantity; ticket photo attaches to the load.</p><div class="grid g2 mobileOne"><div class="card mobileForm"><div class="cardHead">NEW LOAD-OUT</div><div class="cardBody"><div class="notice info"><b>Bin balances:</b> Wet ${n(state.bins.wet.dry15Bu,0)} bu @15% • Dry #1 ${n(state.bins.dry1,0)} • Dry #2 ${n(state.bins.dry2,0)}</div><div class="field"><label>Source Bin</label><select id="loSource"><option>Dry Bin #1</option><option>Dry Bin #2</option><option>Wet Bin</option></select></div><div class="field"><label>Truck</label><select id="loTruck">${options(TRUCKS,'Titan')}</select></div><div class="field"><label>Driver</label><select id="loDriver">${options(DRIVERS,'Dana')}</select></div><div class="field"><label>Destination</label><select id="loDest">${options(DESTINATIONS,'POET – Big Stone')}</select></div><div class="grid g2"><div class="field"><label>Buyer Bushels</label><input id="loBu" type="number" inputmode="decimal" placeholder="e.g. 1120.5"></div><div class="field"><label>Buyer Moisture (%)</label><input id="loMoist" type="number" inputmode="decimal" placeholder="e.g. 14.8"></div></div><div class="field"><label>Buyer Net Weight (lb) — optional, useful for split-bin loads</label><input id="loNet" type="number" inputmode="numeric" placeholder="e.g. 62720"></div><div class="field"><label>Buyer Ticket Photo</label><input id="ticketPhoto" type="file" accept="image/*" capture="environment" style="display:none"><button class="btn primary big" id="takePhoto">📷 TAKE TICKET PHOTO</button><img id="ticketPreview" class="photoPreview" alt="Ticket photo preview"><div id="photoSaved" class="small muted">No photo attached yet.</div></div><button class="btn" id="toggleSplitLo">Split Bin Load (Optional)</button><div id="splitLoArea" class="hidden"><div class="notice"><b>Split source:</b> enter the known pounds from the first bin. The remainder of the official buyer load is assigned to the second bin.</div><div class="grid g2" style="margin-top:10px"><div class="field"><label>Known portion source</label><select id="splitSource1"><option>Wet Bin</option><option>Dry Bin #1</option><option>Dry Bin #2</option></select></div><div class="field"><label>Known pounds from source 1</label><input id="splitKnownLb" type="number" inputmode="numeric" placeholder="e.g. 22600"></div><div class="field"><label>Remainder source</label><select id="splitSource2"><option>Dry Bin #1</option><option>Dry Bin #2</option><option>Wet Bin</option></select></div></div></div><button class="btn good big" id="saveLoadout">SAVE LOAD-OUT</button></div></div><div class="card"><div class="cardHead">RECENT LOAD-OUTS</div><div class="cardBody">${state.loadouts.length?state.loadouts.slice().reverse().slice(0,8).map(l=>`<div class="queueItem"><div><b>${esc(l.truck)}</b> → ${esc(l.destination)}<div class="small muted">${esc(l.sourceLabel)} • ${fmtDate(l.time)} ${fmtTime(l.time)}</div></div><div style="text-align:right"><b>${n(l.bushels,1)} bu</b><div class="small">${n(l.moisture,1)}%</div></div></div>`).join(''):`<div class="emptyState">No winter load-outs recorded.</div>`}</div></div></div>`;
 let photoData=null;document.getElementById('takePhoto').onclick=()=>document.getElementById('ticketPhoto').click();document.getElementById('ticketPhoto').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;const img=document.getElementById('ticketPreview');img.src=photoData;img.style.display='block';document.getElementById('photoSaved').textContent='Photo attached to this load-out.'};r.readAsDataURL(f)};document.getElementById('toggleSplitLo').onclick=()=>document.getElementById('splitLoArea').classList.toggle('hidden');document.getElementById('saveLoadout').onclick=()=>{const source=document.getElementById('loSource').value,truck=document.getElementById('loTruck').value,driver=document.getElementById('loDriver').value,destination=document.getElementById('loDest').value,bushels=Number(document.getElementById('loBu').value||0),moisture=Number(document.getElementById('loMoist').value||0),netLb=Number(document.getElementById('loNet').value||0),split=!document.getElementById('splitLoArea').classList.contains('hidden');if(!(bushels>0)){toast('Enter buyer bushels.');return}if(!(moisture>=12&&moisture<=40)){toast('Enter a valid buyer moisture between 12% and 40%.');return}let allocations=[];if(split){const s1=document.getElementById('splitSource1').value,s2=document.getElementById('splitSource2').value,known=Number(document.getElementById('splitKnownLb').value||0);if(s1===s2){toast('Split-bin load needs two different source bins.');return}if(!(netLb>0&&known>0&&known<netLb)){toast('For a split-bin load, enter buyer net weight and a valid known portion weight.');return}const r1=known/netLb;allocations=[{source:s1,bushels:bushels*r1},{source:s2,bushels:bushels*(1-r1)}]}else allocations=[{source,bushels}];
  for(const a of allocations){if(a.source==='Dry Bin #1')state.bins.dry1=Math.max(0,state.bins.dry1-a.bushels);else if(a.source==='Dry Bin #2')state.bins.dry2=Math.max(0,state.bins.dry2-a.bushels);else{const avail=state.bins.wet.dry15Bu;const take=Math.min(avail,a.bushels);const frac=avail>0?take/avail:0;state.bins.wet.dry15Bu=Math.max(0,state.bins.wet.dry15Bu-take);state.bins.wet.wetBu=Math.max(0,state.bins.wet.wetBu*(1-frac));state.bins.wet.moistureMass=Math.max(0,state.bins.wet.moistureMass*(1-frac))}}
  state.loadouts.push({time:nowISO(),truck,driver,destination,bushels,moisture,netLb,photoData:photoData||null,allocations,sourceLabel:allocations.map(a=>a.source).join(' / ')});save();renderAll();toast(`Saved ${n(bushels,1)} bu load-out to ${esc(destination)}.`)}
}
function fieldRows(){const map={};for(const l of state.completed){for(const p of (l.fieldPortions||[{field:l.field,pounds:l.net}])){const key=p.field+'|'+l.harvestType;if(!map[key])map[key]={field:p.field,type:l.harvestType,loads:new Set(),wetLb:0,moistMass:0,dry15:0,dates:[]};const r=map[key];r.loads.add(l.id);r.wetLb+=p.pounds;r.moistMass+=p.pounds*l.moisture;r.dry15+=dry15From(p.pounds,l.moisture);r.dates.push(l.completedTime||l.time)}}return Object.values(map).map(r=>{r.wetBu=wetBushels(r.wetLb);r.avgMoist=r.wetLb?r.moistMass/r.wetLb:0;r.loadCount=r.loads.size;const ac=Number(state.acres[r.field+'|'+r.type]||0);r.acres=ac;r.yield=ac?(r.type==='Dry Corn'?r.dry15:r.wetBu)/ac:0;r.minDate=r.dates.length?new Date(Math.min(...r.dates.map(x=>+new Date(x)))).toISOString():null;r.maxDate=r.dates.length?new Date(Math.max(...r.dates.map(x=>+new Date(x)))).toISOString():null;return r}).sort((a,b)=>a.field.localeCompare(b.field))}
function dateRange(r){if(!r.minDate)return '—';const a=fmtDate(r.minDate),b=fmtDate(r.maxDate);return a===b?a:`${a} – ${b}`}
function renderReports(){const rows=fieldRows();document.getElementById('reportsScreen').innerHTML=`<div class="printOnly"><h1>Granite View Farms — Field Harvest Summary</h1><p>15% equivalent uses prototype USDA-style 1.2% shrink per moisture point above 15%.</p></div><h1 class="screenTitle">Fields / Reports</h1><p class="subtitle">Primary printable report: every field summary with harvest dates, wet bushels, 15%-equivalent bushels, weighted-average moisture, harvested acres, and yield.</p><div class="row wrap reportControls noPrint"><button class="btn primary" id="printReport">🖨️ Print All-Fields Summary</button><button class="btn" id="exportCsv">Export CSV</button><span class="small muted">Enter acres below as needed for each crop year / harvest type.</span></div><div class="card" style="margin-top:14px"><div class="cardHead">ALL FIELD SUMMARIES</div><div class="cardBody tableWrap">${rows.length?`<table class="table" id="fieldSummaryTable"><thead><tr><th>Field</th><th>Type</th><th>Harvest Date(s)</th><th>Wet Bushels</th><th>Avg Moisture</th><th>15% Bushels</th><th>Harvested Acres</th><th>Yield</th><th class="noPrint">Loads</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.field)}</b></td><td>${esc(r.type)}</td><td>${dateRange(r)}</td><td>${n(r.wetBu,0)}</td><td>${n(r.avgMoist,1)}%</td><td>${n(r.dry15,0)}</td><td class="noPrint"><input class="acreInput" data-key="${esc(r.field+'|'+r.type)}" type="number" step="0.1" value="${r.acres||''}" style="width:86px;padding:6px"></td><td class="printOnly">${r.acres?n(r.acres,1):'—'}</td><td>${r.acres?n(r.yield,1):'—'} ${r.type==='Dry Corn'?'bu/ac @15%':'wet bu/ac'}</td><td class="noPrint">${r.loadCount}</td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed harvest loads yet. Use Scale → Bin Shack/HMC Pit to create some.</div>`}</div></div><div class="card fieldDetail noPrint" style="margin-top:14px"><div class="cardHead">INDIVIDUAL LOAD HISTORY</div><div class="cardBody tableWrap">${state.completed.length?`<table class="table"><thead><tr><th>Date / Time</th><th>Truck</th><th>Driver</th><th>Field(s)</th><th>Net Weight</th><th>Moisture</th><th>Destination</th></tr></thead><tbody>${state.completed.slice().sort((a,b)=>new Date(b.completedTime)-new Date(a.completedTime)).map(l=>`<tr><td>${fmtDate(l.completedTime)} ${fmtTime(l.completedTime)}</td><td>${esc(l.truck)}</td><td>${esc(l.driver)}</td><td>${esc((l.fieldPortions||[]).map(p=>p.field).join(' / ')||l.field)}</td><td>${n(l.net)} lb</td><td>${n(l.moisture,1)}%</td><td>${esc(l.destination||'')}</td></tr>`).join('')}</tbody></table>`:`<div class="emptyState">No completed loads.</div>`}</div></div>`;
 document.querySelectorAll('.acreInput').forEach(i=>i.onchange=e=>{state.acres[e.target.dataset.key]=Math.max(0,Number(e.target.value||0));save();renderAll()});document.getElementById('printReport').onclick=()=>window.print();document.getElementById('exportCsv').onclick=()=>{const header=['Field','Harvest Type','Harvest Dates','Wet Bushels','Average Moisture','15% Bushels','Harvested Acres','Yield'];const csv=[header.join(',')].concat(rows.map(r=>[r.field,r.type,dateRange(r),r.wetBu.toFixed(2),r.avgMoist.toFixed(2),r.dry15.toFixed(2),r.acres||'',r.yield?r.yield.toFixed(2):''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='granite-view-field-summary.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function seedDemo(){state=defaultState();const t=nowISO();state.todayTares={Titan:{weight:25620,time:t},Outlaw:{weight:26100,time:t},International:{weight:28000,time:t},OAP:{weight:24800,time:t}};Object.assign(state.lastKnownTares,state.todayTares);state.bins.dry1=18400;state.bins.dry2=12600;state.activeField='Field 5';state.harvestType='Dry Corn';const demos=[['Titan','Dana','Field 5',78340,25620,24.1,'Wet Bin'],['Outlaw','Mike','Field 5',76440,26100,23.6,'Wet Bin'],['International','Keenan','Field 5',76920,28000,19.8,'Wet Bin'],['OAP','Jacob','Germantown 4',74680,24800,16.0,'Dry Bin #1']];demos.forEach((d,i)=>{const [truck,driver,field,gross,tare,m,dest]=d;const l={id:state.nextLoadId++,truck,driver,field,harvestType:'Dry Corn',gross,tare,net:gross-tare,time:new Date(Date.now()-(demos.length-i)*12*60000).toISOString(),status:'completed',moisture:m,destination:dest,fieldPortions:[{field,pounds:gross-tare}],fieldMode:'default',completedTime:new Date(Date.now()-(demos.length-i)*10*60000).toISOString()};applyCompletedLoad(l);state.completed.push(l)});state.recentNotification=state.completed.at(-1);save();renderAll();toast('Demo scenario loaded. You can reset anytime in Settings / Demo.')}
function renderSettings(){document.getElementById('settingsScreen').innerHTML=`<h1 class="screenTitle">Settings / Demo</h1><p class="subtitle">Prototype controls only. These are not final production settings.</p><div class="grid g2"><div class="card"><div class="cardHead">PROTOTYPE ASSUMPTIONS</div><div class="cardBody"><ul><li>Working capacity: 65,000 bu each for Wet Bin, Dry Bin #1 and Dry Bin #2.</li><li>Dry-equivalent basis: 15.0%.</li><li>Prototype shrink: 1.2% per moisture point above 15%.</li><li>Likely-empty threshold: within 5,000 lb of last known tare.</li><li>Moisture completion range: 12.0%–40.0%.</li><li>HMC feed-out is not tracked here; Performance Beef handles that after harvest.</li></ul></div></div><div class="card"><div class="cardHead">DEMO DATA</div><div class="cardBody"><button class="btn gold big" id="seedDemo">Load Sample Harvest Data</button><div class="sectionLine"></div><button class="btn danger big" id="resetAll">Reset Prototype to Empty</button><p class="footerNote">Prototype data is stored only in this browser/device using local storage.</p></div></div></div><div class="card" style="margin-top:14px"><div class="cardHead">WHAT IS SIMULATED</div><div class="cardBody"><p><b>RFID:</b> choose a truck manually on Scale / Tare.</p><p><b>WI-127:</b> type a stable weight and tap Capture Stable Weight.</p><p><b>Scale traffic light:</b> red/green is simulated on screen.</p><p><b>Grain Handler / Dryer Master:</b> enter BPH and minutes manually to simulate processed wet bushels.</p><p><b>Combine push notification:</b> completing a load shows a prototype notification toast and updates Combine View.</p><p><b>Ticket camera:</b> the Winter Load-Out “Take Ticket Photo” button uses the device camera/file picker when supported.</p></div></div>`;document.getElementById('seedDemo').onclick=()=>{if(confirm('Replace current prototype data with a sample scenario?'))seedDemo()};document.getElementById('resetAll').onclick=()=>{if(confirm('Reset all prototype data?')){state=defaultState();save();renderAll();toast('Prototype reset.')}}}
function renderAll(){renderNav();NAV.forEach(([id])=>document.getElementById(id+'Screen').classList.toggle('active',state.activeScreen===id));renderScale();renderBin();renderDryer();renderCombine();renderHMC();renderLoadout();renderReports();renderSettings();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.activeScreen))}
setInterval(()=>{document.getElementById('clockText').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})},1000);document.getElementById('clockText').textContent=new Date().toLocaleString();renderAll();
})();
</script>
